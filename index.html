<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Shifa's Learning Hub 🎓✨ CBSE Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
  color:#2b2b3a;padding:14px;
  background:radial-gradient(circle at 20% 20%,#fff5e6,#f0d9b5 60%,#d9b88a 100%);
  background-attachment:fixed;min-height:100vh;
}
.book-frame{
  max-width:1250px;margin:0 auto;position:relative;
  background:linear-gradient(135deg,#fffefb,#fff8ee 50%,#fffefb);
  border-radius:14px;
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 10px #8B5A2B,
    0 0 0 13px #d4a373,
    0 0 0 16px #8B5A2B,
    0 25px 60px rgba(80,50,20,.35),
    0 8px 20px rgba(0,0,0,.2);
  overflow:hidden;padding:0;margin-top:24px;margin-bottom:24px;
}
.book-frame::before,
.book-frame::after{
  content:'';position:absolute;width:60px;height:60px;
  background:
    radial-gradient(circle at 30% 30%,#FFD60A 0 25%,transparent 30%),
    radial-gradient(circle at 70% 30%,#FF3B30 0 25%,transparent 30%),
    radial-gradient(circle at 30% 70%,#0A84FF 0 25%,transparent 30%),
    radial-gradient(circle at 70% 70%,#34C759 0 25%,transparent 30%);
  z-index:5;pointer-events:none;
}
.book-frame::before{top:14px;left:14px}
.book-frame::after{bottom:14px;right:14px}
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  background:linear-gradient(135deg,#fffefb,#fff5e6);
  border-bottom:3px double #8B5A2B;
  box-shadow:0 4px 20px rgba(139,90,43,.15);
}
header h1{font-size:1.05rem;font-weight:800;line-height:1.1;color:#5a3a1a}
header .sub{font-size:.7rem;opacity:.75;font-weight:600;color:#8B5A2B}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:2px solid #d4a373;
  cursor:pointer;background:#fff;box-shadow:0 3px 8px rgba(139,90,43,.2);
  font-size:1.25rem;display:grid;place-items:center;transition:.2s;flex:0 0 auto;
}
.icon-btn:hover{transform:translateY(-2px);background:#fff8ee}
.icon-btn:active{transform:scale(.94)}
.spacer{flex:1}
.stars{background:linear-gradient(135deg,#FFF5CC,#FFE066);
  border:2px solid #d4a373;border-radius:14px;padding:7px 14px;font-weight:800;
  box-shadow:0 3px 8px rgba(139,90,43,.2);white-space:nowrap;font-size:.9rem;
  color:#7a4a10}
main{padding:22px 20px 60px}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5.5vw,2.6rem);font-weight:800;
  background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.75;font-weight:600;font-size:.98rem;color:#5a3a1a}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.info-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card,.item{
  border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(145deg,#fffefb,#fff5e6);
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 8px 20px rgba(139,90,43,.18), 0 3px 6px rgba(139,90,43,.1);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  position:relative;overflow:hidden;text-align:center;border-radius:20px;
}
.card{padding:24px 14px;gap:8px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-8px) scale(1.04);
  box-shadow:0 20px 40px rgba(139,90,43,.3)}
.card:active,.item:active{transform:scale(.96)}
.card .emo{font-size:3rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.card .ttl{font-weight:800;font-size:1.05rem;color:#5a3a1a}
.card .sub{font-size:.8rem;opacity:.7;font-weight:600;color:#8B5A2B}
.item{padding:20px 12px;gap:10px;border-radius:22px}
.item .visual{font-size:5.5rem;line-height:1;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.2));transition:transform .3s}
.item:hover .visual{transform:scale(1.15) rotate(-3deg)}
.item .bignum{font-size:3.5rem;font-weight:800;line-height:1.1;color:#7c5cff;
  text-shadow:2px 2px 0 #fff, 4px 4px 8px rgba(124,92,255,.3);
  padding:0 6px;word-break:break-word;max-width:100%;text-align:center}
.item .label{font-weight:800;font-size:1rem;margin-top:4px;color:#5a3a1a}
.item .badge{position:absolute;top:10px;left:10px;
  background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;
  border-radius:12px;padding:2px 12px;font-size:.85rem;font-weight:800}
.swatch{width:90px;height:90px;border-radius:50%;
  box-shadow:inset 0 -8px 15px rgba(0,0,0,.15), inset 0 8px 15px rgba(255,255,255,.4),
  0 8px 20px rgba(0,0,0,.2)}
.num-tile{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:70px;min-height:70px;border-radius:18px;
  font-size:clamp(1.6rem,4.5vw,2.6rem);font-weight:800;color:#fff;
  box-shadow:0 8px 16px rgba(0,0,0,.25), inset 0 -4px 0 rgba(0,0,0,.2);
  text-shadow:0 2px 4px rgba(0,0,0,.35);padding:6px 14px;white-space:nowrap;
}
.item.word-item{grid-column:span 2;padding:22px 16px;min-height:170px;justify-content:center}
.item .wordtext{font-weight:800;line-height:1.15;text-align:center;
  word-break:break-word;overflow-wrap:break-word;
  padding:6px;max-width:100%;color:#5C6BC0}
.item.word-item[data-len="xs"] .wordtext{font-size:2rem}
.item.word-item[data-len="s"]  .wordtext{font-size:1.6rem}
.item.word-item[data-len="m"]  .wordtext{font-size:1.35rem}
.item.word-item[data-len="l"]  .wordtext{font-size:1.15rem}
.item.word-item[data-len="xl"] .wordtext{font-size:1rem}
.sq-card{
  border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(145deg,#ffffff,#f0f4ff);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 12px;gap:6px;border-radius:22px;
  box-shadow:0 8px 20px rgba(80,80,180,.18);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.sq-card::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;
  background:linear-gradient(90deg,#7c5cff,#ff5f9e)}
.sq-card:hover{transform:translateY(-6px) scale(1.03);
  box-shadow:0 18px 35px rgba(80,80,180,.3)}
.sq-card .expr{font-size:1.6rem;font-weight:800;color:#5C6BC0;
  display:flex;align-items:center;gap:8px}
.sq-card .expr sup{font-size:.9rem;color:#7c5cff}
.sq-card .eq{font-size:1rem;color:#8B5A2B;font-weight:700}
.sq-card .res{font-size:2.2rem;font-weight:800;
  background:linear-gradient(135deg,#7c5cff,#ff5f9e);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
.card.info{align-items:flex-start;text-align:left;padding:20px 18px;gap:8px}
.card.info .emo{font-size:2.5rem}
.card.info .ttl{font-size:1.1rem}
.card.info .txt{font-size:.88rem;opacity:.8;font-weight:600;line-height:1.4;color:#5a3a1a}
.card.info .play{align-self:flex-start;background:#eef0ff;color:#5c4dff;
  font-weight:800;border-radius:12px;padding:4px 12px;font-size:.78rem;margin-top:4px}
.lesson{background:#fffefb;border-radius:22px;padding:24px 20px;
  box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:820px;margin:0 auto;
  border:2px solid #e8d5b7}
.lesson h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:6px}
.lesson .chapter{text-align:center;font-size:.85rem;opacity:.75;
  font-weight:700;margin-bottom:18px;color:#8B5A2B}
.sec-title{font-size:1.15rem;font-weight:800;margin:22px 0 12px;color:#5a3a1a;
  display:flex;align-items:center;gap:8px;
  border-bottom:2px dashed #e8d5b7;padding-bottom:6px}
.point{width:100%;border:none;font-family:inherit;cursor:pointer;
  background:#f6f4ff;border-radius:16px;padding:14px 18px;
  font-size:1rem;font-weight:700;text-align:left;transition:.2s;color:#2b2b3a;
  margin-bottom:10px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;
  box-shadow:0 3px 8px rgba(80,80,140,.08)}
.point:hover{background:#e9e5ff;transform:translateX(6px)}
.point.active{background:#7c5cff;color:#fff;transform:scale(1.02)}
.point .dot{flex:0 0 auto;font-size:1.2rem}
.qa-item{background:linear-gradient(135deg,#f9f9ff,#f0f0ff);
  border-radius:16px;padding:14px 16px;margin-bottom:12px;
  border-left:6px solid #7c5cff}
.qa-q{font-weight:800;font-size:1rem;margin-bottom:10px;line-height:1.35;cursor:pointer}
.qa-q:hover{color:#7c5cff}
.qa-a{background:linear-gradient(135deg,#e8fff0,#d8ffe8);border-radius:12px;
  padding:11px 14px;font-size:.95rem;font-weight:700;color:#1b7a45;
  display:none;line-height:1.4}
.qa-a.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.ans-btn{border:none;font-family:inherit;cursor:pointer;
  background:#eef0ff;color:#5c4dff;font-weight:800;border-radius:12px;
  padding:8px 16px;font-size:.85rem;transition:.2s}
.ans-btn:hover{background:#dfe3ff}
.table-view{background:#fffefb;border-radius:22px;padding:24px 20px;
  max-width:540px;margin:0 auto;
  box-shadow:0 12px 30px rgba(139,90,43,.18);border:2px solid #e8d5b7}
.table-view h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:16px}
.trow{width:100%;border:none;font-family:inherit;cursor:pointer;
  background:linear-gradient(145deg,#f6f4ff,#ece9ff);
  border-radius:16px;padding:14px 18px;font-size:1.2rem;font-weight:800;
  text-align:center;transition:.2s;color:#2b2b3a;margin-bottom:9px;
  letter-spacing:.5px;box-shadow:0 4px 10px rgba(80,80,140,.1)}
.trow:hover{background:linear-gradient(145deg,#e9e5ff,#dcd6ff);transform:scale(1.02)}
.trow.active{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff;transform:scale(1.03)}
.poem{background:#fff;border-radius:22px;padding:0;overflow:hidden;
  box-shadow:0 15px 40px rgba(139,90,43,.25);max-width:750px;margin:0 auto;
  border:2px solid #e8d5b7}
.poem-hero{padding:30px 20px;text-align:center;position:relative;overflow:hidden}
.poem-hero .hero-pic{font-size:5rem;line-height:1;position:relative;z-index:1;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.25));animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.poem-hero h2{position:relative;z-index:1;font-size:1.5rem;margin:10px 0 4px;color:#fff;
  text-shadow:2px 2px 0 rgba(124,92,255,.5), 0 4px 12px rgba(0,0,0,.3)}
.poem-hero .author{position:relative;z-index:1;font-size:.85rem;color:#fff;
  font-weight:700;opacity:.95;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.poem-body{padding:22px 18px}
.lines{display:flex;flex-direction:column;gap:12px}
.line{border:none;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#f6f4ff,#eef0ff);
  border-radius:18px;padding:16px 20px;font-size:1.1rem;font-weight:700;
  text-align:left;transition:.3s cubic-bezier(.34,1.56,.64,1);color:#2b2b3a;
  line-height:1.5;box-shadow:0 4px 12px rgba(80,80,140,.1);
  display:flex;gap:14px;align-items:center;border-left:5px solid transparent}
.line .pic{font-size:2.2rem;flex:0 0 auto;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.line:hover{background:linear-gradient(135deg,#e9e5ff,#dcd6ff);transform:translateX(8px)}
.line.active{background:linear-gradient(135deg,#7c5cff,#ff5f9e);
  color:#fff;transform:scale(1.04) translateX(6px);
  box-shadow:0 12px 28px rgba(124,92,255,.5),
             0 0 0 4px rgba(255,255,255,.8),
             0 0 30px rgba(124,92,255,.6);
  border-left:5px solid #fff}
.line.active .pic{transform:scale(1.3)}
.poem-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:14px;
  padding:13px 24px;font-weight:800;font-size:1rem;
  background:#eef0ff;color:#5c4dff;transition:.2s;
  box-shadow:0 5px 12px rgba(80,80,140,.12)}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;
  box-shadow:0 10px 22px rgba(124,92,255,.4)}
.btn:hover{transform:translateY(-3px)}
.quiz{background:#fffefb;border-radius:22px;padding:26px 20px;
  box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:680px;margin:0 auto;
  text-align:center;border:2px solid #e8d5b7}
.qmeta{font-weight:800;color:#9aa;font-size:.9rem;margin-bottom:12px}
.qtext{font-size:clamp(1.2rem,4vw,1.7rem);margin:10px 0 24px;color:#2b2b3a;line-height:1.4}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.opt{border:none;font-family:inherit;cursor:pointer;border-radius:18px;
  padding:20px 14px;font-size:1.2rem;font-weight:800;
  background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;
  transition:.2s;box-shadow:0 6px 14px rgba(80,80,140,.12)}
.opt:hover:not(:disabled){transform:translateY(-4px)}
.opt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.opt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.result{background:#fffefb;border-radius:22px;padding:40px 20px;
  text-align:center;box-shadow:0 12px 30px rgba(139,90,43,.18);
  max-width:560px;margin:0 auto;border:2px solid #e8d5b7}
.result h2{margin:16px 0 22px;color:#7c5cff}
.missing-view{background:#fffefb;border-radius:22px;padding:26px 20px;
  box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:680px;margin:0 auto;
  text-align:center;border:2px solid #e8d5b7}
.missing-view .picture{font-size:7rem;line-height:1;margin:10px 0 20px;
  filter:drop-shadow(0 10px 15px rgba(0,0,0,.2))}
.missing-view .question{font-size:3.5rem;font-weight:800;color:#2b2b3a;
  letter-spacing:8px;margin:20px 0}
.missing-view .question .blank{color:#7c5cff;background:#f0edff;
  padding:0 15px;border-radius:12px;border-bottom:5px dashed #7c5cff}
.missing-view .label{font-size:1.2rem;font-weight:700;color:#9aa;margin-bottom:10px}
.missing-options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.mopt{border:none;font-family:inherit;cursor:pointer;border-radius:18px;
  padding:20px 28px;font-size:1.8rem;font-weight:800;
  background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;
  transition:.2s;box-shadow:0 6px 14px rgba(80,80,140,.12);min-width:80px}
.mopt:hover:not(:disabled){transform:translateY(-4px) scale(1.05)}
.mopt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.mopt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.match-view{background:#fffefb;border-radius:22px;padding:26px 20px;
  box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:750px;margin:0 auto;
  border:2px solid #e8d5b7}
.match-view h2{text-align:center;color:#7c5cff;font-size:1.4rem;margin-bottom:20px}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.match-col h3{text-align:center;font-size:.9rem;color:#9aa;margin-bottom:12px;font-weight:800}
.match-btn{width:100%;border:none;font-family:inherit;cursor:pointer;
  border-radius:16px;padding:16px;font-size:1.4rem;font-weight:800;
  background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;
  transition:.2s;margin-bottom:10px;box-shadow:0 5px 12px rgba(80,80,140,.1)}
.match-btn:hover:not(:disabled){transform:translateY(-3px)}
.match-btn.sel{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff}
.match-btn.done{background:linear-gradient(145deg,#34C759,#28a745);color:#fff;
  opacity:.5;cursor:default}
.match-btn.err{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.opp-card{grid-column:span 2;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(145deg,#fffefb,#fff5e6);
  display:flex;align-items:center;justify-content:space-around;
  gap:8px;padding:22px 14px;border-radius:22px;
  box-shadow:0 8px 20px rgba(139,90,43,.18);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative}
.opp-card::before{content:'';position:absolute;inset:0 0 auto 0;height:7px;
  background:linear-gradient(90deg,#ff5f9e,#7c5cff);border-radius:22px 22px 0 0}
.opp-card:hover{transform:translateY(-6px) scale(1.02)}
.opp-side{display:flex;flex-direction:column;align-items:center;flex:1;gap:6px}
.opp-pic{line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.opp-label{font-weight:800;font-size:1rem;color:#5a3a1a}
.opp-arrow{font-size:2rem;color:#7c5cff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){
  body{padding:6px}
  .book-frame{margin-top:14px;margin-bottom:14px;
    box-shadow:0 0 0 2px #fff,0 0 0 7px #8B5A2B,0 0 0 9px #d4a373,0 0 0 11px #8B5A2B,
      0 15px 40px rgba(80,50,20,.35)}
  main{padding:14px 12px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .item .visual{font-size:4rem}
  .item .bignum{font-size:3rem}
  .card .emo{font-size:2.2rem}
  .swatch{width:70px;height:70px}
  .missing-view .picture{font-size:5rem}
  .missing-view .question{font-size:2.5rem;letter-spacing:5px}
  .item.word-item[data-len="xs"] .wordtext{font-size:1.6rem}
  .item.word-item[data-len="s"]  .wordtext{font-size:1.3rem}
  .item.word-item[data-len="m"]  .wordtext{font-size:1.15rem}
  .item.word-item[data-len="l"]  .wordtext{font-size:1rem}
  .item.word-item[data-len="xl"] .wordtext{font-size:.9rem}
}
</style>
</head>
<body>

<div class="book-frame">
<header>
  <button class="icon-btn" id="backBtn" onclick="goBack()">⬅️</button>
  <div>
    <h1 id="hTitle">Kids Learning Hub</h1>
    <div class="sub" id="hSub">CBSE Pattern • Class Wise</div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="muteBtn" onclick="toggleSound()">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="screen"></main>
</div>

<script>
/* =========================================================
   SECTION 1: ROMAN URDU → HINDI CONVERTER
   ========================================================= */
const ROMAN_TO_HINDI = {
  'hai':'है','hain':'हैं','tha':'था','thi':'थी','the':'थे',
  'mein':'में','me':'में','ek':'एक','yeh':'यह','ye':'यह','woh':'वह','wo':'वह','vo':'वह',
  'kya':'क्या','kaise':'कैसे','kyun':'क्यों','kyu':'क्यों',
  'kab':'कब','kaun':'कौन','kahan':'कहाँ','jahan':'जहाँ',
  'yahan':'यहाँ','wahan':'वहाँ','abhi':'अभी','tabhi':'तभी','kabhi':'कभी',
  'yehi':'यही','wahi':'वही','lagta':'लगता','lagti':'लगती','lagte':'लगते',
  'aata':'आता','aati':'आती','aate':'आते','jaata':'जाता','jaati':'जाती','jaate':'जाते',

function fixRomanUrdu(text){
  if(!text) return text;
  let result = String(text);
  const keys = Object.keys(ROMAN_TO_HINDI).sort((a,b) => b.length - a.length);
  for(const key of keys){
    const regex = new RegExp('\\b' + key + '\\b', 'gi');
    result = result.replace(regex, () => ROMAN_TO_HINDI[key]);
  }
  return result;
}

function prepareSpeech(text){
  let t = String(text);
  /* Fix Baa -> बा */
  t = t.replace(/\bBaa\b/gi, 'बा');
  t = t.replace(/\bba\b/gi, 'बा');
  /* Roman Urdu -> Hindi */
  t = fixRomanUrdu(t);
  return t;
}

let voices = [];
let soundOn = true;
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(lang){
  const base = lang.split('-')[0];
  const isHindi = base === 'hi';
  const preferredNames = isHindi
    ? ['Google हिन्दी','Microsoft Swara','Microsoft Kalpana','Lekha','Aditi',
       'Google UK English Female','Microsoft Zira','Microsoft Heera']
    : ['Google UK English Female','Microsoft Zira','Samantha','Microsoft Heera',
       'Google US English','Microsoft Aria','Karen','Tessa'];
  for(const name of preferredNames){
    const v = voices.find(v => v.name && v.name.includes(name));
    if(v) return v;
  }
  const indian = voices.find(v => v.lang.replace('_','-') === 'en-IN');
  if(indian) return indian;
  const female = voices.find(v => v.lang.replace('_','-').startsWith(base)
    && /female|zira|samantha|heera|aria|swara/i.test(v.name||''));
  if(female) return female;
  return voices.find(v => v.lang.replace('_','-').startsWith(base)) || null;
}

function speak(text, lang='hi-IN', rate=0.75){
  if(!soundOn || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const processed = prepareSpeech(text);
  const u = new SpeechSynthesisUtterance(String(processed));
  u.lang = lang;
  u.rate = rate;
  u.pitch = 1.2;
  u.volume = 1;
  const v = pickVoice(lang);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakSequence(lines, lang='hi-IN', onLine){
  if(!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i = 0;
  const go = () => {
    if(i >= lines.length){ if(onLine) onLine(-1); return; }
    if(onLine) onLine(i);
    const processed = prepareSpeech(lines[i]);
    const u = new SpeechSynthesisUtterance(processed);
    u.lang = lang; u.rate = 0.7; u.pitch = 1.25;
    const v = pickVoice(lang); if(v) u.voice = v;
    u.onend = () => { i++; setTimeout(go, 320); };
    speechSynthesis.speak(u);
  };
  go();
}
function toggleSound(){
  soundOn = !soundOn;
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('muteBtn').textContent = soundOn ? '🔊' : '🔇';
}

function numToWord(n){
  const ones = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
    'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n < 20) return ones[n];
  if(n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  return 'One Hundred';
}
function makeNumbers(max){
  const arr = [];
  for(let i=0; i<=max; i++) arr.push({n:i, word:numToWord(i)});
  return arr;
}
function makeTables(from, to){
  const arr = [];
  for(let t=from; t<=to; t++){
    const rows=[], spoken=[];
    for(let i=1; i<=10; i++){
      rows.push(`${t} × ${i} = ${t*i}`);
      spoken.push(`${t} times ${i} is ${t*i}`);
    }
    arr.push({n:t, rows, spoken});
  }
  return arr;
}
function shuffle(arr){
  for(let i = arr.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function squareCards(from, to){
  const arr = [];
  for(let i=from; i<=to; i++) arr.push({n:i, val:i*i});
  return arr;
}
function cubeCards(from, to){
  const arr = [];
  for(let i=from; i<=to; i++) arr.push({n:i, val:i*i*i});
  return arr;
}

function setHeader(title, sub){
  hTitle.textContent = title;
  hSub.textContent   = sub;
  backBtn.style.visibility = state.view === 'home' ? 'hidden' : 'visible';
}
function goHome(){ state = {level:null,cat:null,view:'home'}; renderHome(); }
function goLevel(k){ state = {level:k,cat:null,view:'level'}; renderLevel(); }
function goCat(c){ state.cat = c; state.view = 'cat'; renderCategory(); }
function goBack(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(state.view === 'home') return;
  if(state.view === 'level'){ state = {level:null,cat:null,view:'home'}; renderHome(); return; }
  state.view = 'level'; state.cat = null; renderLevel();
}

      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openWriting(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">${it.items.length} items</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'lesson'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openLesson(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">${it.chapter}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'tablelist'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((t,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openTable(${i})">
          <span class="emo">✖️</span>
          <span class="ttl">Table of ${t.n}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'square'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="sq-card" onclick="tapSquare(${i}, 'sq')">
          <span class="expr">${it.n}<sup>2</sup></span>
          <span class="eq">${it.n} × ${it.n}</span>
          <span class="res">= ${it.val}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'cube'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="sq-card" onclick="tapSquare(${i}, 'cube')">
          <span class="expr">${it.n}<sup>3</sup></span>
          <span class="eq">${it.n} × ${it.n} × ${it.n}</span>
          <span class="res">= ${it.val}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'quiz'){
    screen.innerHTML = `<div id="quizBox"></div>`;
    quizState = { idx:0, score:0, questions: shuffle([...data.questions]).slice(0,10) };
    drawQuiz();
  } else if(data.type === 'missing-letter'){
    missingState = { idx:0, score:0, list: shuffle([...currentItems]).slice(0,10) };
    drawMissingLetter(); return;
  } else if(data.type === 'missing-number'){
    missingState = { idx:0, score:0, list: shuffle([...currentItems]).slice(0,10) };
    drawMissingNumber(); return;
  } else if(data.type === 'matching'){
    matchState = { selLeft:null, done:0, items: data.items };
    drawMatching(); return;
  }
  window.scrollTo(0,0);
}

function cardHTML(it, i){
  let visual, extraClass = '', dataLen = '';
  if(it.numTile){
    visual = `<span class="num-tile" style="background:${it.numTile}">${it.main}</span>`;
  } else if(it.isWord){
    extraClass = 'word-item';
    const len = it.main.length;
    if(len <= 5) dataLen = 'xs';
    else if(len <= 7) dataLen = 's';
    else if(len <= 9) dataLen = 'm';
    else if(len <= 11) dataLen = 'l';
    else dataLen = 'xl';
    visual = `<span class="wordtext">${it.main}</span>`;
  } else if(it.color && !it.badge && !it.emoji){
    visual = `<span class="swatch" style="background:${it.color}"></span>`;
  } else if(it.emoji){
    visual = `<span class="visual">${it.emoji}</span>`;
  } else {
    visual = `<span class="bignum">${it.main}</span>`;
  }
  return `<button class="item ${extraClass}" data-len="${dataLen}" onclick="tap(${i})">
    ${it.badge ? `<span class="badge">${it.badge}</span>` : ''}
    ${visual}
    <span class="label">${it.sub || it.main}</span>
  </button>`;
}

function drawMissingLetter(){
  if(missingState.idx >= missingState.list.length){
    screen.innerHTML = `<div class="result">
      <div style="font-size:4rem">🏆</div>
      <h2>Score: ${missingState.score} / ${missingState.list.length}</h2>
      <button class="btn primary" onclick="renderCategory()">🔄 Wapas</button>
    </div>`;
    speak('Well done!');
    return;
  }
  const item = missingState.list[missingState.idx];
  const word = item.word;
  const pos = Math.floor(Math.random() * word.length);
  const correct = word[pos];
  const display = word.split('').map((ch,i) => i===pos
    ? '<span class="blank">_</span>' : ch).join('');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const options = [correct];
  while(options.length < 3){
    const r = letters[Math.floor(Math.random()*26)];
    if(!options.includes(r)) options.push(r);
  }
  shuffle(options);
  screen.innerHTML = `
    <div class="missing-view">
      <div class="qmeta">Question ${missingState.idx+1} / ${missingState.list.length} • ⭐ ${missingState.score}</div>
      <div class="picture">${item.emoji}</div>
      <div class="label">Missing letter dhoondo 👇</div>
      <div class="question">${display}</div>
      <div class="missing-options">
        ${options.map(o => `<button class="mopt" onclick="answerMissingLetter('${o}','${correct}')">${o}</button>`).join('')}
      </div>
    </div>`;
  speak('Which letter is missing in ' + word.split('').join(' '));
}
function answerMissingLetter(opt, correct){
  const btns = document.querySelectorAll('.mopt');
  btns.forEach(b => b.disabled = true);
  if(opt === correct){
    missingState.score++;
    btns.forEach(b => { if(b.textContent.trim() === opt) b.classList.add('right'); });
    speak('Correct!'); addStar();
  } else {
    btns.forEach(b => {
      if(b.textContent.trim() === opt) b.classList.add('wrong');
      if(b.textContent.trim() === correct) b.classList.add('right');
    });
    speak('Oops! Correct answer is ' + correct);
  }
  setTimeout(() => { missingState.idx++; drawMissingLetter(); }, 1600);
}
function drawMissingNumber(){
  if(missingState.idx >= missingState.list.length){
    screen.innerHTML = `<div class="result">
      <div style="font-size:4rem">🏆</div>
      <h2>Score: ${missingState.score} / ${missingState.list.length}</h2>
      <button class="btn primary" onclick="renderCategory()">🔄 Wapas</button>
    </div>`;
    speak('Well done!');
    return;
  }
  const item = missingState.list[missingState.idx];
  const n = item.n;
  const mode = Math.floor(Math.random()*3);
  let display, correct;
  if(mode === 0){ display = `_ , ${n+1} , ${n+2}`; correct = n; }
  else if(mode === 1){ display = `${n-1} , _ , ${n+1}`; correct = n; }
  else { display = `${n-1} , ${n} , _`; correct = n+1; }
  const options = [correct];
  while(options.length < 3){
    const r = correct + Math.floor(Math.random()*7) - 3;
    if(r >= 0 && !options.includes(r)) options.push(r);
  }
  shuffle(options);
  screen.innerHTML = `
    <div class="missing-view">
      <div class="qmeta">Question ${missingState.idx+1} / ${missingState.list.length} • ⭐ ${missingState.score}</div>
      <div class="picture">🔢</div>
      <div class="label">Missing number dhoondo 👇</div>
      <div class="question" style="font-size:2.5rem">${display}</div>
      <div class="missing-options">
        ${options.map(o => `<button class="mopt" onclick="answerMissingNumber(${o},${correct})">${o}</button>`).join('')}
      </div>
    </div>`;
  speak('Which number is missing?');
}
function answerMissingNumber(opt, correct){
  const btns = document.querySelectorAll('.mopt');
  btns.forEach(b => b.disabled = true);
  if(opt === correct){
    missingState.score++;
    btns.forEach(b => { if(parseInt(b.textContent) === opt) b.classList.add('right'); });
    speak('Correct!'); addStar();
  } else {
    btns.forEach(b => {
      if(parseInt(b.textContent) === opt) b.classList.add('wrong');
      if(parseInt(b.textContent) === correct) b.classList.add('right');
    });
    speak('Oops! Correct answer is ' + correct);
  }
  setTimeout(() => { missingState.idx++; drawMissingNumber(); }, 1600);
}

function drawMatching(){
  const items = matchState.items;
  const lefts = items.map(it => it.left);
  const rights = shuffle([...items.map(it => it.right)]);
  screen.innerHTML = `
    <div class="match-view">
      <h2>🎯 Match the Following</h2>
      <div class="match-cols">
        <div class="match-col">
          <h3>Left</h3>
          ${lefts.map(l => `<button class="match-btn" data-side="L" data-val="${l}" onclick="clickMatch(this)">${l}</button>`).join('')}
        </div>
        <div class="match-col">
          <h3>Right</h3>
          ${rights.map(r => `<button class="match-btn" data-side="R" data-val="${r}" onclick="clickMatch(this)">${r}</button>`).join('')}
        </div>
      </div>
      <div class="poem-actions">
        <button class="btn primary" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function clickMatch(btn){
  if(btn.classList.contains('done')) return;
  const side = btn.dataset.side;
  const val = btn.dataset.val;
  if(side === 'L'){
    document.querySelectorAll('[data-side="L"]').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    matchState.selLeft = btn;
    speak(val);
  } else {
    if(!matchState.selLeft){ speak('Pehle left side se choose karo'); return; }
    const leftVal = matchState.selLeft.dataset.val;
    const correct = matchState.items.find(it => it.left === leftVal);
    if(correct && correct.right === val){
      matchState.selLeft.classList.remove('sel');
      matchState.selLeft.classList.add('done');
      btn.classList.add('done');
      matchState.selLeft = null;
      matchState.done++;
      speak('Correct!'); addStar();
      if(matchState.done === matchState.items.length){
        setTimeout(() => { speak('Excellent!'); alert('🎉 Shabaash!'); }, 400);
      }
    } else {
      btn.classList.add('err');
      matchState.selLeft.classList.remove('sel');
      matchState.selLeft = null;
      speak('Try again');
      setTimeout(() => btn.classList.remove('err'), 700);
    }
  }
}
