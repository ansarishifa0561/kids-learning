<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifa's Learning Hub | CBSE Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== ORANGE & CREAM THEME UI ===== */
:root {
  --primary: #f39c12; /* Orange */
  --primary-dark: #e67e22;
  --bg: #0aeed3;
  --sidebar-bg: #fff5e6;
  --text: #1d0d0a;
  --muted: #8d6e63;
  --border: #ffe0b2;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Baloo 2', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Top Navbar */
.topnav {
  background: var(--white); display: flex; align-items: center;
  border-bottom: 2px solid var(--border); height: 60px; padding: 0 20px;
  box-shadow: 0 2px 10px rgba(243, 156, 18, 0.1); z-index: 100;
}
.logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); margin-right: 30px; }
.logo-icon { font-size: 1.8rem; }

/* Class Tabs */
.class-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
.class-tab {
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-weight: 700; border: none; background: transparent; color: var(--muted);
  white-space: nowrap; transition: 0.2s; font-family: inherit; font-size: 0.95rem;
}
.class-tab:hover { background: #ffe0b2; color: var(--primary-dark); }
.class-tab.active { background: var(--primary); color: var(--white); }
.stars-display { margin-left: auto; background: #fff3e0; border: 1px solid #ffcc80; padding: 6px 12px; border-radius: 8px; font-weight: 800; color: #e65100; }

/* Layout */
.layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 250px; background: var(--sidebar-bg);
  border-right: 2px solid var(--border);
  overflow-y: auto; padding: 20px 0;
}
.subject-title { padding: 10px 20px; font-weight: 800; font-size: 1.1rem; color: var(--primary-dark); border-bottom: 2px solid var(--border); margin-bottom: 10px; margin-top: 10px; }
.topic-list { list-style: none; }
.topic-list li { padding: 10px 20px; cursor: pointer; font-weight: 600; color: var(--muted); transition: 0.2s; border-left: 4px solid transparent; }
.topic-list li:hover { background: lch(57.93% 92.65 45.84); color: var(--primary-dark); }
.topic-list li.active { background: #fb6101; color: var(--primary-dark); border-left-color: var(--primary); font-weight: 800;}

/* Content Area */
.content { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); }
.content h1 { font-size: 2.2rem; color: var(--primary-dark); margin-bottom: 20px; font-weight: 800; }
.content p { font-size: 1.1rem; line-height: 1.6; color: var(--muted); margin-bottom: 20px; }

/* Interactive Grids */
.interactive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 25px; margin: 20px 0; }
.grid-item {
  border: 3px solid var(--border); border-radius: 20px; padding: 25px 15px;
  text-align: center; cursor: pointer; transition: 0.2s; background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.grid-item:hover { border-color: var(--primary); background: #fff8e1; transform: translateY(-5px); box-shadow: 0 10px 25px rgba(243, 156, 18, 0.2); }
.grid-item .pic { font-size: 4.5rem; display: block; margin-bottom: 15px; }
.grid-item .text { font-size: 1.3rem; font-weight: 800; color: var(--text); }

/* Large Shape SVG */
.shape-svg { width: 110px; height: 110px; margin-bottom: 15px; }

/* Fill in the Blanks (Missing Alpha) 3-Column */
.fill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
.fill-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 2rem; font-weight: 800; color: var(--text);
  background: var(--white); padding: 15px 20px; border-radius: 16px; border: 2px solid var(--border);
  box-shadow: 0 4px 10px rgba(243, 156, 18, 0.05);
}
.fill-item .emoji-hint { font-size: 2.2rem; margin-left: 15px; }
.blank-input {
  width: 55px; height: 55px; border: 3px solid var(--primary); border-radius: 12px;
  text-align: center; font-size: 2rem; font-weight: 800; outline: none; text-transform: uppercase;
  background: var(--white); color: var(--primary-dark);
}
.blank-input:focus { box-shadow: 0 0 12px rgba(243, 156, 18, 0.4); }
.blank-input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

/* Counting */
.count-item {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 2.5rem; margin-bottom: 20px; background: var(--white);
  padding: 15px 25px; border-radius: 16px; border: 2px solid var(--border);
  letter-spacing: 5px;
}
.count-input {
  width: 80px; height: 60px; border: 3px solid var(--primary); border-radius: 12px;
  text-align: center; font-size: 2rem; font-weight: 800; outline: none; letter-spacing: 0;
}
.count-input:focus { box-shadow: 0 0 12px rgba(243, 156, 18, 0.4); }
.count-input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

/* Colorful Rhyme Page (Normal Lines) */
.rhyme-page {
  border-radius: 24px; padding: 40px; text-align: center; position: relative; overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto;
}
.rhyme-page h2 { font-size: 2.8rem; color: #fff; margin-bottom: 20px; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); }
.rhyme-cartoon { font-size: 7rem; margin-bottom: 30px; animation: bounce 2s infinite; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2)); }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.rhyme-line {
  font-size: 1.6rem; font-weight: 800; color: var(--text); margin: 12px 0;
  background: rgba(255,255,255,0.95); padding: 15px 20px; border-radius: 20px;
  cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}
.rhyme-line:hover { background: #fff; transform: scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }

/* Numbers Grid */
.numbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 20px; margin: 20px 0; }
.number-card {
  border: 3px solid var(--border); border-radius: 20px; padding: 20px 10px;
  text-align: center; cursor: pointer; transition: 0.2s; background: var(--white);
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.number-card:hover { border-color: var(--primary); transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 25px rgba(243, 156, 18, 0.2); }
.number-card .num { font-size: 3rem; font-weight: 800; color: var(--primary-dark); }

/* Matching Game */
.matching-container { display: flex; justify-content: space-around; gap: 40px; margin-top: 30px; max-width: 400px; }
.match-col { display: flex; flex-direction: column; gap: 15px; }
.match-item { border: 3px solid var(--border); border-radius: 12px; padding: 15px 30px; font-size: 2rem; font-weight: 800; cursor: pointer; text-align: center; background: var(--white); transition: 0.2s; width: 100px; user-select: none; }
.match-item.selected { border-color: var(--primary); background: #ffe0b2; }
.match-item.matched { border-color: #34C759; background: #d8fff0; color: #08764d; cursor: default; }

/* My Self Form */
.myself-form { max-width: 600px; margin: 0 auto; font-size: 1.5rem; font-weight: 600; line-height: 2.5; color: var(--text); background: var(--white); padding: 30px; border-radius: 20px; border: 2px solid var(--border); }
.myself-form input[type="text"] { border: none; border-bottom: 3px dashed var(--primary); outline: none; font-size: 1.5rem; font-family: inherit; font-weight: 700; color: var(--primary-dark); background: transparent; text-align: center; width: 200px; }
.myself-form input[type="radio"] { transform: scale(1.5); margin: 0 10px; cursor: pointer; }

/* Q&A Section */
.qa-item { background: var(--white); border: 2px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
.qa-q { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
.qa-a { display: none; font-size: 1.3rem; font-weight: 600; color: #08764d; background: #d8fff0; padding: 10px 15px; border-radius: 10px; margin-top: 10px; }
.qa-btn { margin-top: 10px; padding: 8px 15px; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-family: inherit; }

/* 3-Column Math Grid */
.textbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
.tb-item { display: flex; align-items: center; justify-content: space-between; background: var(--white); padding: 10px 15px; border-radius: 10px; border: 2px solid var(--border); font-size: 1.4rem; font-weight: 800; }
.tb-item input { width: 60px; height: 45px; font-size: 1.4rem; text-align: center; border: 2px solid var(--primary); border-radius: 8px; outline: none; }
.tb-item input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; padding: 10px; gap: 10px; }
  .subject-title { display: none; }
  .topic-list { display: flex; gap: 10px; }
  .topic-list li { white-space: nowrap; border-left: none; border-bottom: 4px solid transparent; padding: 8px 12px; }
  .topic-list li.active { border-left: none; border-bottom-color: var(--primary); }
  .content { padding: 20px; }
  .textbook-grid { grid-template-columns: 1fr; }
  .fill-grid { grid-template-columns: 1fr; }
}
</style>
</head>

function generate30Items(category) {
  return items30[category].map(item => ({ text: item.t, emoji: item.e, say: item.t }));
}

function generateAdd30() {
  const arr = [];
  for (let i = 0; i < 30; i++) {
    let a = Math.floor(Math.random() * 10) + 1;
    let b = Math.floor(Math.random() * 10) + 1;
    arr.push({ a: a, b: b, ans: a + b, op: '+' });
  }
  return arr;
}

function generateSub30() {
  const arr = [];
  for (let i = 0; i < 30; i++) {
    let a = Math.floor(Math.random() * 10) + 5;
    let b = Math.floor(Math.random() * 5) + 1;
    arr.push({ a: a, b: b, ans: a - b, op: '-' });
  }
  return arr;
}

function generateNumbers(max) {
  const arr = [];
  for (let i = 1; i <= max; i++) arr.push({ num: i, say: `${i}` });

}

function generateNumWords() {
  const words = ['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
  return words.map((w, i) => ({ num: i + 1, word: w }));
}

classes.forEach(c => {

  }

// =========================================
// 4. UI HELPERS & RENDER LOGIC
// =========================================
function addStar() {
  stars++;
  localStorage.setItem('shifaStars', stars);
  document.getElementById('starCount').textContent = stars;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

const tabsContainer = document.getElementById('classTabs');
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');

function renderTabs() {
  tabsContainer.innerHTML = classes.map(c => `
    <button class="class-tab ${c === currentClass ? 'active' : ''}" onclick="switchClass('${c}')">
      ${classNames[c]}
    </button>
  `).join('');
}

function switchClass(c) {
  currentClass = c;
  renderTabs();
  renderSidebar();
  content.innerHTML = `<h1>👋 Welcome to ${classNames[c]} Dashboard</h1><p>Select a topic from the left sidebar to start learning.</p>`;
}

function renderSidebar() {
  const data = contentData[currentClass];
  let html = '';
  data.subjects.forEach(sub => {
    html += `<div class="subject-title">${sub.name}</div><ul class="topic-list">`;
    sub.topics.forEach(t => {
      html += `<li id="tab-${t.id}" onclick="loadTopic('${sub.name}', '${t.id}')">${t.title}</li>`;
    });
    html += `</ul>`;
  });
  sidebar.innerHTML = html;
}

function loadTopic(subjectName, topicId) {
  document.querySelectorAll('.topic-list li').forEach(el => el.classList.remove('active'));
  const activeTab = document.getElementById(`tab-${topicId}`);
  if(activeTab) activeTab.classList.add('active');

  const sub = contentData[currentClass].subjects.find(s => s.name === subjectName);
  const topic = sub.topics.find(t => t.id === topicId);

  content.innerHTML = `<h1>${topic.title}</h1>`;

  if (topic.type === 'grid') {
    content.innerHTML += `<div class="interactive-grid">
      ${topic.data.map(item => `
        <div class="grid-item" onclick="speak('${item.say || item.text}'); addStar();">
          ${item.svg ? item.svg : (item.emoji ? `<span class="pic">${item.emoji}</span>` : '')}
          <span class="text">${item.text}</span>
        </div>
      `).join('')}
    </div>`;
  } 
  else if (topic.type === 'rhyme') {
    content.innerHTML += `
      <div class="rhyme-page" style="background: ${topic.data.color};">
        <div class="rhyme-cartoon">${topic.data.emoji}</div>
        <h2>${topic.title}</h2>
        ${topic.data.lines.map(line => `<div class="rhyme-line" onclick="speak('${line}')">🎵 ${line}</div>`).join('')}
      </div>`;
  } 
  else if (topic.type === 'numbers') {
    content.innerHTML += `<p>Click on any number to hear its name.</p>
    <div class="numbers-grid">
      ${topic.data.map(item => `
        <div class="number-card" onclick="speak('${item.say}'); addStar();" style="padding: 35px 10px;">
          <div class="num">${item.num}</div>
        </div>
      `).join('')}
    </div>`;
  } 
  else if (topic.type === 'add') {
    content.innerHTML += `<p>Solve these questions.</p>
    <div class="textbook-grid">
      ${topic.data.map((item, index) => `
        <div class="tb-item">
          <span>${item.a} ${item.op} ${item.b} = </span>
          <input type="number" id="add-${index}" oninput="checkAdd(${index}, ${item.ans})">
        </div>
      `).join('')}
    </div>`;
  } 
  else if (topic.type === 'fill' || topic.type === 'missing') {
    content.innerHTML += `<p>Type the missing letter in the box.</p><div class="fill-grid">`;
    topic.data.forEach((item, index) => {
      const displayWord = item.word.split('').map((char, i) => 
        i === item.blankIndex ? `<input type="text" maxlength="1" class="blank-input" id="blank-${index}" oninput="checkFill(${index}, '${char}')">` : char
      ).join('');
      content.innerHTML += `<div class="fill-item">${displayWord} <span class="emoji-hint">${item.emoji}</span></div>`;
    });
    content.innerHTML += `</div>`;
  } 
  else if (topic.type === 'match') {
    content.innerHTML += `<p>Click a Capital letter, then click its Small letter to match.</p>
    <div class="matching-container">
      <div class="match-col" id="cap-col">${topic.data.map((item, i) => `<div class="match-item" id="cap-${i}" onclick="selectMatch('cap', ${i}, '${item.sm}')">${item.cap}</div>`).join('')}</div>
      <div class="match-col" id="sm-col">${topic.data.sort(() => Math.random() - 0.5).map((item, i) => `<div class="match-item" id="sm-${i}" onclick="selectMatch('sm', ${i}, '${item.sm}')">${item.sm}</div>`).join('')}</div>
    </div>`;
  } 
  else if (topic.type === 'myself') {
    content.innerHTML += `
      <div class="myself-form">
        <p>My name is <input type="text" placeholder="Your Name"></p>
        <p>I am a <input type="radio" name="gender" value="boy"> Boy / <input type="radio" name="gender" value="girl"> Girl</p>
        <p>I study in ${classNames[currentClass]} class.</p>
        <p>I live in <input type="text" placeholder="Your City"></p>
        <p>My favourite colour is <input type="text" placeholder="Colour" style="width:150px;"></p>
        <p>My favourite fruit is <input type="text" placeholder="Fruit" style="width:150px;"></p>
        <p>I love my family and friends.</p>
      </div>`;
  } 
  else if (topic.type === 'numwords') {
    content.innerHTML += `<p>Match the numbers with their words.</p><div class="interactive-grid">`;
    topic.data.forEach(item => {
      content.innerHTML += `<div class="grid-item" onclick="speak('${item.word}'); addStar();">
        <div class="num" style="font-size:2.5rem; font-weight:800; color:var(--primary-dark);">${item.num}</div>
        <div style="font-size:1.2rem; font-weight:700;">${item.word}</div>
      </div>`;
    });
    content.innerHTML += `</div>`;
  }
}

// =========================================
// 5. INTERACTIVE LOGIC
// =========================================
function checkAdd(index, correctAns) {
  const input = document.getElementById(`add-${index}`);
  if(parseInt(input.value) === correctAns) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else { input.classList.remove('correct'); }
}

function checkFill(index, correctChar) {
  const input = document.getElementById(`blank-${index}`);
  if(input.value.toUpperCase() === correctChar.toUpperCase()) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else { input.classList.remove('correct'); }
}

let selectedCap = null;
let selectedSm = null;
function selectMatch(type, index, correctSm) {
  const el = document.getElementById(`${type}-${index}`);
  if (el.classList.contains('matched')) return;

  if (type === 'cap') {
    if (selectedCap) document.getElementById(`cap-${selectedCap.index}`).classList.remove('selected');
    selectedCap = { index, value: el.textContent.trim().toLowerCase() };
    el.classList.add('selected');
  } else {
    if (selectedSm) document.getElementById(`sm-${selectedSm.index}`).classList.remove('selected');
    selectedSm = { index, value: el.textContent.trim().toLowerCase() };
    el.classList.add('selected');
  }

  if (selectedCap && selectedSm) {
    if (selectedCap.value === selectedSm.value) {
      document.getElementById(`cap-${selectedCap.index}`).classList.replace('selected', 'matched');
      document.getElementById(`sm-${selectedSm.index}`).classList.replace('selected', 'matched');
      addStar(); speak('Correct!');
    } else {
      document.getElementById(`cap-${selectedCap.index}`).classList.remove('selected');
      document.getElementById(`sm-${selectedSm.index}`).classList.remove('selected');
    }
    selectedCap = null; selectedSm = null;
  }
}

renderTabs();
switchClass('nursery');
</script>
