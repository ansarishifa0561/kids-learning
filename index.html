<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifa's Learning Hub | CBSE Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== PROFESSIONAL ORANGE THEME ===== */
:root {
  --primary: #f39c12;
  --primary-dark: #e67e22;
  --bg: #fffdf9;
  --sidebar-bg: #fff5e6;
  --text: #3e2723;
  --muted: #8d6e63;
  --border: #ffe0b2;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Baloo 2', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Top Navbar */
.topnav {
  background: var(--white); display: flex; align-items: center;
  border-bottom: 2px solid var(--border); height: 60px; padding: 0 20px;
  box-shadow: 0 2px 10px rgba(243, 156, 18, 0.1); z-index: 100;
}
.logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); margin-right: 30px; }
.logo-icon { font-size: 1.8rem; }

/* Class Tabs */
.class-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
.class-tab {
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-weight: 700; border: none; background: transparent; color: var(--muted);
  white-space: nowrap; transition: 0.2s; font-family: inherit; font-size: 0.95rem;
}
.class-tab:hover { background: #ffe0b2; color: var(--primary-dark); }
.class-tab.active { background: var(--primary); color: var(--white); }
.stars-display { margin-left: auto; background: #fff3e0; border: 1px solid #ffcc80; padding: 6px 12px; border-radius: 8px; font-weight: 800; color: #e65100; }

/* Layout */
.layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 250px; background: var(--sidebar-bg);
  border-right: 2px solid var(--border);
  overflow-y: auto; padding: 20px 0;
}
.subject-title { padding: 10px 20px; font-weight: 800; font-size: 1.1rem; color: var(--primary-dark); border-bottom: 2px solid var(--border); margin-bottom: 10px; margin-top: 10px; }
.topic-list { list-style: none; }
.topic-list li { padding: 10px 20px; cursor: pointer; font-weight: 600; color: var(--muted); transition: 0.2s; border-left: 4px solid transparent; }
.topic-list li:hover { background: #ffecb3; color: var(--primary-dark); }
.topic-list li.active { background: #ffe0b2; color: var(--primary-dark); border-left-color: var(--primary); font-weight: 800;}

/* Content Area */
.content { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); }
.content h1 { font-size: 2.2rem; color: var(--primary-dark); margin-bottom: 20px; font-weight: 800; }
.content p { font-size: 1.1rem; line-height: 1.6; color: var(--muted); margin-bottom: 20px; }

/* Interactive Grids */
.interactive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 25px; margin: 20px 0; }
.grid-item {
  border: 3px solid var(--border); border-radius: 20px; padding: 25px 15px;
  text-align: center; cursor: pointer; transition: 0.2s; background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.grid-item:hover { border-color: var(--primary); background: #fff8e1; transform: translateY(-5px); box-shadow: 0 10px 25px rgba(243, 156, 18, 0.2); }
.grid-item .pic { font-size: 4.5rem; display: block; margin-bottom: 15px; }
.grid-item .text { font-size: 1.3rem; font-weight: 800; color: var(--text); }

/* Shapes */
.shape-svg { width: 110px; height: 110px; margin-bottom: 15px; }

/* Fill in the Blanks */
.fill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
.fill-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 2rem; font-weight: 800; color: var(--text);
  background: var(--white); padding: 15px 20px; border-radius: 16px; border: 2px solid var(--border);
}
.fill-item .emoji-hint { font-size: 2.2rem; margin-left: 15px; }
.blank-input {
  width: 55px; height: 55px; border: 3px solid var(--primary); border-radius: 12px;
  text-align: center; font-size: 2rem; font-weight: 800; outline: none; text-transform: uppercase;
}
.blank-input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

/* Missing Letters */
.missing-letters-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; margin-top: 20px; max-width: 800px; }
.ml-box { background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 15px 5px; text-align: center; font-size: 2rem; font-weight: 800; color: var(--primary-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
.ml-input { width: 50px; height: 50px; border: none; border-bottom: 3px dashed var(--primary); text-align: center; font-size: 1.8rem; font-weight: 800; outline: none; text-transform: uppercase; background: transparent; }
.ml-input.correct { border-bottom-color: #34C759; color: #08764d; }

/* Counting */
.count-item {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 2.5rem; margin-bottom: 20px; background: var(--white);
  padding: 15px 25px; border-radius: 16px; border: 2px solid var(--border); letter-spacing: 5px;
}
.count-input {
  width: 80px; height: 60px; border: 3px solid var(--primary); border-radius: 12px;
  text-align: center; font-size: 2rem; font-weight: 800; outline: none; letter-spacing: 0;
}
.count-input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

/* Rhyme Page */
.rhyme-page { border-radius: 24px; padding: 40px; text-align: center; max-width: 800px; margin: 0 auto; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
.rhyme-page h2 { font-size: 2.8rem; color: #fff; margin-bottom: 20px; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); }
.rhyme-cartoon { font-size: 7rem; margin-bottom: 30px; animation: bounce 2s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.rhyme-line { font-size: 1.6rem; font-weight: 800; color: var(--text); margin: 12px 0; background: rgba(255,255,255,0.95); padding: 15px 20px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
.rhyme-line:hover { background: #fff; transform: scale(1.03); }

/* Numbers Grid */
.numbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 20px; margin: 20px 0; }
.number-card { border: 3px solid var(--border); border-radius: 20px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; background: var(--white); }
.number-card:hover { border-color: var(--primary); transform: translateY(-5px) scale(1.05); }
.number-card .num { font-size: 3rem; font-weight: 800; color: var(--primary-dark); }

/* Matching Game */
.matching-container { display: flex; justify-content: space-around; gap: 40px; margin-top: 30px; max-width: 400px; }
.match-col { display: flex; flex-direction: column; gap: 15px; }
.match-item { border: 3px solid var(--border); border-radius: 12px; padding: 15px 30px; font-size: 2rem; font-weight: 800; cursor: pointer; text-align: center; background: var(--white); transition: 0.2s; width: 100px; user-select: none; }
.match-item.selected { border-color: var(--primary); background: #ffe0b2; }
.match-item.matched { border-color: #34C759; background: #d8fff0; color: #08764d; cursor: default; }

/* My Self Form */
.myself-form { max-width: 600px; margin: 0 auto; font-size: 1.5rem; font-weight: 600; line-height: 2.5; background: var(--white); padding: 30px; border-radius: 20px; border: 2px solid var(--border); }
.myself-form input[type="text"] { border: none; border-bottom: 3px dashed var(--primary); outline: none; font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); text-align: center; width: 200px; }
.myself-form input[type="radio"] { transform: scale(1.5); margin: 0 10px; cursor: pointer; }

/* Q&A Section */
.qa-item { background: var(--white); border: 2px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
.qa-q { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
.qa-a { display: none; font-size: 1.3rem; font-weight: 600; color: #08764d; background: #d8fff0; padding: 10px 15px; border-radius: 10px; margin-top: 10px; }
.qa-btn { margin-top: 10px; padding: 8px 15px; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; }

/* 3-Column Math Grid */
.textbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
.tb-item { display: flex; align-items: center; justify-content: space-between; background: var(--white); padding: 10px 15px; border-radius: 10px; border: 2px solid var(--border); font-size: 1.4rem; font-weight: 800; }
.tb-item input { width: 60px; height: 45px; font-size: 1.4rem; text-align: center; border: 2px solid var(--primary); border-radius: 8px; outline: none; }
.tb-item input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }

/* Sentences & Verbs */
.sentence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
.sent-card { display: flex; align-items: center; gap: 20px; background: var(--white); border: 2px solid var(--border); padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.2s; }
.sent-card:hover { border-color: var(--primary); transform: scale(1.02); }
.sent-card .pic { font-size: 3rem; }
.sent-card .text { font-size: 1.5rem; font-weight: 800; text-align: left; }

.pronoun-table { background: var(--white); border: 2px solid var(--border); border-radius: 15px; overflow: hidden; margin-bottom: 25px; }
.pronoun-header { background: var(--primary); color: white; padding: 10px 20px; font-size: 1.5rem; font-weight: 800; }
.pronoun-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.pronoun-item { padding: 15px; text-align: center; border-right: 1px solid #eee; cursor: pointer; }
.pronoun-item:last-child { border-right: none; }
.pronoun-item .emoji { font-size: 3rem; margin-bottom: 10px; }
.pronoun-item .sent { font-size: 1.2rem; font-weight: 700; }

@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; padding: 10px; gap: 10px; }
  .subject-title { display: none; }
  .topic-list { display: flex; gap: 10px; }
  .topic-list li { white-space: nowrap; border-left: none; border-bottom: 4px solid transparent; padding: 8px 12px; }
  .topic-list li.active { border-left: none; border-bottom-color: var(--primary); }
  .content { padding: 20px; }
  .textbook-grid { grid-template-columns: 1fr; }
  .fill-grid { grid-template-columns: 1fr; }
  .sentence-grid { grid-template-columns: 1fr; }
  .pronoun-cols { grid-template-columns: 1fr; }
  .pronoun-item { border-right: none; border-bottom: 1px solid #eee; }
  .missing-letters-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

function generateAdd30() {
  const arr = [];
  for (let i = 0; i < 30; i++) {
    let a = Math.floor(Math.random() * 10) + 1;
    let b = Math.floor(Math.random() * 10) + 1;
    arr.push({ a: a, b: b, ans: a + b, op: '+' });
  }
  return arr;
}

function generateSub30() {
  const arr = [];
  for (let i = 0; i < 30; i++) {
    let a = Math.floor(Math.random() * 10) + 5;
    let b = Math.floor(Math.random() * 5) + 1;
    arr.push({ a: a, b: b, ans: a - b, op: '-' });
  }
  return arr;
}

function generateMissingLettersAZ() {
  const caps = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const smalls = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const capBlanks = [2, 5, 9, 11, 14, 17, 20, 23]; // Indices to hide
  const smallBlanks = [2, 5, 9, 11, 14, 17, 20, 23];
  
  return {
    caps: caps.map((l, i) => ({ l, blank: capBlanks.includes(i) })),
    smalls: smalls.map((l, i) => ({ l, blank: smallBlanks.includes(i) }))
  };
}

function addStar() {
  stars++;
  localStorage.setItem('shifaStars', stars);
  document.getElementById('starCount').textContent = stars;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

const tabsContainer = document.getElementById('classTabs');
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');

function renderTabs() {
  tabsContainer.innerHTML = classes.map(c => `
    <button class="class-tab ${c === currentClass ? 'active' : ''}" onclick="switchClass('${c}')">
      ${classNames[c]}
    </button>
  `).join('');
}

function switchClass(c) {
  currentClass = c;
  renderTabs();
  renderSidebar();
  content.innerHTML = `<h1>👋 Welcome to ${classNames[c]} Dashboard</h1><p>Select a topic from the left sidebar to start learning.</p>`;
}

function renderSidebar() {
  const data = contentData[currentClass];
  let html = '';
  data.subjects.forEach(sub => {
    html += `<div class="subject-title">${sub.name}</div><ul class="topic-list">`;
    sub.topics.forEach(t => {
      html += `<li id="tab-${t.id}" onclick="loadTopic('${sub.name}', '${t.id}')">${t.title}</li>`;
    });
    html += `</ul>`;
  });
  sidebar.innerHTML = html;
}

function loadTopic(subjectName, topicId) {
  document.querySelectorAll('.topic-list li').forEach(el => el.classList.remove('active'));
  const activeTab = document.getElementById(`tab-${topicId}`);
  if(activeTab) activeTab.classList.add('active');

  const sub = contentData[currentClass].subjects.find(s => s.name === subjectName);
  const topic = sub.topics.find(t => t.id === topicId);

  content.innerHTML = `<h1>${topic.title}</h1>`;

  if (topic.type === 'grid') {
    content.innerHTML += `<div class="interactive-grid">
      ${topic.data.map(item => `
        <div class="grid-item" onclick="speak('${item.say || item.text}'); addStar();">
          ${item.svg ? item.svg : (item.emoji ? `<span class="pic">${item.emoji}</span>` : '')}

  } 
  else if (topic.type === 'count') {

        <div style="letter-spacing: 10px;">${item.e.repeat(item.count)}</div>

function checkAdd(index, correctAns) {
  const input = document.getElementById(`add-${index}`);
  if(parseInt(input.value) === correctAns) { input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!'); } else { input.classList.remove('correct'); }
}
function checkStrictAdd(index, correctAns, totalQ) {
  const input = document.getElementById(`strict-${index}`);
  if(parseInt(input.value) === correctAns) {
    input.classList.add('correct'); input.disabled = true; addStar(); window.currentQuizScore++;
    if(window.currentQuizScore === totalQ && !window.quizStarsGiven) { window.quizStarsGiven = true; document.getElementById('result-box').style.display = 'block'; speak('Congratulations! You solved all questions.'); }
  } else { input.classList.remove('correct'); }
}
function checkCount(index, correctAns) {
  const input = document.getElementById(`count-${index}`);
  if(parseInt(input.value) === correctAns) { input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!'); } else { input.classList.remove('correct'); }
}
function checkFill(index, correctChar) {
  const input = document.getElementById(`blank-${index}`);
  if(input.value.toUpperCase() === correctChar.toUpperCase()) { input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!'); } else { input.classList.remove('correct'); }
}
function checkMissingAZ(idx, correctChar, type) {
  const input = document.getElementById(`${type}-miss-${idx}`);
  if(input.value === correctChar) { input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!'); } else { input.classList.remove('correct'); }
}
let selectedCap = null; let selectedSm = null;
function selectMatch(type, index, correctSm) {
  const el = document.getElementById(`${type}-${index}`);
  if (el.classList.contains('matched')) return;
  if (type === 'cap') {
    if (selectedCap) document.getElementById(`cap-${selectedCap.index}`).classList.remove('selected');
    selectedCap = { index, value: el.textContent.trim().toLowerCase() }; el.classList.add('selected');
  } else {
    if (selectedSm) document.getElementById(`sm-${selectedSm.index}`).classList.remove('selected');
    selectedSm = { index, value: el.textContent.trim().toLowerCase() }; el.classList.add('selected');
  }
  if (selectedCap && selectedSm) {
    if (selectedCap.value === selectedSm.value) {
      document.getElementById(`cap-${selectedCap.index}`).classList.replace('selected', 'matched');
      document.getElementById(`sm-${selectedSm.index}`).classList.replace('selected', 'matched');
      addStar(); speak('Correct!');
    } else {
      document.getElementById(`cap-${selectedCap.index}`).classList.remove('selected');
      document.getElementById(`sm-${selectedSm.index}`).classList.remove('selected');
    }
    selectedCap = null; selectedSm = null;
  }
}

  return data.map(d => ({ text: `${d.l} for ${d.w}`, emoji: d.e, say: `${d.l} for ${d.w}` }));
}

// 2. Caterpillar Missing Alphabet (Direct A-Z Check)
function generateCaterpillarAZ() {
  const caps = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const smalls = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const capBlanks = [2, 4, 7, 9, 11, 13, 16, 19, 21, 23, 25]; 
  const smallBlanks = [2, 4, 7, 9, 11, 13, 16, 19, 21, 23, 25];
  
  return {
    caps: caps.map((l, i) => ({ l, blank: capBlanks.includes(i) })),
    smalls: smalls.map((l, i) => ({ l, blank: smallBlanks.includes(i) }))
  };
}

// 3. Match Small Letter (MCQ based on image)
function generateMatchSmallMCQ() {
  return [
    { cap: 'A', options: ['g', 'c', 'a'], ans: 'a' }, { cap: 'B', options: ['d', 'c', 'b'], ans: 'b' },

// LoadTopic function ko update karna naye designs ke liye
const prevLoadTopic = loadTopic;
loadTopic = function(subjectName, topicId) {
  prevLoadTopic(subjectName, topicId);
  
  const sub = contentData[currentClass].subjects.find(s => s.name === subjectName);
  const topic = sub.topics.find(t => t.id === topicId);

  // Caterpillar Missing A-Z
  if (topic.type === 'caterpillar') {
    const colors = ['#FFCDD2', '#F8BBD0', '#E1BEE7', '#D1C4E9', '#C5CAE9', '#BBDEFB', '#B3E5FC', '#B2EBF2', '#B2DFDB', '#C8E6C9'];
    content.innerHTML += `<p>Complete the alphabet. Write the missing CAPITAL letters.</p>
    <div class="caterpillar-grid">
      ${topic.data.caps.map((item, i) => `<div class="cp-box" style="background:${colors[i%10]}">${item.blank ? `<input type="text" maxlength="1" id="cat-cap-${i}" oninput="checkCat(${i}, '${item.l}', 'cap')">` : item.l}</div>`).join('')}
    </div>
    <p style="margin-top: 40px;">Complete the alphabet. Write the missing small letters.</p>
    <div class="caterpillar-grid">
      ${topic.data.smalls.map((item, i) => `<div class="cp-box" style="background:${colors[i%10]}">${item.blank ? `<input type="text" maxlength="1" id="cat-small-${i}" oninput="checkCat(${i}, '${item.l}', 'small')">` : item.l}</div>`).join('')}
    </div>`;
  }
  
  // Match Capital & Small MCQ
  else if (topic.type === 'match_mcq') {
    content.innerHTML += `<p>Circle the correct lowercase letter for each capital letter.</p>
    <div style="max-width: 600px;">
      ${topic.data.map((item, i) => `
        <div class="mcq-row">
          <div class="mcq-cap">${item.cap}</div>
          <div class="mcq-options">
            ${item.options.map(opt => `<div class="mcq-opt" onclick="checkMCQ(this, '${opt}', '${item.ans}')">${opt}</div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // Color Match Game
  else if (topic.type === 'color_match') {
    const shuffledEmojis = [...topic.data].sort(() => Math.random() - 0.5);
    content.innerHTML += `<p>Match each color name with the correct picture.</p>
    <div>
      ${topic.data.map((item, i) => `
        <div class="color-match-row">
          <div class="cm-left">
            <div class="cm-color-box" style="background: ${item.bg};"></div>
            ${item.color}
          </div>
          <div class="cm-right">
            <select id="color-select-${i}" onchange="checkColorMatch(${i}, '${item.emoji}', this)">
              <option value="">Select Picture</option>
              ${shuffledEmojis.map(emo => `<option value="${emo.emoji}">${emo.emoji} ${emo.name}</option>`).join('')}
            </select>
          </div>
        </div>
      `).join('')}
    </div>`;
  }
};

// Naye Games ka Logic
function checkCat(idx, correctChar, type) {
  const input = document.getElementById(`cat-${type}-${idx}`);
  if(input.value.toUpperCase() === correctChar.toUpperCase()) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else { input.classList.remove('correct'); }
}

function checkMCQ(el, selected, correct) {
  if (el.classList.contains('correct')) return;
  if (selected === correct) {
    el.classList.add('correct');
    addStar(); speak('Correct!');
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

function checkColorMatch(index, correctEmoji, selectEl) {
  if (selectEl.value === correctEmoji) {
    selectEl.classList.add('correct'); selectEl.disabled = true; addStar(); speak('Correct!');
  }
}

  }
  else if (topic.type === 'greetings') {
    content.innerHTML += `<div class="greet-grid">

        <div class="mw-card">

  else if (topic.type === 'missing_words') {
    content.innerHTML += `<div class="missing-word-grid">
      ${topic.data.map((item, index) => {

        return `

              <span style="text-transform:lowercase">${parts[0]}</span>

            </div>
          </div>
        `;
      }).join('')}

  }
};

// =========================================
// INTERACTIVE LOGIC FOR CLASS 1
// =========================================
function checkMakeWord(index, correctAns) {
  const input = document.getElementById(`mw-${index}`);
  if(input.value.toUpperCase() === correctAns) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else { input.classList.remove('correct'); }
}

function checkFixedMissing(index, fullWord, part1, part2) {
  const input = document.getElementById(`fix-missw-${index}`);
  const typed = input.value.toLowerCase();
  
  if(typed === '') {
    input.classList.remove('correct');
    return;
  }

  const wordFormed = part1 + typed + part2;
  
  if (wordFormed.toLowerCase() === fullWord.toLowerCase()) {
    input.classList.add('correct'); 
    addStar(); 
    speak('Correct!');
  } else {
    input.classList.remove('correct');
  }
}

        <div class="opp-card" onclick="speak('${item.w1} and ${item.w2}'); addStar();">
          <div class="opp-side"><span class="emoji">${item.e1}</span><span class="word">${item.w1}</span></div>
          <div class="opp-arrow">⇄</div>
          <div class="opp-side"><span class="emoji">${item.e2}</span><span class="word">${item.w2}</span></div>
        </div>
      `).join('')}
    </div>`;
  }

  // 2. PLURALS
  else if (topic.type === 'c2_plural') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Learn how words change from one to many.</p>
    <div class="plural-grid">
      ${topic.data.map(item => `
        <div class="plural-card" onclick="speak('${item.sing} becomes ${item.plur}'); addStar();">
          <div class="plural-row">
            <div class="plural-item"><span class="emoji">${item.e1}</span><span class="word">${item.sing}</span></div>
            <div class="opp-arrow">➔</div>
            <div class="plural-item"><span class="emoji">${item.e2}</span><span class="word">${item.plur}</span></div>
          </div>
          <div class="plural-rule">${item.rule}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // 3. IS AM ARE
  else if (topic.type === 'c2_isamare') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Choose the correct word to complete the sentence.</p>
    <div class="isamare-grid">
      ${topic.data.map((item, index) => `
        <div class="iam-card">
          <span class="pic">${item.e}</span>
          <div class="sentence">
            ${item.q.split('_______')[0]}
            <select id="iam-${index}" onchange="checkIsAmAre(${index}, '${item.ans}')">
              <option value="">...</option>
              <option value="am">am</option>
              <option value="is">is</option>
              <option value="are">are</option>
            </select>
            ${item.q.split('_______')[1]}
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 4. GREATER / LESS
  else if (topic.type === 'c2_greaterless') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Type > (Greater), < (Less) or = (Equal) in the box.</p>
    <div class="gl-grid">
      ${topic.data.map((item, index) => `
        <div class="gl-card">
          <span class="num">${item.a}</span>
          <input type="text" maxlength="1" class="gl-input" id="gl-${index}" oninput="checkGL(${index}, '${item.ans}')">
          <span class="num">${item.b}</span>
        </div>
      `).join('')}
    </div>`;
  }

  // 5. ASCENDING
  else if (topic.type === 'c2_ascending') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Arrange the numbers from smallest to greatest.</p>
    <div style="margin-top: 20px;">
      ${topic.data.map((item, idx) => `
        <div class="asc-card">
          <div class="asc-question">Sort this list: ${item.list.join(', ')}</div>
          <div class="asc-inputs">
            <input type="number" id="asc-${idx}-0" oninput="checkAsc(${idx}, 0, ${item.ans[0]})">
            <span><</span>
            <input type="number" id="asc-${idx}-1" oninput="checkAsc(${idx}, 1, ${item.ans[1]})">
            <span><</span>
            <input type="number" id="asc-${idx}-2" oninput="checkAsc(${idx}, 2, ${item.ans[2]})">
            <span><</span>
            <input type="number" id="asc-${idx}-3" oninput="checkAsc(${idx}, 3, ${item.ans[3]})">
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 6. ADDITION WITH PICS
  else if (topic.type === 'c2_addpics') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Count the pictures and add them.</p>
    <div class="math-pic-grid">
      ${topic.data.map((item, index) => `
        <div class="mp-card">
          <div class="mp-visual">
            <span class="group">${item.e.repeat(item.a)}</span>
            <span>+</span>
            <span class="group">${item.e.repeat(item.b)}</span>
          </div>
          <div class="mp-eq">
            <span>${item.a} + ${item.b} =</span>
            <input type="number" class="mp-input" id="addpic-${index}" oninput="checkMathPic(${index}, ${item.sum})">
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 7. SUBTRACTION WITH PICS
  else if (topic.type === 'c2_subpics') {
    content.innerHTML = `<h1>${topic.title}</h1><p>Count the pictures and subtract.</p>
    <div class="math-pic-grid">
      ${topic.data.map((item, index) => `
        <div class="mp-card">
          <div class="mp-visual">
            <span class="group" style="position: relative;">${item.e.repeat(item.a)}</span>
          </div>
          <div class="mp-eq">
            <span>${item.a} - ${item.b} =</span>
            <input type="number" class="mp-input" id="subpic-${index}" oninput="checkMathPic(${index}, ${item.sum})">
          </div>
        </div>
      `).join('')}
    </div>`;
  }
};

// =========================================
// INTERACTIVE LOGIC FOR CLASS 2
// =========================================
function checkIsAmAre(index, correctAns) {
  const selectEl = document.getElementById(`iam-${index}`);
  if(selectEl.value === correctAns) {
    selectEl.classList.add('correct');
    addStar(); speak('Correct!');
  } else {
    selectEl.classList.remove('correct');
  }
}

function checkGL(index, correctAns) {
  const input = document.getElementById(`gl-${index}`);
  if(input.value === correctAns) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else {
    input.classList.remove('correct');
  }
}

function checkAsc(idx, pos, correctAns) {
  const input = document.getElementById(`asc-${idx}-${pos}`);
  if(parseInt(input.value) === correctAns) {
    input.classList.add('correct'); 
    input.disabled = true; 
    addStar(); speak('Correct!');
  } else {
    input.classList.remove('correct');
  }
}

function checkMathPic(index, correctAns) {
  const input = document.getElementById(`addpic-${index}`) || document.getElementById(`subpic-${index}`);
  if(parseInt(input.value) === correctAns) {
    input.classList.add('correct'); input.disabled = true; addStar(); speak('Correct!');
  } else {
    input.classList.remove('correct');
  }
}
// Initialize App
renderTabs();
switchClass('nursery');
</script>
