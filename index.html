/* ===== UPDATED PREMIUM STYLES ===== */

}
*{box-sizing:border-box}
body{

.app::after { right:0; }

.brand small{color:var(--muted); font-weight:700; font-size:0.8rem;}

.pill{border:1px solid var(--line); background:#f7f5ff; border-radius:14px; padding:9px 14px; font-weight:800; color:var(--purple); transition:0.2s;}

<script>

const $=s=>document.querySelector(s);
const STORE='shifaHub_v2';

try{saved={...saved,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}
let state={view:'home',classId:null,subjectId:null,topicId:null,filter:''};

const classes=[
{id:'nursery',name:'Nursery',age:'3–4 years',emoji:'🧸',color:'#ff6b9d',subjects:['early','english','maths','evs','rhymes','activity']},
{id:'jr',name:'Jr KG',age:'4–5 years',emoji:'🎈',color:'#00b894',subjects:['early','english','maths','evs','rhymes','activity']},
{id:'sr',name:'Sr KG',age:'5–6 years',emoji:'🎒',color:'#fd9644',subjects:['early','english','maths','evs','rhymes','activity']},
{id:'class1',name:'Class 1',age:'6–7 years',emoji:'📚',color:'#9b72ff',subjects:['maths','english','hindi','evs','gk','computer']},
{id:'class2',name:'Class 2',age:'7–8 years',emoji:'✏️',color:'#ef5350',subjects:['maths','english','hindi','evs','gk','computer']},
{id:'class3',name:'Class 3',age:'8–9 years',emoji:'📖',color:'#26a69a',subjects:['maths','english','hindi','evs','gk','computer']},
{id:'class4',name:'Class 4',age:'9–10 years',emoji:'🎯',color:'#5c6bc0',subjects:['maths','english','hindi','science','social','computer']},
{id:'class5',name:'Class 5',age:'10–11 years',emoji:'🔬',color:'#ab47bc',subjects:['maths','english','hindi','science','social','computer']},
{id:'class6',name:'Class 6',age:'11–12 years',emoji:'🌏',color:'#29b6f6',subjects:['maths','english','hindi','science','social','computer']},
{id:'class7',name:'Class 7',age:'12–13 years',emoji:'⚛️',color:'#66bb6a',subjects:['maths','english','hindi','science','social','computer']},
{id:'class8',name:'Class 8',age:'13–14 years',emoji:'🚀',color:'#ff7043',subjects:['maths','english','hindi','science','social','computer']}
];

const subjects={
early:['🌈','My First World','Colours, shapes, senses and daily routines'],
english:['🔤','English','Letters, phonics, words, reading and grammar'],
maths:['🧮','Mathematics','Numbers, operations, patterns and problem solving'],
hindi:['अ','Hindi','वर्णमाला, शब्द, पठन और व्याकरण'],
evs:['🌱','EVS','Myself, family, nature and our surroundings'],
rhymes:['🎵','Rhymes & Poems','Listen, read and recite'],
activity:['✂️','Fun Activities','Matching, tracing and picture puzzles'],
gk:['🌍','General Knowledge','Everyday knowledge and observation'],
science:['🔬','Science','Concepts, experiments and scientific thinking'],
social:['🗺️','Social Studies','History, geography, civics and communities'],
computer:['💻','Computer','Digital literacy, devices and computational thinking']
};

// Basic topic generators (kept small for demonstration, original code had huge arrays)
const nurseryTopics=[['letters','🔠','Capital & Small Letters','A–Z and a–z with picture words','letters'],['numbers','🔢','Numbers 1–20','Count objects and recognise numbers','numbers'],['shapes','🔺','Shapes','Circle, square, triangle, rectangle','shapes'],['colors','🎨','Colours','Learn colour names with pictures','colors'],['animals','🐘','Animals & Birds','Names, sounds and habitats','animals'],['rhymes','🎵','Rhymes & Poems','Short action rhymes and recitation','rhymes']];
const jrTopics=[['letters','🔠','Capital & Small Letters','Recognise, read and write A–Z','letters'],['numbers','🔢','Numbers 1–50','Count, read and write numbers','numbers'],['addition','➕','Addition Basics','Add objects and numbers within 20','addition'],['rhymes','🎵','Rhymes & Poems','Read aloud and learn new words','rhymes']];
const srTopics=[['reading','📖','Reading Readiness','Simple sentences and picture reading','reading'],['numbers','🔢','Numbers 1–100','Read, write, compare and order','numbers'],['addition','➕','Addition','Add one- and two-digit numbers','addition'],['subtraction','➖','Subtraction','Take away and find the difference','subtraction']];

function makeTopics(classId,subjectId){
 const level=classId==='nursery'?0:classId==='jr'?1:classId==='sr'?2:Number(classId.replace('class',''));
 if(level===0)return nurseryTopics;
 if(level===1)return jrTopics;
 if(level===2)return srTopics;
 // Dummy topics for higher classes to save space
 return [['ch1','📘','Chapter 1','Learn the basics', 'chapter'],['ch2','📘','Chapter 2','Practice the concepts', 'chapter'],['ch3','📘','Chapter 3','Advanced topics', 'chapter']];
}

function titleForSubject(id){return subjects[id]||['📘',id,''];}
function save(){localStorage.setItem(STORE,JSON.stringify(saved));$('#stars').textContent=saved.stars||0}

/* =========================================
   CUSTOM MATH SOLVER LOGIC
   ========================================= */
function parseEq(equation) {
    equation = equation.replace(/\s+/g, '').toLowerCase();
    let parts = equation.split('=');
    if(parts.length !== 2) throw new Error("Equation mein ek '=' hona chahiye");
    let left = parts[0] || "0"; let right = parts[1] || "0";
    if(left[0] !== '+' && left[0] !== '-') left = '+' + left;
    if(right[0] !== '+' && right[0] !== '-') right = '+' + right;
    
    let parseSide = (str) => {
        let A = 0, B = 0, C = 0;
        let xTerms = str.match(/[+-]\d*\.?\d*x/g) || [];
        let yTerms = str.match(/[+-]\d*\.?\d*y/g) || [];
        xTerms.forEach(t => { let num = t.replace('x',''); A += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        yTerms.forEach(t => { let num = t.replace('y',''); B += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        let noXY = str.replace(/[+-]\d*\.?\d*x/g, '').replace(/[+-]\d*\.?\d*y/g, '');
        if(noXY && noXY[0] !== '+' && noXY[0] !== '-') noXY = '+' + noXY;
        (noXY.match(/[+-]\d*\.?\d+/g) || []).forEach(t => C += parseFloat(t));
        return {A, B, C};
    };
    let L = parseSide(left), R = parseSide(right);
    return { A: L.A - R.A, B: L.B - R.B, C: R.C - L.C };
}

function solveTwoVars(eq1Str, eq2Str) {
    let eq1 = parseEq(eq1Str), eq2 = parseEq(eq2Str);
    let A1 = eq1.A, B1 = eq1.B, C1 = eq1.C, A2 = eq2.A, B2 = eq2.B, C2 = eq2.C;
    let det = A1 * B2 - A2 * B1;
    if (det === 0) return { msg: "No Solution ya Infinite Solutions." };
    
    let steps = [];
    let fmtEq = (A, B, C) => (A !== 0 ? A + "x " : "") + (B !== 0 ? (B > 0 ? "+ " : "- ") + Math.abs(B) + "y " : "") + "= " + C;
    steps.push(`<b>Eq 1:</b> ${fmtEq(A1, B1, C1)}<br><b>Eq 2:</b> ${fmtEq(A2, B2, C2)}`);
    
    let l = Math.abs(A1 * A2) / (function gcd(a,b){return b?gcd(b,a%b):a})(Math.abs(A1), Math.abs(A2));
    let m1 = l / Math.abs(A1), m2 = l / Math.abs(A2);
    steps.push(`<b>Step 1:</b> x eliminate karne ke liye Eq1 ko ${m1} se, Eq2 ko ${m2} se multiply karo.<br>Eq1: ${fmtEq(A1*m1, B1*m1, C1*m1)}<br>Eq2: ${fmtEq(A2*m2, B2*m2, C2*m2)}`);
    
    let sub = (A1*m1 * A2*m2 > 0);
    let finalB = sub ? (B1*m1 - B2*m2) : (B1*m1 + B2*m2);
    let finalC = sub ? (C1*m1 - C2*m2) : (C1*m1 + C2*m2);
    steps.push(`<b>Step 2:</b> Dono equations ko ${sub ? 'subtract' : 'add'} karo.<br>${finalB}y = ${finalC} → y = ${finalC/finalB}`);
    
    let y = finalC / finalB;
    let x = (C1 - B1 * y) / A1;
    steps.push(`<b>Step 3:</b> y = ${y} ko Eq1 mein rakho → x = ${x}`);
    steps.push(`<b class="final-ans">✅ Final Answer:</b> x = ${x}, y = ${y}`);
    return { html: steps.join('<br><br>') };
}

function solveCustomEquation() {
    let input1 = document.getElementById('customEqInput').value.trim();
    let input2 = document.getElementById('customEqInput2').value.trim();
    let resultDiv = document.getElementById('customEqResult');
    if(!input1) { alert('Kripya equation likhein (jaise 4x + 3 = 15)'); return; }
    
    try {
        if(input2 !== "") {
            let res = solveTwoVars(input1, input2);
            resultDiv.innerHTML = res.msg ? `<div style="color:#cc0000; font-weight:bold;">⚠️ ${res.msg}</div>` : res.html;
        } else {
            // 1 Variable Solver
            let letters = input1.match(/[a-zA-Z]/g) || [];
            if(letters.length === 0) throw new Error("Kripya variable (jaise x, y) use karein.");
            let v = letters[0].toLowerCase();
            let eq = input1.replace(/\s+/g, '').split('=');
            let left = eq[0], right = eq[1] || '0';
            
            let l_x = left.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let l_coeff = 0; l_x.forEach(m => { let n = m.replace(v, ''); l_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let l_const = 0; (left.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => l_const += parseFloat(m));
            
            let r_x = right.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let r_coeff = 0; r_x.forEach(m => { let n = m.replace(v, ''); r_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let r_const = 0; (right.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => r_const += parseFloat(m));
            
            let finalA = l_coeff - r_coeff; let finalB = r_const - l_const;
            if(finalA === 0) throw new Error("Variable cancel ho gaya.");
            let ans = Math.round((finalB / finalA) * 10000) / 10000;
            
            let steps = `<b>Equation:</b> ${input1}<br><br>`;
            if(r_coeff !== 0) steps += `<b>Step 1:</b> Dono taraf se ${r_coeff}${v} subtract karo.<br>`;
            if(l_const !== 0) steps += `<b>Step 2:</b> Dono taraf se ${l_const} ${l_const>0?'subtract':'add'} karo.<br>`;
            steps += `<b>Step 3:</b> ${finalA}${v} = ${finalB}<br><b>Step 4:</b> ${v} = ${finalB} ÷ ${finalA}<br><br><b class="final-ans">✅ Final Answer:</b> ${v} = ${ans}`;
            resultDiv.innerHTML = steps;
        }
    } catch(e) {
        resultDiv.innerHTML = `<div style="color:#cc0000; font-weight:bold;">⚠️ Error: ${e.message}</div>`;
    }
    resultDiv.style.display = 'block';
}

/* =========================================
   APP ROUTING & RENDER
   ========================================= */
function currentClass(){return classes.find(c=>c.id===state.classId)}
function classProgress(id){
  let n=0,total=0;
  classes.find(c=>c.id===id).subjects.forEach(s=>{
    const topics=makeTopics(id,s);total+=topics.length;
    topics.forEach(t=>{if(saved.completed.includes(`${id}|${s}|${t[0]}`))n++})
  });
  return total?Math.round(n/total*100):0
}

function renderHome(){
 state.view='home';$('#backBtn').classList.add('hidden');
 $('#screen').innerHTML=`
 <section class="hero">

    <p>Welcome to Shifa's Learning Hub — a colourful place to explore, practise and grow. Choose your class, open a subject, learn with examples and finish with a quiz.</p>
    <button class="cta" onclick="document.getElementById('classTitle').scrollIntoView({behavior:'smooth'})">🚀 Start Learning</button>
 </section>

 <!-- CUSTOM SOLVER UI -->
 <div class="solver-wrapper">
    <h2>🧠 Apna Math Question Khud Solve Karo!</h2>

    <div class="solver-inputs">

        <input type="text" id="customEqInput2" placeholder="2nd Eq (Optional, e.g. x - y = 2)" />
        <button class="solve-btn" onclick="solveCustomEquation()">Solve ▶</button>
    </div>
    <div id="customEqResult" class="solver-result"></div>
 </div>

 <div class="stats">
   <div class="stat"><strong>${classes.length}</strong><small>Learning levels</small></div>
   <div class="stat"><strong>${saved.completed.length}</strong><small>Lessons completed</small></div>
   <div class="stat"><strong>${saved.stars||0} ⭐</strong><small>Learning stars</small></div>
 </div>

 <div class="section-head" id="classTitle"><div><h2>Choose your class 🎒</h2><p>From first letters to Class 8 concepts</p></div></div>
 <div class="grid">
   ${classes.map(c=>`
     <button class="level-card" style="--accent:${c.color}" onclick="openClass('${c.id}')">
       <span class="level-emoji">${c.emoji}</span>
       <h3>${c.name}</h3>
       <p>${c.age} · ${c.subjects.length} learning areas</p>
       <small style="font-weight:800; color:${c.color}; margin-top:10px; display:block;">${classProgress(c.id)}% complete</small>
     </button>`).join('')}
 </div>`;
 window.scrollTo(0,0);
}

function openClass(id){state.classId=id;state.view='class';renderClass()}
function renderClass(){
 const c=currentClass();if(!c)return renderHome();$('#backBtn').classList.remove('hidden');
 $('#screen').innerHTML=`
 <div class="crumb"><button onclick="renderHome()">Home</button> / ${c.name}</div>
 <section class="hero" style="background:linear-gradient(120deg,${c.color},#a66cff)">
   <h2>${c.emoji} ${c.name} Learning Zone</h2>
   <p>${c.age} · Learn at your own pace. Open a subject, study the lesson, practise and take the test.</p>
 </section>
 <div class="section-head"><div><h2>Subjects</h2><p>Choose a learning area</p></div><span class="tag">${classProgress(c.id)}% complete</span></div>
 <div class="grid">
   ${c.subjects.map(id=>{
     const s=titleForSubject(id);
     return `<button class="subject-card" onclick="openSubject('${id}')">
       <span class="subject-icon">${s[0]}</span>
       <span><h3>${s[1]}</h3><p>${s[2]}</p></span>
     </button>`}).join('')}
 </div>`;
 window.scrollTo(0,0);
}

function openSubject(id){state.subjectId=id;state.view='subject';renderSubject()}
function renderSubject(){
 const c=currentClass(),s=titleForSubject(state.subjectId);const topics=makeTopics(c.id,state.subjectId);
 $('#screen').innerHTML=`
 <div class="crumb"><button onclick="renderHome()">Home</button> / <button onclick="renderClass()">${c.name}</button> / ${s[1]}</div>
 <div class="section-head"><div><h2>${s[0]} ${s[1]}</h2><p>${s[2]}</p></div><span class="tag">${topics.length} lessons</span></div>
 <div class="grid">
   ${topics.map(t=>{
     const done=saved.completed.includes(`${c.id}|${state.subjectId}|${t[0]}`);
     return `<button class="topic-card" onclick="openTopic('${t[0]}')">
       <div class="topic-top"><span class="topic-icon">${t[1]}</span><div><h3>${t[2]}</h3><span class="tag">${done?'✓ Done':'Learn'}</span></div></div>

     </button>`}).join('')}
 </div>`;

function openTopic(topicId){state.topicId=topicId;state.view='lesson';renderLesson()}
function renderLesson(){
 const c=currentClass(),s=titleForSubject(state.subjectId),t=makeTopics(c.id,state.subjectId).find(x=>x[0]===state.topicId);
 const key=`${c.id}|${state.subjectId}|${t[0]}`;const done=saved.completed.includes(key);
 // Dummy data for lesson
 $('#screen').innerHTML=`
 <div class="crumb"><button onclick="renderHome()">Home</button> / <button onclick="renderClass()">${c.name}</button> / <button onclick="renderSubject()">${s[1]}</button> / Lesson</div>
 <article class="panel">
   <div class="lesson-title"><div class="big-emoji">${t[1]}</div><h2>${t[2]}</h2><p>${c.name} · ${s[1]}</p></div>
   <div class="lesson-body">
     <div class="callout"><strong>📖 Learn this:</strong><br>${t[3]}. Read carefully and understand the concept.</div>
     <div class="actions">
       <button class="btn" onclick="renderSubject()">← All lessons</button>
       <button class="btn green" onclick="completeLesson('${key}')">${done?'✓ Completed':'Mark complete ⭐'}</button>
     </div>
   </div>
 </article>`;
 window.scrollTo(0,0);
}
function completeLesson(key){if(!saved.completed.includes(key)){saved.completed.push(key);saved.stars=(saved.stars||0)+5;save()}alert('Great work! +5 stars ⭐');renderLesson()}

function goBack(){
 if(state.view==='home')return;
 if(state.view==='lesson'){renderSubject();return}
 if(state.view==='subject'){renderClass();return}
 if(state.view==='class'){renderHome();return}
 renderHome()
}

$('#stars').textContent=saved.stars||0;
renderHome();
</script>
