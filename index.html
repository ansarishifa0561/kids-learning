<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#2b2b3a;padding:14px;
background:radial-gradient(circle at 20% 20%,#fff5e6,#f0d9b5 60%,#d9b88a 100%);
background-attachment:fixed;min-height:100vh}
.frame{max-width:1250px;margin:20px auto;background:linear-gradient(135deg,#fffefb,#fff8ee);
border-radius:14px;box-shadow:0 0 0 3px #fff,0 0 0 10px #8B5A2B,0 0 0 13px #d4a373,0 0 0 16px #8B5A2B,0 25px 60px rgba(80,50,20,.35);overflow:hidden}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;
background:linear-gradient(135deg,#fffefb,#fff5e6);border-bottom:3px double #8B5A2B;box-shadow:0 4px 20px rgba(139,90,43,.15)}
header h1{font-size:1.05rem;font-weight:800;color:#5a3a1a;line-height:1.1}
header .sub{font-size:.7rem;opacity:.75;font-weight:600;color:#8B5A2B}
.ibtn{width:44px;height:44px;border-radius:14px;border:2px solid #d4a373;cursor:pointer;background:#fff;font-size:1.2rem;display:grid;place-items:center;flex:0 0 auto}
.sp{flex:1}
.stars{background:linear-gradient(135deg,#FFF5CC,#FFE066);border:2px solid #d4a373;border-radius:14px;padding:7px 14px;font-weight:800;font-size:.9rem;color:#7a4a10}
main{padding:20px 16px 60px}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:800;background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.75;font-weight:600;color:#5a3a1a}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}
.grid.info-grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card,.item{border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fffefb,#fff5e6);display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 20px rgba(139,90,43,.18);transition:transform .2s;position:relative;overflow:hidden;text-align:center;border-radius:20px}
.card{padding:22px 12px;gap:6px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-6px) scale(1.03)}
.card .emo{font-size:2.8rem;line-height:1}
.card .ttl{font-weight:800;font-size:1rem;color:#5a3a1a}
.card .sub{font-size:.78rem;opacity:.7;font-weight:600;color:#8B5A2B}
.item{padding:18px 10px;gap:8px;border-radius:22px}
.item .visual{font-size:5rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.item .bignum{font-size:3rem;font-weight:800;line-height:1;color:#7c5cff;text-shadow:2px 2px 0 #fff}
.item .label{font-weight:800;font-size:.95rem;color:#5a3a1a}
.item .badge{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;border-radius:10px;padding:2px 10px;font-size:.8rem;font-weight:800}
.swatch{width:85px;height:85px;border-radius:50%;box-shadow:inset 0 -8px 15px rgba(0,0,0,.15),inset 0 8px 15px rgba(255,255,255,.4),0 8px 20px rgba(0,0,0,.2)}
.num-tile{display:inline-flex;align-items:center;justify-content:center;min-width:65px;min-height:65px;border-radius:16px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;color:#fff;box-shadow:0 8px 16px rgba(0,0,0,.25);padding:6px 12px;white-space:nowrap}
.item.word-item{grid-column:span 2;padding:20px 14px;min-height:160px;justify-content:center}
.item .wordtext{font-weight:800;line-height:1.15;word-break:break-word;color:#5C6BC0;font-size:1.4rem}
.item.word-item[data-len="s"] .wordtext{font-size:1.9rem}
.item.word-item[data-len="m"] .wordtext{font-size:1.3rem}
.item.word-item[data-len="l"] .wordtext{font-size:1.05rem}
.sq-card{border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fff,#f0f4ff);display:flex;flex-direction:column;align-items:center;padding:16px 10px;gap:4px;border-radius:22px;box-shadow:0 8px 20px rgba(80,80,180,.18);position:relative}
.sq-card::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#7c5cff,#ff5f9e)}
.sq-card .expr{font-size:1.5rem;font-weight:800;color:#5C6BC0}
.sq-card .eq{font-size:.9rem;color:#8B5A2B;font-weight:700}
.sq-card .res{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#7c5cff,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.info{align-items:flex-start;text-align:left;padding:18px}

.lesson{background:#fffefb;border-radius:22px;padding:22px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:820px;margin:0 auto;border:2px solid #e8d5b7}

.point{width:100%;border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;border-radius:14px;padding:12px 16px;font-size:.98rem;font-weight:700;text-align:left;color:#2b2b3a;margin-bottom:8px;line-height:1.5;display:flex;gap:8px}

.qa-item{background:linear-gradient(135deg,#f9f9ff,#f0f0ff);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:5px solid #7c5cff}

.qa-a.show{display:block}
.ans-btn{border:none;font-family:inherit;cursor:pointer;background:#eef0ff;color:#5c4dff;font-weight:800;border-radius:10px;padding:6px 14px;font-size:.8rem}
.table-view{background:#fffefb;border-radius:22px;padding:22px 18px;max-width:520px;margin:0 auto;box-shadow:0 12px 30px rgba(139,90,43,.18);border:2px solid #e8d5b7}

.opt{border:none;font-family:inherit;cursor:pointer;border-radius:16px;padding:18px 12px;font-size:1.15rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c}

.opt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.result{background:#fffefb;border-radius:22px;padding:36px 18px;text-align:center;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:520px;margin:0 auto;border:2px solid #e8d5b7}
.result h2{margin:14px 0 20px;color:#7c5cff}
.missing-view{background:#fffefb;border-radius:22px;padding:24px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:660px;margin:0 auto;text-align:center;border:2px solid #e8d5b7}
.missing-view .picture{font-size:6rem;line-height:1;margin:10px 0 16px}
.missing-view .question{font-size:3rem;font-weight:800;color:#2b2b3a;letter-spacing:6px;margin:16px 0}
.missing-view .question .blank{color:#7c5cff;background:#f0edff;padding:0 12px;border-radius:10px;border-bottom:4px dashed #7c5cff}
.missing-view .label{font-size:1.1rem;font-weight:700;color:#9aa;margin-bottom:8px}
.missing-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.mopt{border:none;font-family:inherit;cursor:pointer;border-radius:16px;padding:18px 24px;font-size:1.6rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;min-width:75px}
.mopt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.mopt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.match-view{background:#fffefb;border-radius:22px;padding:24px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:740px;margin:0 auto;border:2px solid #e8d5b7}
.match-view h2{text-align:center;color:#7c5cff;font-size:1.3rem;margin-bottom:18px}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.match-col h3{text-align:center;font-size:.85rem;color:#9aa;margin-bottom:10px;font-weight:800}
.match-btn{width:100%;border:none;font-family:inherit;cursor:pointer;border-radius:14px;padding:14px;font-size:1.2rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;margin-bottom:8px}
.match-btn.sel{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff}
.match-btn.done{background:linear-gradient(145deg,#34C759,#28a745);color:#fff;opacity:.5}
.match-btn.err{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.opp-card{grid-column:span 2;border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fffefb,#fff5e6);display:flex;align-items:center;justify-content:space-around;gap:8px;padding:20px 12px;border-radius:22px;box-shadow:0 8px 20px rgba(139,90,43,.18);position:relative}
.opp-card::before{content:'';position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#ff5f9e,#7c5cff);border-radius:22px 22px 0 0}
.opp-side{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.opp-pic{line-height:1}
.opp-label{font-weight:800;font-size:.95rem;color:#5a3a1a}
.opp-arrow{font-size:1.8rem;color:#7c5cff}
@media(max-width:480px){
  body{padding:6px}
  .frame{margin-top:12px;margin-bottom:12px}
  main{padding:14px 10px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
  .item .visual{font-size:3.6rem}
  .item .bignum{font-size:2.4rem}
  .card .emo{font-size:2rem}
  .swatch{width:65px;height:65px}
  .missing-view .question{font-size:2.2rem;letter-spacing:4px}
}
</style>
</head>
<body>
<div class="frame">
<header>
  <button class="ibtn" id="backBtn" onclick="goBack()">⬅️</button>
  <div><h1 id="hTitle">Shifa's Learning Hub </h1><div class="sub" id="hSub">CBSE Pattern</div></div>
  <div class="sp"></div>
  <button class="ibtn" id="muteBtn" onclick="toggleSound()">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="screen"></main>
</div>

<script>
/* ===== ROMAN URDU → HINDI ===== */
const RH = {
'hai':'है','hain':'हैं','tha':'था','thi':'थी','the':'थे','mein':'में','me':'में','ek':'एक',
'yeh':'यह','ye':'यह','woh':'वह','vo':'वह','kya':'क्या','kaise':'कैसे','kyun':'क्यों','kab':'कब',
'kaun':'कौन','kahan':'कहाँ','yahan':'यहाँ','wahan':'वहाँ','abhi':'अभी','kabhi':'कभी',
'lagta':'लगता','lagti':'लगती','lagte':'लगते','aata':'आता','aati':'आती','aate':'आते',
'jaata':'जाता','jaati':'जाती','jaate':'जाते','karta':'करता','karti':'करती','karte':'करते',
'hota':'होता','hoti':'होती','hote':'होते','raha':'रहा','rahi':'रही','rahe':'रहे','matlab':'मतलब',
'jaise':'जैसे','waise':'वैसे','sirf':'सिर्फ','bahut':'बहुत','thoda':'थोड़ा','thodi':'थोड़ी',
'accha':'अच्छा','achha':'अच्छा','bura':'बुरा','bada':'बड़ा','badi':'बड़ी','bade':'बड़े',
'chhota':'छोटा','chhoti':'छोटी','naya':'नया','purana':'पुराना','sahi':'सही','galat':'गलत',
'haan':'हाँ','han':'हाँ','nahi':'नहीं','kuch':'कुछ','sab':'सब','log':'लोग','sabse':'सबसे',
'bachche':'बच्चे','bachcha':'बच्चा','padhai':'पढ़ाई','likhna':'लिखना','likho':'लिखो','likha':'लिखा',
'likhte':'लिखते','likhti':'लिखती','padhna':'पढ़ना','padho':'पढ़ो','padha':'पढ़ा','padhte':'पढ़ते',
'sunna':'सुनना','suno':'सुनो','suna':'सुना','sunte':'सुनते','sunti':'सुनती',
'bolna':'बोलना','bolo':'बोलो','bola':'बोला','bolte':'बोलते','bolti':'बोलती',
'khelna':'खेलना','khelo':'खेलो','khela':'खेला','khelte':'खेलते','khana':'खाना','khao':'खाओ',
'khate':'खाते','peena':'पीना','sona':'सोना','uthna':'उठना','chalna':'चलना','chalte':'चलते',
'dena':'देना','lena':'लेना','aana':'आना','jaana':'जाना','maa':'माँ','ma':'माँ','mummy':'मम्मी',
'papa':'पापा','pita':'पिता','bhai':'भाई','bhaiya':'भैया','behen':'बहन','didi':'दीदी',
'beta':'बेटा','beti':'बेटी','dada':'दादा','dadi':'दादी','nana':'नाना','nani':'नानी',
'teen':'तीन','chaar':'चार','paanch':'पाँच','chhe':'छह','saat':'सात','aath':'आठ','nau':'नौ','das':'दस',
'aaj':'आज','kal':'कल','subah':'सुबह','shaam':'शाम','raat':'रात','phir':'फिर','lekin':'लेकिन',
'magar':'मगर','isliye':'इसलिए','kyunki':'क्योंकि','wala':'वाला','wali':'वाली','tarah':'तरह',
'saath':'साथ','bina':'बिना','zyada':'ज़्यादा','pehle':'पहले','baad':'बाद','upar':'ऊपर',
'neeche':'नीचे','andar':'अंदर','bahar':'बाहर','aage':'आगे','peeche':'पीछे','paas':'पास',
'dur':'दूर','yaad':'याद','rakho':'रखो','aankh':'आँख','aankhen':'आँखें','kaan':'कान',
'naak':'नाक','muh':'मुँह','haath':'हाथ','pair':'पैर','daant':'दाँत','jeebh':'जीभ',
'dimaag':'दिमाग','dil':'दिल','sir':'सिर','pet':'पेट','dekhte':'देखते','dekhti':'देखती',
'dekhta':'देखता','sochte':'सोचते','ghar':'घर','kitab':'किताब','rang':'रंग','phool':'फूल',
'ped':'पेड़','pani':'पानी','paani':'पानी','doodh':'दूध','sooraj':'सूरज','chanda':'चंदा'
};
function fixRoman(t){
  if(!t) return t;
  let r = String(t);
  const keys = Object.keys(RH).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    r = r.replace(new RegExp('\\b'+k+'\\b','gi'), ()=>RH[k]);
  }
  return r;
}
function prepare(t){
  let x = String(t);
  x = x.replace(/\bBaa\b/gi,'बा').replace(/\bba\b/gi,'बा');
  return fixRoman(x);
}

/* ===== SPEECH ===== */
let voices=[], soundOn=true;
function loadV(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ loadV(); speechSynthesis.onvoiceschanged = loadV; }
function pickV(lang){
  const b = lang.split('-')[0];
  const hi = b==='hi';
  const names = hi
    ? ['Google हिन्दी','Microsoft Swara','Microsoft Kalpana','Lekha','Aditi','Google UK English Female','Microsoft Zira']
    : ['Google UK English Female','Microsoft Zira','Samantha','Microsoft Heera','Google US English'];
  for(const n of names){ const v=voices.find(x=>x.name&&x.name.includes(n)); if(v)return v; }
  return voices.find(v=>v.lang.replace('_','-').startsWith(b)) || null;
}
function speak(text, lang='hi-IN', rate=0.78){
  if(!soundOn||!('speechSynthesis' in window)||!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(prepare(text));
  u.lang=lang; u.rate=rate; u.pitch=1.2; u.volume=1;
  const v=pickV(lang); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function speakSeq(lines, lang='hi-IN', cb){
  if(!soundOn||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i=0;
  const go=()=>{
    if(i>=lines.length){ if(cb)cb(-1); return; }
    if(cb)cb(i);
    const u=new SpeechSynthesisUtterance(prepare(lines[i]));
    u.lang=lang; u.rate=0.72; u.pitch=1.25;
    const v=pickV(lang); if(v)u.voice=v;
    u.onend=()=>{ i++; setTimeout(go,300); };
    speechSynthesis.speak(u);
  };
  go();
}
function toggleSound(){
  soundOn=!soundOn;
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('muteBtn').textContent = soundOn?'🔊':'🔇';
}

/* ===== STARS ===== */
let stars = parseInt(localStorage.getItem('klh_stars')||'0',10);
function addStar(){ stars++; localStorage.setItem('klh_stars',stars); document.getElementById('starCount').textContent=stars; }
document.getElementById('starCount').textContent = stars;

/* ===== HELPERS ===== */
function numToWord(n){
  const o=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n<20)return o[n];
  if(n<100)return t[Math.floor(n/10)]+(n%10?' '+o[n%10]:'');
  return 'One Hundred';
}
function makeNums(max){ const a=[]; for(let i=0;i<=max;i++) a.push({n:i,word:numToWord(i)}); return a; }

function shuff(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const screen=document.getElementById('screen');
const hTitle=document.getElementById('hTitle');
const hSub=document.getElementById('hSub');
const backBtn=document.getElementById('backBtn');

let state={level:null,cat:null,view:'home'};
let curItems=[],curPoem=null,curLesson=null,curTable=null,curStory=null,curWriting=null,curQuiz=null,curMatch=null,curMiss=null;

function setH(t,s){ hTitle.textContent=t; hSub.textContent=s; backBtn.style.visibility = state.view==='home'?'hidden':'visible'; }
function goHome(){ state={level:null,cat:null,view:'home'}; renderHome(); }
function goLevel(k){ state={level:k,cat:null,view:'level'}; renderLevel(); }
function goCat(c){ state.cat=c; state.view='cat'; renderCategory(); }
function goBack(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(state.view==='home') return;
  if(state.view==='level'){ state={level:null,cat:null,view:'home'}; renderHome(); return; }
  state.view='level'; state.cat=null; renderLevel();
}

function renderHome(){
  setH("Shifa's Learning Hub",'✨ Learn • Play • Grow ✨');
  screen.innerHTML=`<div class="hero"><h1>🎈 Welcome to Learning Land!</h1><p>Apni class chuno aur seekhna shuru karo ✨</p></div>
  <div class="grid levels">${Object.entries(LEVELS).map(([k,l])=>`<button class="card" style="--c:${l.color}" onclick="goLevel('${k}')"><span class="emo">${l.emoji}</span><span class="ttl">${l.name}</span><span class="sub">${l.sub}</span></button>`).join('')}</div>`;
  window.scrollTo(0,0);
}

function renderLevel(){
  const l=LEVELS[state.level];
  setH(l.name,l.sub);
  screen.innerHTML=`<div class="hero" style="padding:10px 10px 20px"><h1 style="font-size:1.6rem">${l.emoji} ${l.name}</h1><p>Neeche tap karo 👇</p></div>
  <div class="grid">${l.cats.map(id=>{const c=CATS[id];return `<button class="card" style="--c:${c.c}" onclick="goCat('${id}')"><span class="emo">${c.e}</span><span class="ttl">${c.n}</span></button>`;}).join('')}</div>`;
  window.scrollTo(0,0);
}

function renderCategory(){
  const cid=state.cat; const cat=CATS[cid]; const d=CONTENT[cid];
  curItems=d.items||[];
  setH(cat.n, LEVELS[state.level].name);

  if(d.t==='cards'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>cardHTML(it,i)).join('')+'</div>';

    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="opp-card" onclick="tapOpp(${i})">

      <button class="sq-card" onclick="tapSq(${i},'sq')">
        <span class="expr">${it.n}²</span><span class="eq">${it.n} × ${it.n}</span><span class="res">= ${it.val}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='cube'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="sq-card" onclick="tapSq(${i},'cube')">
        <span class="expr">${it.n}³</span><span class="eq">${it.n} × ${it.n} × ${it.n}</span><span class="res">= ${it.val}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='quiz'){
    screen.innerHTML='<div id="quizBox"></div>';
    curQuiz={idx:0,score:0,q:shuff([...d.q]).slice(0,10)};
    drawQuiz();
  } else if(d.t==='missing-letter'){
    curMiss={idx:0,score:0,list:shuff([...curItems]).slice(0,10),mode:'L'};
    drawMissLetter(); return;
  } else if(d.t==='missing-number'){
    curMiss={idx:0,score:0,list:shuff([...curItems]).slice(0,10),mode:'N'};
    drawMissNumber(); return;
  } else if(d.t==='matching'){
    curMatch={sel:null,done:0,items:d.items};
    drawMatch(); return;
  }
  window.scrollTo(0,0);
}

function cardHTML(it,i){
  let v='', ex='', dl='';
  if(it.numTile){ v=`<span class="num-tile" style="background:${it.numTile}">${it.main}</span>`; }
  else if(it.isWord){
    ex='word-item';
    const L=it.main.length;
    dl = L<=6?'s':L<=9?'m':'l';
    v=`<span class="wordtext">${it.main}</span>`;
  }
  else if(it.color && !it.badge && !it.emoji){ v=`<span class="swatch" style="background:${it.color}"></span>`; }
  else if(it.emoji){ v=`<span class="visual">${it.emoji}</span>`; }
  else { v=`<span class="bignum">${it.main}</span>`; }
  return `<button class="item ${ex}" data-len="${dl}" onclick="tap(${i})">
    ${it.badge?`<span class="badge">${it.badge}</span>`:''}${v}
    <span class="label">${it.sub||it.main}</span>
  </button>`;
}

function tap(i){ const it=curItems[i]; if(!it)return; speak(it.say||it.main||it.sub); addStar(); }
function tapOpp(i){ const it=curItems[i]; if(!it)return; speak(it.l+' aur '+it.r); addStar(); }
function tapInfo(i){ const it=curItems[i]; if(!it)return; speak(it.main+'. '+it.text); addStar(); }
function tapSq(i,m){ const it=curItems[i]; if(!it)return; speak(m==='sq'?it.n+' ka square equals '+it.val:it.n+' ka cube equals '+it.val); addStar(); }

/* MISSING LETTER */
function drawMissLetter(){
  if(curMiss.idx>=curMiss.list.length){
    screen.innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Score: ${curMiss.score} / ${curMiss.list.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Wapas</button></div>`;
    speak('Well done!'); return;
  }
  const it=curMiss.list[curMiss.idx];
  const w=it.word;
  const pos=Math.floor(Math.random()*w.length);
  const cor=w[pos];
  const disp=w.split('').map((ch,i)=>i===pos?'<span class="blank">_</span>':ch).join('');
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const opts=[cor];
  while(opts.length<3){ const r=letters[Math.floor(Math.random()*26)]; if(!opts.includes(r))opts.push(r); }
  shuff(opts);
  screen.innerHTML=`<div class="missing-view">
    <div class="qmeta">Question ${curMiss.idx+1} / ${curMiss.list.length} • ⭐ ${curMiss.score}</div>
    <div class="picture">${it.emoji}</div>
    <div class="label">Missing letter dhoondo 👇</div>
    <div class="question">${disp}</div>
    <div class="missing-options">${opts.map(o=>`<button class="mopt" onclick="ansMissL('${o}','${cor}')">${o}</button>`).join('')}</div>
  </div>`;
  speak('Which letter is missing in '+w.split('').join(' '));
}
function ansMissL(o,c){
  const b=document.querySelectorAll('.mopt'); b.forEach(x=>x.disabled=true);
  if(o===c){ curMiss.score++; b.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { b.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('wrong'); if(x.textContent.trim()===c)x.classList.add('right');}); speak('Oops! Answer is '+c); }
  setTimeout(()=>{ curMiss.idx++; drawMissLetter(); },1500);
}
/* MISSING NUMBER */
function drawMissNumber(){
  if(curMiss.idx>=curMiss.list.length){
    screen.innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Score: ${curMiss.score} / ${curMiss.list.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Wapas</button></div>`;
    speak('Well done!'); return;
  }
  const it=curMiss.list[curMiss.idx];
  const n=it.n;
  const mode=Math.floor(Math.random()*3);
  let disp,cor;
  if(mode===0){ disp=`_ , ${n+1} , ${n+2}`; cor=n; }
  else if(mode===1){ disp=`${n-1} , _ , ${n+1}`; cor=n; }
  else { disp=`${n-1} , ${n} , _`; cor=n+1; }
  const opts=[cor];
  while(opts.length<3){ const r=cor+Math.floor(Math.random()*7)-3; if(r>=0 && !opts.includes(r)) opts.push(r); }
  shuff(opts);
  screen.innerHTML=`<div class="missing-view">
    <div class="qmeta">Question ${curMiss.idx+1} / ${curMiss.list.length} • ⭐ ${curMiss.score}</div>
    <div class="picture">🔢</div>
    <div class="label">Missing number dhoondo 👇</div>
    <div class="question" style="font-size:2.4rem">${disp}</div>
    <div class="missing-options">${opts.map(o=>`<button class="mopt" onclick="ansMissN(${o},${cor})">${o}</button>`).join('')}</div>
  </div>`;
  speak('Which number is missing?');
}
function ansMissN(o,c){
  const b=document.querySelectorAll('.mopt'); b.forEach(x=>x.disabled=true);
  if(o===c){ curMiss.score++; b.forEach(x=>{if(parseInt(x.textContent)===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { b.forEach(x=>{if(parseInt(x.textContent)===o)x.classList.add('wrong'); if(parseInt(x.textContent)===c)x.classList.add('right');}); speak('Oops! Answer is '+c); }
  setTimeout(()=>{ curMiss.idx++; drawMissNumber(); },1500);
}
/* MATCHING */
function drawMatch(){
  const it=curMatch.items;
  const L=it.map(x=>x.left);
  const R=shuff([...it.map(x=>x.right)]);
  screen.innerHTML=`<div class="match-view"><h2>🎯 Match the Following</h2>
    <div class="match-cols">
      <div class="match-col"><h3>Left</h3>${L.map(l=>`<button class="match-btn" data-side="L" data-val="${l}" onclick="clickM(this)">${l}</button>`).join('')}</div>
      <div class="match-col"><h3>Right</h3>${R.map(r=>`<button class="match-btn" data-side="R" data-val="${r}" onclick="clickM(this)">${r}</button>`).join('')}</div>
    </div>
    <div class="poem-actions"><button class="btn primary" onclick="renderCategory()">↩️ Wapas</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function clickM(b){
  if(b.classList.contains('done'))return;
  const s=b.dataset.side, v=b.dataset.val;
  if(s==='L'){
    document.querySelectorAll('[data-side="L"]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); curMatch.sel=b; speak(v);
  } else {
    if(!curMatch.sel){ speak('Pehle left se choose karo'); return; }
    const lv=curMatch.sel.dataset.val;
    const cor=curMatch.items.find(x=>x.left===lv);
    if(cor && cor.right===v){
      curMatch.sel.classList.remove('sel'); curMatch.sel.classList.add('done'); b.classList.add('done');
      curMatch.sel=null; curMatch.done++; speak('Correct!'); addStar();
      if(curMatch.done===curMatch.items.length) setTimeout(()=>alert('🎉 Shabaash!'),400);
    } else {
      b.classList.add('err'); curMatch.sel.classList.remove('sel'); curMatch.sel=null;
      speak('Try again'); setTimeout(()=>b.classList.remove('err'),700);
    }
  }
}
/* TABLE */
function openTable(i){
  curTable=curItems[i]; state.view='table';
  setH('Table of '+curTable.n,'Tap line to hear');
  screen.innerHTML=`<div class="table-view"><h2>✖️ Table of ${curTable.n}</h2>
    ${curTable.rows.map((r,j)=>`<button class="trow" onclick="speakRow(${j})">${r}</button>`).join('')}
    <div class="poem-actions"><button class="btn primary" onclick="playTable()">▶️ Poora Table</button><button class="btn" onclick="renderCategory()">↩️ Wapas</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function speakRow(j){ speak(curTable.spoken[j]); document.querySelectorAll('.trow').forEach((e,k)=>e.classList.toggle('active',k===j)); addStar(); }
function playTable(){ speakSeq(curTable.spoken,'en-IN',idx=>{document.querySelectorAll('.trow').forEach((e,k)=>e.classList.toggle('active',k===idx));}); addStar(); }
/* LESSON */
function openLesson(i){
  curLesson=curItems[i]; state.view='lesson';
  setH(curLesson.title,curLesson.chapter);
  screen.innerHTML=`<div class="lesson"><h2>${curLesson.emoji} ${curLesson.title}</h2><div class="chapter">${curLesson.chapter}</div>
    <div class="sec-title">📖 Padhai</div>
    ${curLesson.points.map((p,j)=>`<button class="point" onclick="speakPt(${j})"><span class="dot">🔹</span><span>${p}</span></button>`).join('')}
    <div class="sec-title">❓ Prashn Uttar</div>
    ${curLesson.qa.map((q,j)=>`<div class="qa-item"><div class="qa-q" onclick="speakQ(${j})">Q${j+1}. ${q.q} 🔊</div><button class="ans-btn" onclick="revAns(${j})">👉 Uttar Dekho</button><div class="qa-a" id="ans-${j}">${q.a}</div></div>`).join('')}
    <div class="poem-actions"><button class="btn primary" onclick="playLesson()">▶️ Poora Lesson</button><button class="btn" onclick="renderCategory()">↩️ Wapas</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function speakPt(j){ speak(curLesson.points[j]); document.querySelectorAll('.point').forEach((e,k)=>e.classList.toggle('active',k===j)); addStar(); }
function speakQ(j){ speak(curLesson.qa[j].q); addStar(); }
function revAns(j){ const el=document.getElementById('ans-'+j); if(!el)return; el.classList.toggle('show'); if(el.classList.contains('show')) speak(curLesson.qa[j].a); addStar(); }
function playLesson(){
  const s=[]; curLesson.points.forEach(p=>s.push(p));
  curLesson.qa.forEach((qa,k)=>{ s.push('Question '+(k+1)+'. '+qa.q); s.push('Answer. '+qa.a); });
  speakSeq(s,'hi-IN',idx=>{document.querySelectorAll('.point').forEach((e,k)=>e.classList.toggle('active',k===idx));});
  addStar();
}
/* STORY */
function openStory(i){
  curStory=curItems[i]; state.view='story';
  setH(curStory.title,'Reading Time 📖');
  const bg=curStory.bg||'linear-gradient(135deg,#a8e6ff,#ffd6ec)';
  screen.innerHTML=`<div class="poem"><div class="poem-hero" style="background:${bg}">
    <div class="hero-pic">${curStory.emoji}</div><h2>${curStory.title}</h2><div class="author">Read along with me 📖</div></div>
    <div class="poem-body"><div class="lines">
      ${curStory.lines.map((l,j)=>`<button class="line" onclick="speakSL(${j})"><span class="pic">${l[1]}</span><span>${l[0]}</span></button>`).join('')}
    </div>
    <div class="sec-title" style="margin-top:24px">❓ Questions</div>
    ${curStory.qa.map((q,j)=>`<div class="qa-item"><div class="qa-q" onclick="speakSQ(${j})">Q${j+1}. ${q.q} 🔊</div><button class="ans-btn" onclick="revSA(${j})">👉 Answer Dekho</button><div class="qa-a" id="sa-${j}">${q.a}</div></div>`).join('')}
    <div class="poem-actions"><button class="btn primary" onclick="playStory()">▶️ Poori Story Suno</button><button class="btn" onclick="renderCategory()">↩️ Wapas</button></div>
  </div></div>`;
  window.scrollTo(0,0);
}
function speakSL(j){ speak(curStory.lines[j][0]); document.querySelectorAll('.line').forEach((e,k)=>{e.classList.toggle('active',k===j); if(k===j)e.scrollIntoView({behavior:'smooth',block:'center'});}); addStar(); }
function speakSQ(j){ speak(curStory.qa[j].q); addStar(); }
function revSA(j){ const el=document.getElementById('sa-'+j); if(!el)return; el.classList.toggle('show'); if(el.classList.contains('show')) speak(curStory.qa[j].a); addStar(); }
function playStory(){ const t=curStory.lines.map(l=>l[0]); speakSeq(t,'en-IN',idx=>{document.querySelectorAll('.line').forEach((e,k)=>{e.classList.toggle('active',k===idx); if(k===idx)e.scrollIntoView({behavior:'smooth',block:'center'});});}); addStar(); }
/* WRITING */
function openWriting(i){
  curWriting=curItems[i]; state.view='writing';
  setH(curWriting.title,'Writing ✍️');
  screen.innerHTML=`<div class="lesson"><h2>${curWriting.emoji} ${curWriting.title}</h2><div class="chapter">${curWriting.instruction}</div>
    <div style="text-align:center;padding:12px;background:#fff8ee;border-radius:12px;margin-bottom:16px;color:#8B5A2B;font-weight:700;border:2px dashed #d4a373">📝 Copy mein likho — har item tap karo aur 5 baar likho</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:10px">
      ${curWriting.items.map((item,j)=>`<button id="wr-${j}" onclick="tapW(${j})" style="border:2px dashed #d4a373;background:#fffefb;border-radius:12px;padding:16px 6px;font-family:inherit;font-size:1.4rem;font-weight:800;color:#5a3a1a;cursor:pointer;min-height:70px">${item}</button>`).join('')}
    </div>
    <div class="poem-actions"><button class="btn primary" onclick="playW()">▶️ Sab Suno</button><button class="btn" onclick="renderCategory()">↩️ Wapas</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function tapW(j){
  speak(curWriting.items[j]);
  const el=document.getElementById('wr-'+j);
  if(el){ el.style.background='linear-gradient(135deg,#34C759,#28a745)'; el.style.color='#fff'; el.style.borderStyle='solid'; }
  addStar();
}
function playW(){
  speakSeq(curWriting.items,'en-IN',idx=>{
    const el=document.getElementById('wr-'+idx);
    if(el){ el.style.background='linear-gradient(135deg,#7c5cff,#ff5f9e)'; el.style.color='#fff'; }
    if(idx===-1){ document.querySelectorAll('[id^="wr-"]').forEach(e=>{e.style.background='#fffefb'; e.style.color='#5a3a1a';}); }
  });
  addStar();
}
/* POEM */
function openPoem(i){
  curPoem=curItems[i]; state.view='poem';
  setH(curPoem.title,'Rhyme Time 🎵');
  const bg=curPoem.bg||'linear-gradient(135deg,#a8e6ff,#ffd6ec,#e0d4ff)';
  const hp=curPoem.heroPic||curPoem.emoji;
  screen.innerHTML=`<div class="poem"><div class="poem-hero" style="background:${bg}">
    <div class="hero-pic">${hp}</div><h2>${curPoem.emoji} ${curPoem.title}</h2><div class="author">— ${curPoem.author}</div></div>
    <div class="poem-body"><div class="lines">
      ${curPoem.lines.map((l,j)=>`<button class="line" onclick="speakLn(${j})"><span class="pic">${l[1]}</span><span>${l[0]}</span></button>`).join('')}
    </div>
    <div class="poem-actions"><button class="btn primary" onclick="playPoem()">▶️ Poori Poem</button><button class="btn" onclick="renderCategory()">↩️ Wapas</button></div>
  </div></div>`;
  window.scrollTo(0,0);
}
function speakLn(j){ speak(curPoem.lines[j][0],curPoem.lang||'hi-IN'); document.querySelectorAll('.line').forEach((e,k)=>{e.classList.toggle('active',k===j); if(k===j)e.scrollIntoView({behavior:'smooth',block:'center'});}); addStar(); }
function playPoem(){ const t=curPoem.lines.map(l=>l[0]); speakSeq(t,curPoem.lang||'hi-IN',idx=>{document.querySelectorAll('.line').forEach((e,k)=>{e.classList.toggle('active',k===idx); if(k===idx)e.scrollIntoView({behavior:'smooth',block:'center'});});}); addStar(); }
/* QUIZ */
function drawQuiz(){
  const box=document.getElementById('quizBox'); if(!box)return;
  if(curQuiz.idx>=curQuiz.q.length){
    const p=curQuiz.score===curQuiz.q.length;
    box.innerHTML=`<div class="result"><div style="font-size:4rem">${p?'🏆':'🌟'}</div><h2>Score: ${curQuiz.score} / ${curQuiz.q.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Phir Se</button></div>`;
    speak(p?'Perfect score!':'You scored '+curQuiz.score+' out of '+curQuiz.q.length);
    return;
  }
  const q=curQuiz.q[curQuiz.idx];
  box.innerHTML=`<div class="quiz"><div class="qmeta">Question ${curQuiz.idx+1} / ${curQuiz.q.length} • ⭐ ${curQuiz.score}</div>
    <h2 class="qtext">${q.q}</h2>
    <div class="options">${q.o.map(o=>`<button class="opt" onclick="ansQuiz('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
  </div>`;
  speak(q.q);
}
function ansQuiz(o){
  const q=curQuiz.q[curQuiz.idx];
  const opts=document.querySelectorAll('.opt'); opts.forEach(x=>x.disabled=true);
  if(o===q.a){ curQuiz.score++; opts.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { opts.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('wrong'); if(x.textContent.trim()===q.a)x.classList.add('right');}); speak('Correct answer is '+q.a); }
  setTimeout(()=>{ curQuiz.idx++; drawQuiz(); },1500);
}

/* START */
renderHome();
document.body.addEventListener('touchstart',function u(){
  if('speechSynthesis' in window){ const s=new SpeechSynthesisUtterance(' '); s.volume=0; speechSynthesis.speak(s); }
  document.body.removeEventListener('touchstart',u);
},{once:true});
</script>
