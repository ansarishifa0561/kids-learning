<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifa's Learning Hub | Play • Learn • Grow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== PREMIUM UI ===== */
:root {
  --purple: #6c5ce7;
  --pink: #fd79a8;
  --ink: #282747;
  --muted: #72728d;
  --paper: #ffffff;
  --line: #e8e5ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Baloo 2', system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, #fdfbfb, #ebedee, #e0c3fc);
  background-attachment: fixed;
  min-height: 100vh;
  padding: 20px;
}
.app {
  max-width: 1250px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.98);
  border: 5px solid #a29bfe;
  border-radius: 36px;
  box-shadow: 0 25px 60px rgba(108, 92, 231, 0.2);
  position: relative;
  overflow: hidden;
}
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  padding: 15px 25px;
  display: flex; align-items: center; gap: 15px;
  border-bottom: 3px solid #f1f2f6;
}
.logo {
  width: 55px; height: 55px; border-radius: 18px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
  position: relative;
}
.logo span { position: absolute; }
.logo .book { bottom: 8px; left: 8px; font-size: 20px; }
.logo .kids { top: 8px; right: 8px; font-size: 22px; z-index: 2; }
.logo .pencil { bottom: 5px; right: 5px; font-size: 14px; z-index: 3; }

.brand h1 { font-size: 1.4rem; font-weight: 800; color: var(--purple); }
.brand small { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.spacer { flex: 1; }
.stars {
  background: #fff7d6; color: #875b00; border: 2px solid #ffe6a0;
  border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: 1rem;
}
.back-btn {
  background: #f0edff; color: var(--purple); border: none; border-radius: 12px;
  padding: 8px 16px; font-weight: 800; font-size: 1rem; cursor: pointer;
  display: none; transition: 0.2s;
}
.back-btn:hover { background: #e0d9ff; }

main { padding: 30px; min-height: 60vh; }

/* Solver */
.solver-wrapper {
  background: linear-gradient(135deg, #ffffff, #f8f6ff);
  border: 3px dashed #a66cff; border-radius: 24px;
  padding: 24px; text-align: center;
  box-shadow: 0 10px 30px rgba(166, 108, 255, 0.15);
  margin-bottom: 30px;
}
.solver-wrapper h2 { color: var(--purple); font-size: 1.5rem; margin-bottom: 8px; }
.solver-inputs { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.solver-inputs input {
  padding: 12px 16px; border: 2px solid #dcd7ff; border-radius: 12px;
  font-size: 1.1rem; font-family: inherit; font-weight: 700; outline: none;
  width: 100%; max-width: 280px;
}
.solve-btn {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: white; border: none; border-radius: 12px;
  padding: 12px 30px; font-size: 1.1rem; font-family: inherit;
  font-weight: 800; cursor: pointer;
}
.solver-result {
  background: #fff; border-left: 6px solid #34C759; padding: 18px;
  border-radius: 12px; text-align: left; margin-top: 20px;
  display: none; line-height: 1.8; font-size: 1.05rem; font-weight: 600;
}

/* Hero */
.hero {
  background: linear-gradient(120deg, #6c5ce7, #a66cff 50%, #fd79a8);
  border-radius: 24px; padding: 40px; color: white;
  box-shadow: 0 15px 35px rgba(108, 92, 231, 0.3); margin-bottom: 30px;
}
.hero h2 { font-size: 2.2rem; margin-bottom: 10px; }

/* Grids & Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.card {
  background: var(--paper); border: 2px solid var(--line); border-radius: 20px;
  padding: 20px; cursor: pointer; transition: 0.2s;
  box-shadow: 0 8px 20px rgba(0,0,0,0.04);
}
.card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(108,92,231,0.15); border-color: #a29bfe; }
.card h3 { font-size: 1.2rem; margin: 10px 0 5px; }
.card p { font-size: 0.9rem; color: var(--muted); }
.card .emoji { font-size: 2.5rem; }

/* Lesson Content */
.panel { background: var(--paper); border: 2px solid var(--line); border-radius: 24px; padding: 30px; max-width: 900px; margin: 0 auto; }
.crumb { font-size: 0.9rem; color: var(--muted); font-weight: 700; margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap;}
.crumb span { color: var(--purple); cursor: pointer; }
.crumb span:hover { text-decoration: underline; }
.lesson-title { text-align: center; margin-bottom: 30px; }
.lesson-title .big-emoji { font-size: 4rem; }
.lesson-title h2 { font-size: 2rem; margin: 10px 0; }

/* Practice */
.practice { background: #f8f7ff; border: 2px solid var(--line); border-radius: 20px; padding: 24px; margin-top: 20px;}
.question { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.question p { font-weight: 800; font-size: 1.1rem; margin-bottom: 14px; }
.options { display: flex; flex-wrap: wrap; gap: 10px; }
.option {
  background: #fff; border: 2px solid #dcd7ff; border-radius: 12px;
  padding: 10px 18px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
  transition: 0.2s; font-family: inherit;
}
.option:hover { background: #f0edff; }
.option.correct { background: #d8fff0; border-color: #39c995; color: #08764d; }
.option.wrong { background: #ffe4ec; border-color: #ff8eae; color: #9e254c; }

/* Visual Addition Blocks */
.visual-math-block {
  background: #fff8e7; border: 2px solid #ffedb5; border-radius: 16px;
  padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px;
}
.visual-math-block .equation { font-size: 1.5rem; font-weight: 800; text-align: center; color: var(--purple); }
.visual-math-block .objects { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 2.5rem; }
.visual-math-block .objects .group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 200px; }
.visual-math-block .plus-sign { font-size: 2rem; color: #888; }
.visual-math-block .equals-sign { font-size: 2rem; color: #888; }
.visual-math-block .answer-options { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }

/* Verbs */
.verb-card { background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.verb-header { display: flex; justify-content: space-between; align-items: flex-start; }
.verb-title { font-size: 1.5rem; font-weight: 800; color: var(--purple); }
.verb-hindi { font-size: 1.1rem; font-weight: 700; color: var(--muted); }
.verb-forms { background: #fff8e7; padding: 12px; border-radius: 12px; font-weight: 700; display: flex; gap: 20px; }
.verb-sentence { background: #f0fdf4; padding: 12px; border-radius: 12px; border-left: 5px solid #22c55e; font-weight: 600; color: #166534; }

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  main { padding: 15px; }
  .visual-math-block .objects { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
    <div class="logo">
      <span class="book">📖</span>
      <span class="kids">👧👦</span>
      <span class="pencil">✏️</span>
    </div>
    <div class="brand">
      <h1 id="appTitle">Shifa's Learning Hub</h1>
      <small id="appSub">Play • Learn • Grow ✨</small>
    </div>
    <div class="spacer"></div>
    <div class="stars">⭐ <span id="starCount">0</span></div>
  </header>

  <main id="screen"></main>
</div>

<script>
// =========================================
// 1. STATE & DATA
// =========================================
let state = { view: 'home', classId: null, subjectId: null, topicId: null };
let stars = parseInt(localStorage.getItem('shifaStars') || '0', 10);
document.getElementById('starCount').textContent = stars;

const classes = [
  {id:'nursery', name:'Nursery', age:'3–4 Years', emoji:'🧸', subjects:['english','maths','evs','rhymes','grammar']},
  {id:'jr', name:'Jr KG', age:'4–5 Years', emoji:'🎈', subjects:['english','maths','evs','rhymes','grammar']},
  {id:'sr', name:'Sr KG', age:'5–6 Years', emoji:'🎒', subjects:['english','maths','evs','rhymes','grammar']},
  {id:'class1', name:'Class 1', age:'6–7 Years', emoji:'📚', subjects:['maths','english','evs','computer','grammar']},
  {id:'class2', name:'Class 2', age:'7–8 Years', emoji:'✏️', subjects:['maths','english','science','computer','grammar']},
  {id:'class3', name:'Class 3', age:'8–9 Years', emoji:'📖', subjects:['maths','english','science','social','grammar']},
  {id:'class4', name:'Class 4', age:'9–10 Years', emoji:'🎯', subjects:['maths','english','science','social','grammar']},
  {id:'class5', name:'Class 5', age:'10–11 Years', emoji:'🔬', subjects:['maths','english','science','social','grammar']},
  {id:'class6', name:'Class 6', age:'11–12 Years', emoji:'🌏', subjects:['maths','english','science','social','grammar']},
  {id:'class7', name:'Class 7', age:'12–13 Years', emoji:'⚛️', subjects:['maths','english','science','social','grammar']},
  {id:'class8', name:'Class 8', age:'13–14 Years', emoji:'🚀', subjects:['maths','english','science','social','grammar']}
];

const subjectsMap = {
  english: ['🔤', 'English'],
  maths: ['🧮', 'Mathematics'],
  evs: ['🌱', 'EVS'],
  rhymes: ['🎵', 'Rhymes'],
  science: ['🔬', 'Science'],
  social: ['🗺️', 'Social Studies'],
  computer: ['💻', 'Computer'],
  grammar: ['📝', 'Grammar & Verbs']
};

// REAL CHAPTERS FOR EVERY CLASS
const chaptersData = {
  class1: {
    maths: [
      {id:'add_visual', title:'Addition (Visual)', emoji:'➕', desc:'Add objects & numbers'},
      {id:'sub_visual', title:'Subtraction (Visual)', emoji:'➖', desc:'Take away objects'}
    ],
    english: [{id:'nouns', title:'Nouns', emoji:'🏷️', desc:'Naming words'}]
  },
  nursery: {
    english: [{id:'alphabet', title:'A to Z Alphabet', emoji:'🔠', desc:'Learn letters'}, {id:'2letter', title:'2 Letter Words', emoji:'📝', desc:'at, an, in...'}],
    maths: [{id:'numbers20', title:'Numbers 1 to 20', emoji:'🔢', desc:'Count'}, {id:'shapes', title:'Shapes', emoji:'🔺', desc:'Circle, Square...'}, {id:'colors', title:'Colours', emoji:'🎨', desc:'Red, Blue...'}],
    evs: [{id:'animals', title:'Animals', emoji:'🐘', desc:'Names & sounds'}]
  }
};

function getChapters(cid, sid) {
  if(chaptersData[cid] && chaptersData[cid][sid]) return chaptersData[cid][sid];
  return [
    {id:'ch1', title:'Chapter 1', emoji:'📘', desc:'Learn basics'},
    {id:'ch2', title:'Chapter 2', emoji:'📘', desc:'Practice'}
  ];
}

const verbs = [
  {v1:'Go', v3:'Gone', hi:'जाना', s:'I go to school.'},
  {v1:'Eat', v3:'Eaten', hi:'खाना', s:'I eat an apple.'},
  {v1:'Sleep', v3:'Slept', hi:'सोना', s:'The baby sleeps.'},
  {v1:'Play', v3:'Played', hi:'खेलना', s:'We play in the park.'},
  {v1:'Run', v3:'Run', hi:'दौड़ना', s:'I run fast.'},
  {v1:'Write', v3:'Written', hi:'लिखना', s:'I write a letter.'}
];

const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const numbers = Array.from({length:20}, (_,i)=>i+1);
const shapes = [['Circle','⭕'],['Square','🟥'],['Triangle','🔺'],['Rectangle','🟦'],['Star','⭐'],['Heart','❤️']];
const colors = [['Red','#FF3B30'],['Blue','#0A84FF'],['Green','#34C759'],['Yellow','#FFD60A'],['Orange','#FF9500'],['Purple','#AF52DE']];

// Visual Addition Questions Data
const visualAddData = [
  { a: 2, b: 3, emoji: '⚽', ans: 5 },
  { a: 3, b: 2, emoji: '🍎', ans: 5 },
  { a: 4, b: 1, emoji: '🌟', ans: 5 },
  { a: 2, b: 4, emoji: '🍌', ans: 6 },
  { a: 5, b: 3, emoji: '🐶', ans: 8 },
  { a: 6, b: 2, emoji: '🌸', ans: 8 },
  { a: 3, b: 5, emoji: '🚗', ans: 8 },
  { a: 4, b: 4, emoji: '🎈', ans: 8 },
  { a: 7, b: 2, emoji: '🍓', ans: 9 },
  { a: 5, b: 4, emoji: '🦋', ans: 9 }
];

// =========================================
// 2. UI HELPERS
// =========================================
const screen = document.getElementById('screen');
const backBtn = document.getElementById('backBtn');

function updateHeader(title, sub) {
  document.getElementById('appTitle').textContent = title;
  document.getElementById('appSub').textContent = sub;
  backBtn.style.display = state.view === 'home' ? 'none' : 'block';
}

function addStar() {
  stars++;
  localStorage.setItem('shifaStars', stars);
  document.getElementById('starCount').textContent = stars;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

// =========================================
// 3. RENDER VIEWS
// =========================================
function renderHome() {
  state = { view: 'home', classId: null, subjectId: null, topicId: null };
  updateHeader("Shifa's Learning Hub", "Play • Learn • Grow ✨");
  
  screen.innerHTML = `
    <div class="hero">
      <h2>Welcome to Learning Land! 🎈</h2>
      <p>Explore chapters, solve math, and learn like a pro.</p>
    </div>
    
    <div class="solver-wrapper">
      <h2>🧠 Apna Math Question Solve Karo!</h2>
      <div class="solver-inputs">
        <input type="text" id="eq1" placeholder="1st Eq (e.g. 4x + 3 = 15)" />
        <input type="text" id="eq2" placeholder="2nd Eq (Optional)" />
        <button class="solve-btn" onclick="solveEquation()">Solve ▶</button>
      </div>
      <div id="solverResult" class="solver-result"></div>
    </div>

    <h2 style="margin-bottom:16px;">Choose your class 🎒</h2>
    <div class="grid">
      ${classes.map(c => `
        <div class="card" onclick="openClass('${c.id}')">
          <span class="emoji">${c.emoji}</span>
          <h3>${c.name}</h3>
          <p>${c.age}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function openClass(id) {
  state = { view: 'class', classId: id, subjectId: null, topicId: null };
  const c = classes.find(x => x.id === id);
  updateHeader(c.name, c.age);
  
  screen.innerHTML = `
    <div class="crumb"><span onclick="renderHome()">Home</span> / ${c.name}</div>
    <div class="grid">
      ${c.subjects.map(sid => `
        <div class="card" onclick="openSubject('${sid}')">
          <span class="emoji">${subjectsMap[sid][0]}</span>
          <h3>${subjectsMap[sid][1]}</h3>
        </div>
      `).join('')}
    </div>
  `;
}

function openSubject(sid) {
  state = { view: 'subject', classId: state.classId, subjectId: sid, topicId: null };
  const c = classes.find(x => x.id === state.classId);
  const s = subjectsMap[sid];
  updateHeader(s[1], c.name);

  if (sid === 'grammar') {
    screen.innerHTML = `
      <div class="crumb"><span onclick="renderHome()">Home</span> / <span onclick="openClass('${c.id}')">${c.name}</span> / Grammar</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));">
        ${verbs.map(v => `
          <div class="verb-card">
            <div class="verb-header">
              <div>
                <div class="verb-title">${v.v1} <span style="font-size:1rem; color:#888">(${v.v3})</span></div>
                <div class="verb-hindi">${v.hi}</div>
              </div>
              <button class="option" onclick="speak('${v.v1}. ${v.s}')">🔊</button>
            </div>
            <div class="verb-sentence">${v.s}</div>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }

  const topics = getChapters(c.id, sid);
  screen.innerHTML = `
    <div class="crumb"><span onclick="renderHome()">Home</span> / <span onclick="openClass('${c.id}')">${c.name}</span> / ${s[1]}</div>
    <div class="grid">
      ${topics.map(t => `
        <div class="card" onclick="openTopic('${t.id}')">
          <span class="emoji">${t.emoji}</span>
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function openTopic(tid) {
  state = { view: 'topic', classId: state.classId, subjectId: state.subjectId, topicId: tid };
  const c = classes.find(x => x.id === state.classId);
  updateHeader('Lesson', c.name);

  let html = `<div class="panel"><div class="crumb"><span onclick="renderHome()">Home</span> / <span onclick="openClass('${c.id}')">${c.name}</span> / <span onclick="openSubject('${state.subjectId}')">Back</span></div>`;

  if (tid === 'alphabet') {
    html += `<h2 style="text-align:center; margin-bottom:20px;">A to Z Alphabet</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));">
        ${alphabet.map(l => `<div class="card" style="padding:15px; text-align:center;" onclick="speak('${l} for ${l==='A'?'Apple':l==='B'?'Ball':'Letter '+l}')"><h3 style="font-size:1.8rem; color:var(--purple)">${l}</h3></div>`).join('')}
      </div>`;
  } 
  else if (tid === 'numbers20') {
    html += `<h2 style="text-align:center; margin-bottom:20px;">Numbers 1 to 20</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));">
        ${numbers.map(n => `<div class="card" style="padding:15px; text-align:center;" onclick="speak('${n}')"><h3 style="font-size:1.8rem; color:var(--purple)">${n}</h3></div>`).join('')}
      </div>`;
  }
  else if (tid === 'shapes') {
    html += `<h2 style="text-align:center; margin-bottom:20px;">Basic Shapes</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));">
        ${shapes.map(s => `<div class="card" style="padding:15px; text-align:center;" onclick="speak('${s[0]}')"><span class="emoji" style="font-size:3rem">${s[1]}</span><h3>${s[0]}</h3></div>`).join('')}
      </div>`;
  }
  else if (tid === 'colors') {
    html += `<h2 style="text-align:center; margin-bottom:20px;">Colours</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));">
        ${colors.map(s => `<div class="card" style="padding:15px; text-align:center;" onclick="speak('${s[0]}')"><div style="width:50px; height:50px; border-radius:50%; background:${s[1]}; margin:0 auto 10px; box-shadow:0 4px 10px rgba(0,0,0,0.2)"></div><h3>${s[0]}</h3></div>`).join('')}
      </div>`;
  }
  else if (tid === 'add_visual') {
    html += `<h2 style="text-align:center; margin-bottom:20px;">Visual Addition</h2>
      <p style="text-align:center; margin-bottom:20px; color:var(--muted); font-weight:600;">Count the objects and find the sum.</p>
      <div class="practice">
        ${visualAddData.map((item, i) => `
          <div class="visual-math-block">
            <div class="equation">${item.a} + ${item.b} = ?</div>
            <div class="objects">
              <div class="group">${Array(item.a).fill(item.emoji).join('')}</div>
              <div class="plus-sign">+</div>
              <div class="group">${Array(item.b).fill(item.emoji).join('')}</div>
              <div class="equals-sign">=</div>
              <div style="font-weight:800; font-size:2rem; color:var(--purple)">?</div>
            </div>
            <div class="answer-options">
              ${[item.ans, item.ans + 1, item.ans - 1].sort(()=>Math.random()-0.5).map(opt => `
                <button class="option" onclick="checkVisualAns(this, ${opt === item.ans})">${opt}</button>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>`;
  }
  else {
    html += `<div class="lesson-title"><h2>${tid.toUpperCase()}</h2><p>Learn and practice this chapter.</p></div>
      <div class="practice">
        <h3>Practice</h3>
        <div class="question">
          <p>Read the chapter carefully.</p>
          <div class="options">
            <button class="option" onclick="checkAns(this, true)">Done</button>
          </div>
        </div>
      </div>`;
  }

  html += `</div>`;
  screen.innerHTML = html;
}

function checkAns(btn, isCorrect) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.option').forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.classList.add('correct');
    addStar();
  } else {
    btn.classList.add('wrong');
  }
}

function checkVisualAns(btn, isCorrect) {
  btn.parentElement.querySelectorAll('.option').forEach(b => b.disabled = true);
  if(isCorrect) {
    btn.classList.add('correct');
    addStar();
    speak("Correct!");
  } else {
    btn.classList.add('wrong');
    speak("Try again");
  }
}

function goBack() {
  if (state.view === 'topic') openSubject(state.subjectId);
  else if (state.view === 'subject') openClass(state.classId);
  else renderHome();
}

// =========================================
// 4. SOLVER LOGIC
// =========================================
function solveEquation() {
  let eq = document.getElementById('eq1').value.replace(/\s+/g, '');
  let resDiv = document.getElementById('solverResult');
  if(!eq) return;

  try {
    let parts = eq.split('=');
    let left = parts[0], right = parts[1] || '0';
    
    let lx = left.match(/[+-]?\d*\.?\d*x/g) || [];
    let lc = left.match(/[+-]?\d*\.?\d+(?!x)/g) || [];
    let rx = right.match(/[+-]?\d*\.?\d*x/g) || [];
    let rc = right.match(/[+-]?\d*\.?\d+(?!x)/g) || [];
    
    let a = 0; lx.forEach(m => a += parseFloat(m.replace('x','')) || 1);
    let b = 0; lc.forEach(m => b += parseFloat(m));
    let c = 0; rx.forEach(m => c += parseFloat(m.replace('x','')) || 1);
    let d = 0; rc.forEach(m => d += parseFloat(m));
    
    let finalA = a - c;
    let finalB = d - b;
    let ans = finalB / finalA;
    
    resDiv.innerHTML = `<b>Equation:</b> ${eq}<br><br>
      <b>Step 1:</b> Group variables → ${finalA}x = ${finalB}<br>
      <b>Step 2:</b> Divide by ${finalA} → x = ${ans.toFixed(2)}<br><br>
      <b style="color:#0A84FF; font-size:1.2rem;">✅ Answer: x = ${ans}</b>`;
    resDiv.style.display = 'block';
  } catch(e) {
    resDiv.innerHTML = `<span style="color:red">Invalid equation</span>`;
    resDiv.style.display = 'block';
  }
}

// Start
renderHome();
</script>
