<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifa's Hub — Nursery</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Baloo 2', sans-serif; background: #fffdf9; color: #3e2723; padding: 20px; margin: 0; }
h1 { color: #e67e22; text-align: center; }
h2 { color: #f39c12; text-align: center; margin-top: 30px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.card { background: #fff; border: 3px solid #ffe0b2; border-radius: 15px; padding: 20px; text-align: center; }
.visual { font-size: 1.8rem; margin-bottom: 15px; word-break: break-all; }
.eq { font-size: 1.5rem; font-weight: 800; }
input { width: 60px; height: 60px; font-size: 1.5rem; text-align: center; border: 3px solid #f39c12; border-radius: 10px; outline: none; font-family: inherit; }
input.correct { border-color: #34C759; background: #d8fff0; color: #08764d; }
</style>
</head>
<body>

<h1>🎓 Shifa's Hub</h1>
<p style="text-align:center;">Nursery Maths — Pictures</p>

<h2>➕ Addition (50)</h2>
<div class="grid" id="addGrid"></div>

<h2>➖ Subtraction (50)</h2>
<div class="grid" id="subGrid"></div>

<script>
var emojis = ['🍎','🍌','🍇','🍊','🍓','⭐','🌸','🌻','🌹','🦋','🐶','🐱','🐰','🐟','🎈','⚽','🚗','🧸'];

function getEmoji() {
    return emojis[Math.floor(Math.random() * emojis.length)];
}

function repeat(emoji, n) {
    var res = "";
    for (var i = 0; i < n; i++) { res += emoji; }
    return res;
}

// ADDITION
var addHTML = "";
var usedAdd = [];
for (var i = 1; i <= 5; i++) {
    for (var j = 1; j <= 5; j++) {
        if (usedAdd.length >= 50) break;
        var e1 = getEmoji();
        var e2 = getEmoji();
        var ans = i + j;
        addHTML += '<div class="card">';
        addHTML += '<div class="visual">' + repeat(e1, i) + ' + ' + repeat(e2, j) + '</div>';
        addHTML += '<div class="eq">' + i + ' + ' + j + ' = <input type="number" oninput="check(this, ' + ans + ')"></div>';
        addHTML += '</div>';
        usedAdd.push(1);
    }
}
document.getElementById('addGrid').innerHTML = addHTML;

// SUBTRACTION
var subHTML = "";
var usedSub = [];
for (var x = 3; x <= 8; x++) {
    for (var y = 1; y < x; y++) {
        if (usedSub.length >= 50) break;
        var e3 = getEmoji();
        var e4 = getEmoji();
        var ans2 = x - y;
        subHTML += '<div class="card">';
        subHTML += '<div class="visual">' + repeat(e3, x) + ' <br> minus ' + y + ' items</div>';
        subHTML += '<div class="eq">' + x + ' - ' + y + ' = <input type="number" oninput="check(this, ' + ans2 + ')"></div>';
        subHTML += '</div>';
        usedSub.push(1);
    }
}
document.getElementById('subGrid').innerHTML = subHTML;

function check(input, correctAns) {
    var userVal = parseInt(input.value);
    if (userVal === correctAns) {
        input.classList.add('correct');
        input.disabled = true;
    } else {
        input.classList.remove('correct');
    }
}
</script>
</body>
</html>
