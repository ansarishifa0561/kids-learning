<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
  min-height:100vh;color:#2b2b3a;
  background:linear-gradient(135deg,#ffe9f3,#e6f4ff 35%,#fff8e1 65%,#e9fff0);
  background-attachment:fixed;
}
/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);border-bottom:2px solid #fff;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
header h1{font-size:1.05rem;font-weight:800;line-height:1.1}
header .sub{font-size:.7rem;opacity:.6;font-weight:600}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:1.25rem;
  display:grid;place-items:center;transition:.2s;flex:0 0 auto;
}
.icon-btn:hover{transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.spacer{flex:1}
.stars{background:#fff5cc;border-radius:14px;padding:8px 14px;font-weight:800;
  box-shadow:0 4px 12px rgba(0,0,0,.08);white-space:nowrap;font-size:.9rem}
/* ---------- LAYOUT ---------- */
main{padding:18px 16px 70px;max-width:1100px;margin:0 auto}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5.5vw,2.6rem);font-weight:800;
  background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.7;font-weight:600;font-size:.98rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
/* ---------- CARDS ---------- */
.card,.item{
  border:none;cursor:pointer;font-family:inherit;background:#fff;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 8px 22px rgba(80,80,140,.12);
  transition:transform .15s, box-shadow .15s;
  position:relative;overflow:hidden;text-align:center;
}
.card{border-radius:26px;padding:22px 14px;gap:6px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:7px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 16px 34px rgba(80,80,140,.2)}
.card:active,.item:active{transform:scale(.96)}
.card .emo{font-size:2.4rem;line-height:1}
.card .ttl{font-weight:800;font-size:1.02rem}
.card .sub{font-size:.78rem;opacity:.65;font-weight:600}
.item{border-radius:22px;padding:16px 10px;gap:8px}
.item .visual{font-size:2.8rem;line-height:1}
.item .bignum{font-size:3.2rem;font-weight:800;color:#7c5cff;line-height:1}
.item .label{font-weight:800;font-size:.95rem}
.item .badge{position:absolute;top:8px;left:8px;background:#7c5cff;color:#fff;
  border-radius:10px;padding:1px 9px;font-size:.75rem;font-weight:800}
.swatch{width:62px;height:62px;border-radius:50%;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.12)}
/* ---------- INFO CARDS ---------- */
.grid.info-grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card.info{align-items:flex-start;text-align:left;padding:20px 18px 18px;gap:8px}
.card.info .emo{font-size:2rem}
.card.info .ttl{font-size:1.05rem}
.card.info .txt{font-size:.85rem;opacity:.75;font-weight:600;line-height:1.35}
.card.info .play{align-self:flex-start;background:#eef0ff;color:#5c4dff;font-weight:800;
  border-radius:12px;padding:4px 12px;font-size:.75rem;margin-top:4px}
/* ---------- LESSON VIEW ---------- */
.lesson{background:#fff;border-radius:28px;padding:24px 18px;
  box-shadow:0 10px 30px rgba(80,80,140,.14);max-width:780px;margin:0 auto}
.lesson h2{text-align:center;font-size:1.45rem;color:#7c5cff;margin-bottom:6px}
.lesson .chapter{text-align:center;font-size:.82rem;opacity:.6;font-weight:700;margin-bottom:18px}
.sec-title{font-size:1.1rem;font-weight:800;margin:20px 0 12px;color:#2b2b3a;
  display:flex;align-items:center;gap:8px}
.point{
  width:100%;border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;
  border-radius:16px;padding:13px 16px;font-size:.98rem;font-weight:700;
  text-align:left;transition:.2s;color:#2b2b3a;margin-bottom:9px;line-height:1.4;
  display:flex;gap:10px;align-items:flex-start;
}
.point:hover{background:#e9e5ff;transform:translateX(4px)}
.point.active{background:#7c5cff;color:#fff}
.point .dot{flex:0 0 auto}
.qa-item{background:#f9f9ff;border-radius:16px;padding:12px 14px;margin-bottom:10px;
  border-left:5px solid #7c5cff}
.qa-q{font-weight:800;font-size:.96rem;margin-bottom:8px;line-height:1.35;cursor:pointer}
.qa-q:hover{color:#7c5cff}
.qa-a{background:#e8fff0;border-radius:12px;padding:10px 13px;font-size:.92rem;
  font-weight:700;color:#1b7a45;display:none;line-height:1.4}
.qa-a.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.ans-btn{border:none;font-family:inherit;cursor:pointer;background:#eef0ff;color:#5c4dff;
  font-weight:800;border-radius:12px;padding:7px 15px;font-size:.82rem;transition:.2s}
.ans-btn:hover{background:#dfe3ff}
/* ---------- TABLE VIEW ---------- */
.table-view{background:#fff;border-radius:28px;padding:24px 18px;max-width:520px;margin:0 auto;
  box-shadow:0 10px 30px rgba(80,80,140,.14)}
.table-view h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:16px}
.trow{
  width:100%;border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;
  border-radius:14px;padding:13px 16px;font-size:1.15rem;font-weight:800;
  text-align:center;transition:.2s;color:#2b2b3a;margin-bottom:8px;letter-spacing:.5px;
}
.trow:hover{background:#e9e5ff;transform:scale(1.02)}
.trow.active{background:#7c5cff;color:#fff;transform:scale(1.03)}
/* ---------- POEM ---------- */
.poem{background:#fff;border-radius:28px;padding:24px 18px;
  box-shadow:0 10px 30px rgba(80,80,140,.14);max-width:720px;margin:0 auto}
.poem h2{text-align:center;font-size:1.45rem;margin-bottom:6px;color:#7c5cff}
.poem .author{text-align:center;font-size:.8rem;opacity:.6;font-weight:700;margin-bottom:16px}
.lines{display:flex;flex-direction:column;gap:9px}
.line{
  border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;
  border-radius:16px;padding:13px 16px;font-size:1.02rem;font-weight:700;
  text-align:left;transition:.2s;color:#2b2b3a;line-height:1.4;
}
.line:hover{background:#e9e5ff;transform:translateX(4px)}
.line.active{background:#7c5cff;color:#fff;transform:scale(1.02)}
.poem-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:16px;
  padding:12px 22px;font-weight:800;font-size:.98rem;background:#eef0ff;color:#5c4dff;transition:.2s}
.btn.primary{background:linear-gradient(90deg,#7c5cff,#ff5f9e);color:#fff;
  box-shadow:0 8px 20px rgba(124,92,255,.35)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
/* ---------- QUIZ ---------- */
.quiz{background:#fff;border-radius:28px;padding:24px 18px;
  box-shadow:0 10px 30px rgba(80,80,140,.14);max-width:640px;margin:0 auto;text-align:center}
.qmeta{font-weight:800;color:#9aa;font-size:.85rem;margin-bottom:10px}
.qtext{font-size:clamp(1.15rem,4vw,1.7rem);margin:8px 0 22px;color:#2b2b3a;line-height:1.35}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{border:none;font-family:inherit;cursor:pointer;border-radius:18px;padding:18px 12px;
  font-size:1.15rem;font-weight:800;background:#f4f6ff;color:#3b3b5c;transition:.2s;
  box-shadow:0 4px 12px rgba(80,80,140,.1)}
.opt:hover:not(:disabled){transform:translateY(-3px);background:#e8ecff}
.opt.right{background:#34C759;color:#fff}
.opt.wrong{background:#FF3B30;color:#fff}
.result{background:#fff;border-radius:28px;padding:36px 20px;text-align:center;
  box-shadow:0 10px 30px rgba(80,80,140,.14);max-width:520px;margin:0 auto}
.result h2{margin:14px 0 20px;color:#7c5cff}
@media(max-width:480px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
  .item .visual{font-size:2.2rem}
  .card .emo{font-size:1.9rem}
  header h1{font-size:.9rem}
  main{padding:14px 12px 60px}
}

/* =========================================================
   1. SPEECH ENGINE
   ========================================================= */
let voices = [];
let soundOn = true;

function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(lang){
  const base = lang.split('-')[0];
  return voices.find(v => v.lang.replace('_','-') === lang)
      || voices.find(v => v.lang.replace('_','-').startsWith(base))
      || null;
}

function speak(text, lang='en-IN', rate=0.85){
  if(!soundOn || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = lang; u.rate = rate; u.pitch = 1.05; u.volume = 1;
  const v = pickVoice(lang);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

function speakSequence(lines, lang='en-IN', onLine){
  if(!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i = 0;
  const go = () => {
    if(i >= lines.length){ if(onLine) onLine(-1); return; }
    if(onLine) onLine(i);
    const u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = lang; u.rate = 0.8; u.pitch = 1.1;
    const v = pickVoice(lang); if(v) u.voice = v;
    u.onend = () => { i++; setTimeout(go, 320); };
    speechSynthesis.speak(u);
  };
  go();
}

function toggleSound(){
  soundOn = !soundOn;
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('muteBtn').textContent = soundOn ? '🔊' : '🔇';
}

/* =========================================================
   12. ROUTER
   ========================================================= */
const screen   = document.getElementById('screen');
const hTitle   = document.getElementById('hTitle');
const hSub     = document.getElementById('hSub');
const backBtn  = document.getElementById('backBtn');

let state = { level:null, cat:null, view:'home' };
let currentItems = [];
let currentPoem  = null;
let currentLesson= null;
let currentTable = null;
let quizState    = null;

function setHeader(title, sub){
  hTitle.textContent = title;
  hSub.textContent   = sub;
  backBtn.style.visibility = state.view === 'home' ? 'hidden' : 'visible';
}

function goHome(){ state = {level:null,cat:null,view:'home'}; renderHome(); }
function goLevel(k){ state = {level:k,cat:null,view:'level'}; renderLevel(); }
function goCat(c){ state.cat = c; state.view = 'cat'; renderCategory(); }

function goBack(){
  if(state.view === 'cat' || state.view === 'lesson' || state.view === 'poem' ||
     state.view === 'table' || state.view === 'quiz'){
    state.view = 'level'; renderLevel();
  } else if(state.view === 'level'){
    state = {level:null,cat:null,view:'home'}; renderHome();
  }
  if(window.speechSynthesis) speechSynthesis.cancel();
}

/* ---------- HOME ---------- */
function renderHome(){
  setHeader('Kids Learning Hub','CBSE Pattern • Choose your class');
  screen.innerHTML = `
    <div class="hero">
      <h1>🎈 Welcome to Learning Land!</h1>
      <p>Apna age group chuno aur seekhna shuru karo ✨</p>
    </div>
    <div class="grid levels">
      ${Object.entries(LEVELS).map(([k,l]) => `
        <button class="card" style="--c:${l.color}" onclick="goLevel('${k}')">
          <span class="emo">${l.emoji}</span>
          <span class="ttl">${l.name}</span>
          <span class="sub">${l.sub}</span>
        </button>`).join('')}
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- LEVEL ---------- */
function renderLevel(){
  const lvl = LEVELS[state.level];
  setHeader(lvl.name, lvl.sub);
  screen.innerHTML = `
    <div class="hero" style="padding:10px 10px 22px">
      <h1 style="font-size:1.55rem">${lvl.emoji} ${lvl.name}</h1>
      <p>Neeche tap karo aur seekho 👇</p>
    </div>
    <div class="grid">
      ${lvl.cats.map(id => {
        const c = CATS[id];
        return `<button class="card" style="--c:${c.c}" onclick="goCat('${id}')">
          <span class="emo">${c.e}</span>
          <span class="ttl">${c.n}</span>
        </button>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- CATEGORY ---------- */
function renderCategory(){
  const cid = state.cat;
  const cat = CATS[cid];
  const data = CONTENT[cid];
  currentItems = data.items || [];
  setHeader(cat.n, LEVELS[state.level].name);

  if(data.type === 'cards' || data.type === 'info'){
    screen.innerHTML = `<div class="grid ${data.type === 'info' ? 'info-grid' : ''}">` +
      currentItems.map((it,i) => cardHTML(it,i,data.type)).join('') + `</div>`;

  } else if(data.type === 'poemlist'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openPoem(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">Tap to listen 🎧</span>
        </button>`).join('') + `</div>`;

  } else if(data.type === 'lesson'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openLesson(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">${it.chapter}</span>
        </button>`).join('') + `</div>`;

  } else if(data.type === 'tablelist'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((t,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openTable(${i})">
          <span class="emo">✖️</span>
          <span class="ttl">Table of ${t.n}</span>
          <span class="sub">Tap to open</span>
        </button>`).join('') + `</div>`;

  } else if(data.type === 'quiz'){
    screen.innerHTML = `<div id="quizBox"></div>`;
    quizState = { idx:0, score:0 };
    drawQuiz();
  }
  window.scrollTo(0,0);
}

function cardHTML(it, i, type){
  if(type === 'info'){
    return `<button class="card info" style="--c:#7c5cff" onclick="tap(${i})">
      <span class="emo">${it.emoji}</span>
      <span class="ttl">${it.main}</span>
      <span class="txt">${it.text}</span>
      <span class="play">🔊 Suno</span>
    </button>`;
  }
  const visual = it.color
    ? `<span class="swatch" style="background:${it.color}"></span>`
    : it.emoji
      ? `<span class="visual">${it.emoji}</span>`
      : `<span class="bignum">${it.main}</span>`;

  return `<button class="item" onclick="tap(${i})">
    ${it.badge ? `<span class="badge">${it.badge}</span>` : ''}
    ${visual}
    <span class="label">${it.sub || it.main}</span>
  </button>`;
}

function tap(i){
  const it = currentItems[i];
  if(!it) return;
  const lang = CATS[state.cat].lang || 'en-IN';
  speak(it.say || it.main || it.text, lang);
  addStar();
}

/* ---------- TABLE VIEW ---------- */
function openTable(i){
  currentTable = currentItems[i];
  state.view = 'table';
  setHeader(`Table of ${currentTable.n}`, 'Tap a line to hear it');
  screen.innerHTML = `
    <div class="table-view">
      <h2>✖️ Table of ${currentTable.n}</h2>
      <div class="rows">
        ${currentTable.rows.map((r,j) =>
          `<button class="trow" onclick="speakRow(${j})">${r}</button>`).join('')}
      </div>
      <div class="poem-actions">
        <button class="btn primary" onclick="playTable()">▶️ Poora Table Suno</button>
        <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function speakRow(j){
  speak(currentTable.spoken[j]);
  document.querySelectorAll('.trow').forEach((e,k) =>
    e.classList.toggle('active', k === j));
  addStar();
}

function playTable(){
  speakSequence(currentTable.spoken, 'en-IN', idx => {
    document.querySelectorAll('.trow').forEach((e,k) =>
      e.classList.toggle('active', k === idx));
  });
  addStar();
}

/* ---------- LESSON VIEW ---------- */
function openLesson(i){
  currentLesson = currentItems[i];
  state.view = 'lesson';
  setHeader(currentLesson.title, currentLesson.chapter);
  renderLessonBody();
}

function renderLessonBody(){
  const L = currentLesson;
  screen.innerHTML = `
    <div class="lesson">
      <h2>${L.emoji} ${L.title}</h2>
      <div class="chapter">${L.chapter}</div>

      <div class="sec-title">📖 Padhai</div>
      ${L.points.map((p,j) =>
        `<button class="point" id="pt-${j}" onclick="speakPoint(${j})">
          <span class="dot">🔹</span><span>${p}</span>
        </button>`).join('')}

      <div class="sec-title">❓ Prashn Uttar</div>
      ${L.qa.map((q,j) => `
        <div class="qa-item">
          <div class="qa-q" onclick="speakQ(${j})">Q${j+1}. ${q.q} 🔊</div>
          <button class="ans-btn" onclick="revealAns(${j})">👉 Uttar Dekho</button>
          <div class="qa-a" id="ans-${j}">${q.a}</div>
        </div>`).join('')}

      <div class="poem-actions">
        <button class="btn primary" onclick="playLesson()">▶️ Poora Chapter Suno</button>
        <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function speakPoint(j){
  const L = currentLesson;
  speak(L.points[j]);
  document.querySelectorAll('.point').forEach((e,k) =>
    e.classList.toggle('active', k === j));
  addStar();
}

function speakQ(j){
  speak(currentLesson.qa[j].q);
  addStar();
}

function revealAns(j){
  const el = document.getElementById('ans-' + j);
  if(!el) return;
  el.classList.toggle('show');
  if(el.classList.contains('show')) speak(currentLesson.qa[j].a);
  addStar();
}

function playLesson(){
  const L = currentLesson;
  const seq = [];
  L.points.forEach(p => seq.push(p));
  L.qa.forEach((qa,k) => {
    seq.push('Question ' + (k+1) + '. ' + qa.q);
    seq.push('Answer. ' + qa.a);
  });
  speakSequence(seq, 'en-IN', idx => {
    const total = L.points.length;
    document.querySelectorAll('.point').forEach((e,k) => {
      e.classList.toggle('active', k === idx);
    });
  });
  addStar();
}

/* ---------- POEM VIEW ---------- */
function openPoem(i){
  currentPoem = currentItems[i];
  state.view = 'poem';
  setHeader(currentPoem.title, 'Rhyme Time 🎵');
  screen.innerHTML = `
    <div class="poem">
      <h2>${currentPoem.emoji} ${currentPoem.title}</h2>
      <div class="author">— ${currentPoem.author}</div>
      <div class="lines">
        ${currentPoem.lines.map((l,j) =>
          `<button class="line" onclick="speakLine(${j})">${l}</button>`).join('')}
      </div>
      <div class="poem-actions">
        <button class="btn primary" onclick="playPoem()">▶️ Poori Poem Suno</button>
        <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function speakLine(j){
  speak(currentPoem.lines[j], currentPoem.lang || 'en-IN');
  document.querySelectorAll('.line').forEach((e,k) =>
    e.classList.toggle('active', k === j));
  addStar();
}

function playPoem(){
  speakSequence(currentPoem.lines, currentPoem.lang || 'en-IN', idx => {
    document.querySelectorAll('.line').forEach((e,k) =>
      e.classList.toggle('active', k === idx));
  });
  addStar();
}

/* ---------- QUIZ ---------- */
function drawQuiz(){
  const data = CONTENT[state.cat];
  const box  = document.getElementById('quizBox');
  if(!box) return;

  if(quizState.idx >= data.questions.length){
    const perfect = quizState.score === data.questions.length;
    box.innerHTML = `<div class="result">
      <div style="font-size:4rem">${perfect ? '🏆' : '🌟'}</div>
      <h2>Score: ${quizState.score} / ${data.questions.length}</h2>
      <button class="btn primary" onclick="restartQuiz()">🔄 Phir Se Khelo</button>
      <button class="btn" style="margin-left:10px" onclick="renderCategory()">↩️ Wapas</button>
    </div>`;
    speak(perfect
      ? 'Perfect score! Shabaash!'
      : `You scored ${quizState.score} out of ${data.questions.length}. Well done!`);
    return;
  }

  const q = data.questions[quizState.idx];
  box.innerHTML = `
    <div class="quiz">
      <div class="qmeta">Question ${quizState.idx+1} / ${data.questions.length} &nbsp;•&nbsp; ⭐ ${quizState.score}</div>
      <h2 class="qtext">${q.q}</h2>
      <div class="options">
        ${q.options.map(o => `<button class="opt" onclick="answer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
    </div>`;
  speak(q.q);
}

function answer(opt){
  const data = CONTENT[state.cat];
  const q = data.questions[quizState.idx];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.disabled = true);

  if(opt === q.answer){
    quizState.score++;
    opts.forEach(o => { if(o.textContent.trim() === opt) o.classList.add('right'); });
    speak('Correct! Well done.');
    addStar();
  } else {
    opts.forEach(o => {
      if(o.textContent.trim() === opt) o.classList.add('wrong');
      if(o.textContent.trim() === q.answer) o.classList.add('right');
    });
    speak(`Oops! The correct answer is ${q.answer}`);
  }

  setTimeout(() => { quizState.idx++; drawQuiz(); }, 1700);
}

function restartQuiz(){
  quizState = { idx:0, score:0 };
  drawQuiz();
}

/* =========================================================
   13. START
   ========================================================= */
renderHome();

/* Unlock speech on first user interaction (mobile browsers) */
document.body.addEventListener('touchstart', function unlock(){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }
  document.body.removeEventListener('touchstart', unlock);
}, {once:true});
</script>
