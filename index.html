/* ===== PREMIUM UI WITH BORDERS & GRADIENT ===== */
:root{
  --purple:#6c5ce7; --pink:#fd79a8; --blue:#74b9ff; --mint:#55efc4; --yellow:#ffeaa7; 
  --ink:#282747; --muted:#72728d; --paper:#ffffff; 
  --line:#e8e5ff; 
  --shadow:0 12px 32px rgba(75, 63, 153, 0.08);
  --shadow-hover:0 18px 40px rgba(75, 63, 153, 0.15);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink);
  background: linear-gradient(135deg, #f5f3ff, #e0f7ff, #fff0f5); background-attachment:fixed;

}
.app{
  max-width:1300px; margin:24px auto; padding:0;
  background:rgba(255,255,255,0.95); backdrop-filter:blur(10px);
  border:4px solid #dcd7ff; border-radius:36px;
  box-shadow:0 25px 60px rgba(108,92,231,0.2);
  position:relative; overflow:hidden;
}
.app::before, .app::after {
  content:''; position:absolute; top:0; bottom:0; width:10px;
  background:linear-gradient(to bottom, var(--purple), var(--pink));
}
.app::before { left:0; }
.app::after { right:0; }

.topbar{
  position:sticky; top:0; z-index:20; background:#ffffffee; backdrop-filter:blur(12px);
  border-bottom:2px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px;
}
.logo{
  width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--purple),var(--pink)); font-size:24px;
  box-shadow:0 8px 20px rgba(108,92,231,0.3); position:relative; flex-shrink:0;
}
.logo span{position:absolute;}
.logo .book{font-size:22px; bottom:8px; left:8px;}
.logo .kids{font-size:24px; top:6px; right:6px; z-index:2;}
.logo .pencil{font-size:16px; bottom:6px; right:6px; z-index:3;}
.brand h1{font-size:1.3rem; margin:0; font-weight:800; color:var(--purple);}
.brand small{color:var(--muted); font-weight:700; font-size:0.85rem;}
.grow{flex:1}
.pill{border:2px solid var(--line); background:#f7f5ff; border-radius:14px; padding:8px 16px; font-weight:800; color:var(--purple); cursor:pointer; transition:0.2s; font-size:1rem;}

.star-pill{background:#fff7d6; color:#875b00; border-color:#ffe6a0; cursor:default;}

.main{padding:30px 24px 60px; min-height: 70vh;}

}
.solver-wrapper h2 {color:var(--purple); margin-top:0; font-size:1.6rem;}
.solver-inputs {display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:20px 0;}

  padding:14px 18px; border:2px solid #dcd7ff; border-radius:14px; font-size:1.1rem; font-family:inherit;

.solver-inputs input:focus {border-color:var(--purple); box-shadow:0 0 0 4px rgba(108,92,231,0.1);}
.solve-btn {

  box-shadow:0 8px 20px rgba(108,92,231,0.3); transition:0.2s;
}
.solve-btn:hover {transform:translateY(-3px);}
.solver-result {

/* =========================================
   CUSTOM MATH SOLVER
   ========================================= */
function parseEq(equation) {
    equation = equation.replace(/\s+/g, '').toLowerCase();
    let parts = equation.split('=');
    if(parts.length !== 2) throw new Error("Equation mein ek '=' hona chahiye");
    let left = parts[0] || "0"; let right = parts[1] || "0";
    if(left[0] !== '+' && left[0] !== '-') left = '+' + left;
    if(right[0] !== '+' && right[0] !== '-') right = '+' + right;
    
    let parseSide = (str) => {
        let A = 0, B = 0, C = 0;
        let xTerms = str.match(/[+-]\d*\.?\d*x/g) || [];
        let yTerms = str.match(/[+-]\d*\.?\d*y/g) || [];
        xTerms.forEach(t => { let num = t.replace('x',''); A += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        yTerms.forEach(t => { let num = t.replace('y',''); B += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        let noXY = str.replace(/[+-]\d*\.?\d*x/g, '').replace(/[+-]\d*\.?\d*y/g, '');
        if(noXY && noXY[0] !== '+' && noXY[0] !== '-') noXY = '+' + noXY;
        (noXY.match(/[+-]\d*\.?\d+/g) || []).forEach(t => C += parseFloat(t));
        return {A, B, C};
    };
    let L = parseSide(left), R = parseSide(right);
    return { A: L.A - R.A, B: L.B - R.B, C: R.C - L.C };
}

    if(!input1) { alert('Kripya equation likhein (jaise 4x + 3 = 15)'); return; }
    
    try {
        if(input2 !== "") {
            let eq1 = parseEq(input1), eq2 = parseEq(input2);
            let A1 = eq1.A, B1 = eq1.B, C1 = eq1.C, A2 = eq2.A, B2 = eq2.B, C2 = eq2.C;
            let det = A1 * B2 - A2 * B1;
            if (det === 0) throw new Error("No Solution ya Infinite Solutions.");
            
            let l = Math.abs(A1 * A2) / (function gcd(a,b){return b?gcd(b,a%b):a})(Math.abs(A1), Math.abs(A2));
            let m1 = l / Math.abs(A1), m2 = l / Math.abs(A2);
            let sub = (A1*m1 * A2*m2 > 0);
            let finalB = sub ? (B1*m1 - B2*m2) : (B1*m1 + B2*m2);
            let finalC = sub ? (C1*m1 - C2*m2) : (C1*m1 + C2*m2);
            
            let y = finalC / finalB;
            let x = (C1 - B1 * y) / A1;
            
            resultDiv.innerHTML = `
                <b>Eq 1:</b> ${input1} &nbsp; | &nbsp; <b>Eq 2:</b> ${input2}<br><br>
                <b>Step 1:</b> x ko eliminate karne ke liye dono equations ko equal karo.<br>
                <b>Step 2:</b> Subtract/Add karo → ${finalB}y = ${finalC} → y = ${y}<br>
                <b>Step 3:</b> y = ${y} ko Eq 1 mein rakho → x = ${x}<br><br>
                <b class="final-ans">✅ Final Answer:</b> x = ${x}, y = ${y}`;
        } else {
            let letters = input1.match(/[a-zA-Z]/g) || [];
            if(letters.length === 0) throw new Error("Kripya variable (jaise x, y) use karein.");
            let v = letters[0].toLowerCase();
            let eq = input1.replace(/\s+/g, '').split('=');
            let left = eq[0], right = eq[1] || '0';
            
            let l_x = left.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let l_coeff = 0; l_x.forEach(m => { let n = m.replace(v, ''); l_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let l_const = 0; (left.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => l_const += parseFloat(m));
            
            let r_x = right.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let r_coeff = 0; r_x.forEach(m => { let n = m.replace(v, ''); r_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let r_const = 0; (right.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => r_const += parseFloat(m));
            
            let finalA = l_coeff - r_coeff; let finalB = r_const - l_const;
            if(finalA === 0) throw new Error("Variable cancel ho gaya.");
            let ans = Math.round((finalB / finalA) * 10000) / 10000;
            
            let steps = `<b>Equation:</b> ${input1}<br><br>`;
            if(r_coeff !== 0) steps += `<b>Step 1:</b> Dono taraf se ${r_coeff}${v} subtract karo.<br>`;
            if(l_const !== 0) steps += `<b>Step 2:</b> Dono taraf se ${l_const} ${l_const>0?'subtract':'add'} karo.<br>`;
            steps += `<b>Step 3:</b> ${finalA}${v} = ${finalB}<br><b>Step 4:</b> ${v} = ${finalB} ÷ ${finalA}<br><br><b class="final-ans">✅ Final Answer:</b> ${v} = ${ans}`;
            resultDiv.innerHTML = steps;
        }
    } catch(e) {
        resultDiv.innerHTML = `<div style="color:#cc0000; font-weight:bold;">⚠️ Error: ${e.message}</div>`;
    }
    resultDiv.style.display = 'block';
}

function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
}


/* =========================================
   TEACHER-LIKE CONTENT GENERATOR
   ========================================= */
function getLessonContent(cid, sid, t) {
  let title = t[2], key = t[4], intro = '', examples = [], qs = [];
  
  if (key === 'letters') {
    intro = "A, B, C, D... English mein 26 letters hote hain. Har letter ka ek sound hota hai. Chalo inhe padhte hain.";
    examples = [['A','🍎','Apple'],['B','⚽','Ball'],['C','🐱','Cat'],['D','🐶','Dog']].map(x=>({pic:x[1],name:x[0]+' for '+x[2],sub:''}));
    qs = [{q:'Which letter comes after A?',opts:['B','C','D'],a:0},{q:'A is for?',opts:['Ball','Apple','Cat'],a:1}];
  } else if (key === 'addition') {
    intro = "Addition ka matlab hai jodna. Jab hum do numbers ko milate hain, to unka 'sum' nikalta hai. + ka matlab plus.";
    examples = [['➕','2 + 3 = 5','2 balls + 3 balls = 5'],['➕','4 + 1 = 5','4 apples + 1 apple = 5']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'3 + 4 = ?',opts:['6','7','8'],a:1},{q:'5 + 5 = ?',opts:['10','12','8'],a:0}];
  } else if (key === 'mensuration') {
    intro = "Mensuration matlab shapes ka Area (andar ki jagah), Perimeter (chaaron taraf ki lambai) aur Volume nikalna.";
    examples = [['▭','Rectangle Area','L × B'],['⬜','Square Area','Side × Side'],['📦','Cube Volume','Side³']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'Area of rectangle 5x4?',opts:['10','20','25'],a:1},{q:'Perimeter of square side 4?',opts:['16','8','12'],a:0}];
  } else if (key === 'linear_eq') {
    intro = "Linear Equation mein variable (jaise x) ki power 1 hoti hai. Hum x ki value nikalte hain. Jaise 2x + 3 = 7.";
    examples = [['⚖️','2x + 3 = 7','2x = 4 → x = 2'],['⚖️','3y - 2 = 10','3y = 12 → y = 4']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'Solve: x + 5 = 12',opts:['5','7','10'],a:1},{q:'Solve: 2x = 10',opts:['4','5','6'],a:1}];
  } else if (key === 'nouns') {
    intro = "Noun matlab naam. Kisi bhi person, place, animal ya thing ke naam ko Noun kehte hain. Jaise: Riya, School, Dog, Book.";
    examples = [['👧','Person','Riya, Teacher'],['🏫','Place','School, Delhi'],['🐶','Animal','Dog, Cat'],['📚','Thing','Book, Pen']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'Which is a Noun?',opts:['Run','Book','Quickly'],a:1},{q:'Find the noun: The dog is barking.',opts:['dog','barking','the'],a:0}];
  } else if (key === 'science_generic') {
    intro = "Science mein hum duniya ko samajhte hain. Force, Light, Sound, Plants, aur Body sab science ka hissa hain.";
    examples = [['🧲','Force','Push or Pull'],['💡','Light','Helps us see'],['🌱','Plants','Make their own food']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'What do plants need to make food?',opts:['Sunlight','Darkness','Plastic'],a:0},{q:'A push or pull is called?',opts:['Energy','Force','Sound'],a:1}];
  } else if (key === 'rhymes') {
    intro = "Rhymes sunne aur gaane mein maza aata hai. Ye bachcho ki memory aur bolne ki shamta badhate hain.";
    examples = [['⭐','Twinkle Twinkle','Twinkle twinkle little star...'],['🌧️','Rain Rain','Rain rain go away...']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'What shines in the sky at night?',opts:['Sun','Star','Cloud'],a:1}];
  } else {
    intro = `Is chapter mein hum ${title} ke baare mein detail mein padhenge. Dhyan se padhein aur examples dekhein.`;
    examples = [['📖','Read','Understand the theory'],['✍️','Practice','Solve the questions'],['✅','Check','Verify your answers']].map(x=>({pic:x[0],name:x[1],sub:x[2]}));
    qs = [{q:'What is the best way to learn?',opts:['Read and practice','Ignore the chapter','Only guess'],a:0}];
  }
  return { title, intro, examples, qs };
}


/* =========================================
   ROUTING & RENDER
   ========================================= */
function currentClass(){ return classes.find(c => c.id === state.classId); }

function updateStars(){
    $('#stars').textContent = saved.stars || 0;
    localStorage.setItem(STORE, JSON.stringify(saved));
}

function showBackBtn(show){
    $('#backBtn').style.display = show ? 'block' : 'none';
}

function renderHome() {
    state = { view: 'home', classId: null, subjectId: null, topicId: null };
    showBackBtn(false);
    $('#screen').innerHTML = `
    <section class="hero">
        <h2>Welcome to Shifa's Learning Land! 🎈</h2>
        <p>Explore CBSE chapters, solve custom math equations, and learn like a pro.</p>
    </section>

    <div class="solver-wrapper">
        <h2>🧠 Apna Math Question Khud Solve Karo!</h2>
        <p style="color:var(--muted); font-weight:700;">Sirf 1 ya 2 variables (x, y) wali linear equation daalein.</p>
        <div class="solver-inputs">
            <input type="text" id="customEqInput" placeholder="1st Eq (e.g. 4x + 3 = 15)" />
            <input type="text" id="customEqInput2" placeholder="2nd Eq (Optional, e.g. x - y = 2)" />
            <button class="solve-btn" onclick="solveCustomEquation()">Solve ▶</button>
        </div>
        <div id="customEqResult" class="solver-result"></div>
    </div>

    <div class="section-head"><div><h2>Choose your class 🎒</h2></div></div>
    <div class="grid">
        ${classes.map(c => `
            <div class="level-card" style="--accent:${c.color}" onclick="openClass('${c.id}')">
                <span class="level-emoji">${c.emoji}</span>
                <h3>${c.name}</h3>
                <p>${c.age}</p>
            </div>
        `).join('')}
    </div>`;
}

function openClass(id) {
    state = { view: 'class', classId: id, subjectId: null, topicId: null };
    showBackBtn(true);
    const c = currentClass();
    $('#screen').innerHTML = `
    <div class="crumb"><button onclick="renderHome()">Home</button> / ${c.name}</div>
    <div class="section-head"><div><h2>${c.emoji} ${c.name} Subjects</h2></div></div>
    <div class="grid">
        ${c.subjects.map(sid => {
            const s = subjects[sid];
            return `
            <div class="subject-card" onclick="openSubject('${sid}')">
                <span class="subject-icon">${s[0]}</span>
                <div><h3>${s[1]}</h3><p>${s[2]}</p></div>
            </div>`;
        }).join('')}
    </div>`;
}

function openSubject(sid) {
    state = { view: 'subject', classId: state.classId, subjectId: sid, topicId: null };
    showBackBtn(true);
    const c = currentClass();
    
    // Custom Grammar View
    if (sid === 'grammar') {
        const verbs = getVerbs(c.id);
        $('#screen').innerHTML = `
        <div class="crumb"><button onclick="renderHome()">Home</button> / <button onclick="openClass('${c.id}')">${c.name}</button> / Grammar & Verbs</div>
        <div class="section-head">
            <div><h2>📝 Grammar & Verbs (${c.name})</h2><p>Verb ki 1st form, 3rd form, Hindi meaning aur sentence seekhein.</p></div>
        </div>
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">
            ${verbs.map(v => `
                <div class="verb-card">
                    <div class="verb-header">
                        <div>
                            <div class="verb-title">${v.v1}</div>
                            <div class="verb-hindi">${v.hindi}</div>
                        </div>
                        <button class="speak-btn" onclick="speak('${v.v1}. ${v.sentence}')">🔊</button>
                    </div>
                    <div class="verb-forms">
                        <span><strong>1st:</strong> ${v.v1}</span>
                        <span><strong>3rd:</strong> ${v.v3}</span>
                    </div>
                    <div class="verb-sentence">
                        <strong>Sentence:</strong> ${v.sentence}
                    </div>
                </div>
            `).join('')}
        </div>`;
        return;
    }

    // Regular Subject View
    const s = subjects[sid];
    const topics = getTopics(c.id, sid);
    
    $('#screen').innerHTML = `
    <div class="crumb"><button onclick="renderHome()">Home</button> / <button onclick="openClass('${c.id}')">${c.name}</button> / ${s[1]}</div>
    <div class="section-head"><div><h2>${s[0]} ${s[1]}</h2><p>${s[2]}</p></div></div>
    <div class="grid">
        ${topics.map(t => `
            <div class="topic-card" onclick="openTopic('${t[0]}')">
                <h3>${t[1]} ${t[2]}</h3>
                <p>${t[3]}</p>
                <span class="tag">Learn & Practise</span>
            </div>
        `).join('')}
    </div>`;
}

function openTopic(tid) {
    state = { view: 'lesson', classId: state.classId, subjectId: state.subjectId, topicId: tid };
    showBackBtn(true);
    const c = currentClass();
    const s = subjects[state.subjectId];
    const t = getTopics(c.id, state.subjectId).find(x => x[0] === tid);
    const d = getLessonContent(c.id, state.subjectId, t);
    
    $('#screen').innerHTML = `
    <div class="crumb"><button onclick="renderHome()">Home</button> / <button onclick="openClass('${c.id}')">${c.name}</button> / <button onclick="openSubject('${state.subjectId}')">${s[1]}</button> / Lesson</div>
    <article class="panel">
        <div class="lesson-title">
            <div class="big-emoji">${t[1]}</div>
            <h2>${d.title}</h2>
            <p>${c.name} · ${s[1]}</p>
        </div>
        <div class="lesson-body">
            <div class="callout">
                <strong>📖 Learn this:</strong><br>
                ${d.intro}
            </div>
            
            <div class="section-head"><div><h3>🌟 Examples</h3></div></div>
            <div class="example-grid">
                ${d.examples.map(e => `
                    <div class="example">
                        <span class="pic">${e.pic}</span>
                        <strong>${e.name}</strong>
                        <small>${e.sub}</small>
                    </div>
                `).join('')}
            </div>

            <div class="practice">
                <h3>🎯 Quick Practice</h3>
                ${d.qs.map((q, i) => `
                    <div class="question">
                        <p>${i+1}. ${q.q}</p>
                        <div class="options">
                            ${q.opts.map((o, j) => `
                                <button class="option" onclick="checkAnswer(this, ${j === q.a})">${o}</button>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
            
            <div class="actions">
                <button class="btn" onclick="openSubject('${state.subjectId}')">← All lessons</button>
            </div>
        </div>
    </article>`;
}

function checkAnswer(btn, isCorrect) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.option').forEach(b => {
        b.classList.remove('selected', 'correct', 'wrong');
        b.disabled = true;
    });
    if (isCorrect) {
        btn.classList.add('correct');
        saved.stars = (saved.stars || 0) + 1;
        updateStars();
    } else {
        btn.classList.add('wrong');
    }
}

function goBack() {
    if (state.view === 'lesson') openSubject(state.subjectId);
    else if (state.view === 'subject') openClass(state.classId);
    else if (state.view === 'class') renderHome();
    else renderHome();
}

updateStars();
renderHome();
</script>
