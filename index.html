<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Learning Hub 🎈 CBSE Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   STYLES — YAHAN CSS HAI
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
  min-height:100vh;color:#2b2b3a;
  background:linear-gradient(135deg,#ffe9f3,#e6f4ff 35%,#fff8e1 65%,#e9fff0);
  background-attachment:fixed;
}
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);border-bottom:2px solid #fff;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
header h1{font-size:1.05rem;font-weight:800;line-height:1.1}
header .sub{font-size:.7rem;opacity:.6;font-weight:600}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:1.25rem;
  display:grid;place-items:center;transition:.2s;flex:0 0 auto;
}
.icon-btn:hover{transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.spacer{flex:1}
.stars{background:#fff5cc;border-radius:14px;padding:8px 14px;font-weight:800;
  box-shadow:0 4px 12px rgba(0,0,0,.08);white-space:nowrap;font-size:.9rem}
main{padding:18px 16px 70px;max-width:1200px;margin:0 auto}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5.5vw,2.6rem);font-weight:800;
  background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.7;font-weight:600;font-size:.98rem}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.info-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card,.item{
  border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#ffffff,#f5f5ff);
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 10px 25px rgba(80,80,140,.15), 0 4px 8px rgba(80,80,140,.1);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  position:relative;overflow:hidden;text-align:center;border-radius:24px;
}
.card{padding:24px 14px;gap:8px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-8px) scale(1.04);
  box-shadow:0 20px 40px rgba(80,80,140,.25)}
.card:active,.item:active{transform:scale(.96)}
.card .emo{font-size:3rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.card .ttl{font-weight:800;font-size:1.05rem}
.card .sub{font-size:.8rem;opacity:.65;font-weight:600}
.item{padding:20px 12px;gap:10px;border-radius:26px}
.item .visual{font-size:5.5rem;line-height:1;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.2));
  transition:transform .3s}
.item:hover .visual{transform:scale(1.15) rotate(-3deg)}
.item .bignum{font-size:5rem;font-weight:800;line-height:1;color:#7c5cff;
  text-shadow:3px 3px 0 #fff, 5px 5px 10px rgba(124,92,255,.3)}
.item .label{font-weight:800;font-size:1rem;margin-top:4px}
.item .badge{position:absolute;top:10px;left:10px;
  background:linear-gradient(135deg,#7c5cff,#ff5f9e);
  color:#fff;border-radius:12px;padding:2px 12px;font-size:.85rem;font-weight:800}
.swatch{width:90px;height:90px;border-radius:50%;
  box-shadow:inset 0 -8px 15px rgba(0,0,0,.15), inset 0 8px 15px rgba(255,255,255,.4),
  0 8px 20px rgba(0,0,0,.2)}

/* Opposites */
.opp-card{grid-column:span 2;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(145deg,#ffffff,#f5f5ff);
  display:flex;align-items:center;justify-content:space-around;
  gap:8px;padding:22px 14px;border-radius:26px;
  box-shadow:0 10px 25px rgba(80,80,140,.15);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative}
.opp-card::before{content:'';position:absolute;inset:0 0 auto 0;height:7px;
  background:linear-gradient(90deg,#ff5f9e,#7c5cff);border-radius:26px 26px 0 0}
.opp-card:hover{transform:translateY(-6px) scale(1.02)}
.opp-side{display:flex;flex-direction:column;align-items:center;flex:1;gap:6px}
.opp-pic{line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.opp-label{font-weight:800;font-size:1rem}
.opp-arrow{font-size:2rem;color:#7c5cff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* Info Cards */
.card.info{align-items:flex-start;text-align:left;padding:20px 18px;gap:8px}
.card.info .emo{font-size:2.5rem}
.card.info .ttl{font-size:1.1rem}
.card.info .txt{font-size:.88rem;opacity:.78;font-weight:600;line-height:1.4}
.card.info .play{align-self:flex-start;background:#eef0ff;color:#5c4dff;
  font-weight:800;border-radius:12px;padding:4px 12px;font-size:.78rem;margin-top:4px}

/* Lesson */
.lesson{background:#fff;border-radius:28px;padding:24px 18px;
  box-shadow:0 15px 35px rgba(80,80,140,.15);max-width:800px;margin:0 auto}
.lesson h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:6px}
.lesson .chapter{text-align:center;font-size:.85rem;opacity:.6;font-weight:700;margin-bottom:18px}
.sec-title{font-size:1.15rem;font-weight:800;margin:20px 0 12px;color:#2b2b3a;
  display:flex;align-items:center;gap:8px}
.point{width:100%;border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;
  border-radius:18px;padding:14px 18px;font-size:1rem;font-weight:700;text-align:left;
  transition:.2s;color:#2b2b3a;margin-bottom:10px;line-height:1.4;
  display:flex;gap:10px;align-items:flex-start;box-shadow:0 3px 8px rgba(80,80,140,.08)}
.point:hover{background:#e9e5ff;transform:translateX(6px)}
.point.active{background:#7c5cff;color:#fff;transform:scale(1.02)}
.point .dot{flex:0 0 auto;font-size:1.2rem}
.qa-item{background:linear-gradient(135deg,#f9f9ff,#f0f0ff);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;border-left:6px solid #7c5cff}
.qa-q{font-weight:800;font-size:1rem;margin-bottom:10px;line-height:1.35;cursor:pointer}
.qa-q:hover{color:#7c5cff}
.qa-a{background:linear-gradient(135deg,#e8fff0,#d8ffe8);border-radius:12px;
  padding:11px 14px;font-size:.95rem;font-weight:700;color:#1b7a45;display:none;line-height:1.4}
.qa-a.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.ans-btn{border:none;font-family:inherit;cursor:pointer;background:#eef0ff;color:#5c4dff;
  font-weight:800;border-radius:12px;padding:8px 16px;font-size:.85rem;transition:.2s}
.ans-btn:hover{background:#dfe3ff}

/* Table */
.table-view{background:#fff;border-radius:28px;padding:24px 18px;max-width:540px;margin:0 auto;
  box-shadow:0 15px 35px rgba(80,80,140,.15)}
.table-view h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:16px}
.trow{width:100%;border:none;font-family:inherit;cursor:pointer;
  background:linear-gradient(145deg,#f6f4ff,#ece9ff);
  border-radius:16px;padding:14px 18px;font-size:1.2rem;font-weight:800;
  text-align:center;transition:.2s;color:#2b2b3a;margin-bottom:9px;letter-spacing:.5px;
  box-shadow:0 4px 10px rgba(80,80,140,.1)}
.trow:hover{background:linear-gradient(145deg,#e9e5ff,#dcd6ff);transform:scale(1.02)}
.trow.active{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff;transform:scale(1.03)}

/* Poem */
.poem{background:#fff;border-radius:28px;padding:0;overflow:hidden;
  box-shadow:0 20px 45px rgba(80,80,140,.25);max-width:750px;margin:0 auto}
.poem-hero{background:linear-gradient(135deg,#a8e6ff,#ffd6ec,#e0d4ff);
  padding:28px 20px;text-align:center;position:relative;overflow:hidden}
.poem-hero .hero-pic{font-size:5rem;line-height:1;position:relative;z-index:1;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.25));animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.poem-hero h2{position:relative;z-index:1;font-size:1.5rem;margin:10px 0 4px;color:#fff;
  text-shadow:2px 2px 0 rgba(124,92,255,.5), 0 4px 12px rgba(0,0,0,.3)}
.poem-hero .author{position:relative;z-index:1;font-size:.85rem;color:#fff;
  font-weight:700;opacity:.95;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.poem-body{padding:22px 18px}
.lines{display:flex;flex-direction:column;gap:12px}
.line{border:none;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#f6f4ff,#eef0ff);
  border-radius:20px;padding:16px 20px;font-size:1.1rem;font-weight:700;
  text-align:left;transition:.3s cubic-bezier(.34,1.56,.64,1);color:#2b2b3a;line-height:1.5;
  box-shadow:0 4px 12px rgba(80,80,140,.1);display:flex;gap:14px;align-items:center;
  border-left:5px solid transparent}
.line .pic{font-size:2.2rem;flex:0 0 auto;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.line:hover{background:linear-gradient(135deg,#e9e5ff,#dcd6ff);transform:translateX(8px)}
.line.active{background:linear-gradient(135deg,#7c5cff,#ff5f9e);
  color:#fff;transform:scale(1.04) translateX(6px);
  box-shadow:0 12px 28px rgba(124,92,255,.5),
             0 0 0 4px rgba(255,255,255,.8),
             0 0 30px rgba(124,92,255,.6);
  border-left:5px solid #fff}
.line.active .pic{transform:scale(1.3)}
.poem-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:16px;
  padding:13px 24px;font-weight:800;font-size:1rem;background:#eef0ff;color:#5c4dff;
  transition:.2s;box-shadow:0 5px 12px rgba(80,80,140,.12)}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;
  box-shadow:0 10px 22px rgba(124,92,255,.4)}
.btn:hover{transform:translateY(-3px)}

/* Quiz */
.quiz{background:#fff;border-radius:28px;padding:26px 20px;
  box-shadow:0 15px 35px rgba(80,80,140,.15);max-width:680px;margin:0 auto;text-align:center}
.qmeta{font-weight:800;color:#9aa;font-size:.9rem;margin-bottom:12px}
.qtext{font-size:clamp(1.2rem,4vw,1.7rem);margin:10px 0 24px;color:#2b2b3a;line-height:1.4}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.opt{border:none;font-family:inherit;cursor:pointer;border-radius:20px;padding:20px 14px;
  font-size:1.2rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);
  color:#3b3b5c;transition:.2s;box-shadow:0 6px 14px rgba(80,80,140,.12)}
.opt:hover:not(:disabled){transform:translateY(-4px)}
.opt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.opt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.result{background:#fff;border-radius:28px;padding:40px 20px;text-align:center;
  box-shadow:0 15px 35px rgba(80,80,140,.15);max-width:560px;margin:0 auto}
.result h2{margin:16px 0 22px;color:#7c5cff}

/* Missing Game */
.missing-view{background:#fff;border-radius:28px;padding:26px 20px;
  box-shadow:0 15px 35px rgba(80,80,140,.15);max-width:680px;margin:0 auto;text-align:center}
.missing-view .picture{font-size:7rem;line-height:1;margin:10px 0 20px;
  filter:drop-shadow(0 10px 15px rgba(0,0,0,.2))}
.missing-view .question{font-size:3.5rem;font-weight:800;color:#2b2b3a;letter-spacing:8px;
  margin:20px 0}
.missing-view .question .blank{color:#7c5cff;background:#f0edff;
  padding:0 15px;border-radius:12px;border-bottom:5px dashed #7c5cff}
.missing-view .label{font-size:1.2rem;font-weight:700;color:#9aa;margin-bottom:10px}
.missing-options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.mopt{border:none;font-family:inherit;cursor:pointer;border-radius:20px;
  padding:20px 28px;font-size:1.8rem;font-weight:800;
  background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;
  transition:.2s;box-shadow:0 6px 14px rgba(80,80,140,.12);min-width:80px}
.mopt:hover:not(:disabled){transform:translateY(-4px) scale(1.05)}
.mopt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.mopt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}

/* Matching */
.match-view{background:#fff;border-radius:28px;padding:26px 20px;
  box-shadow:0 15px 35px rgba(80,80,140,.15);max-width:750px;margin:0 auto}
.match-view h2{text-align:center;color:#7c5cff;font-size:1.4rem;margin-bottom:20px}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.match-col h3{text-align:center;font-size:.9rem;color:#9aa;margin-bottom:12px;font-weight:800}
.match-btn{width:100%;border:none;font-family:inherit;cursor:pointer;
  border-radius:16px;padding:16px;font-size:1.4rem;font-weight:800;
  background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;
  transition:.2s;margin-bottom:10px;box-shadow:0 5px 12px rgba(80,80,140,.1)}
.match-btn:hover:not(:disabled){transform:translateY(-3px)}
.match-btn.sel{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff}
.match-btn.done{background:linear-gradient(145deg,#34C759,#28a745);color:#fff;
  opacity:.5;cursor:default}
.match-btn.err{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .item .visual{font-size:4rem}
  .item .bignum{font-size:3.5rem}
  .card .emo{font-size:2.2rem}
  .swatch{width:70px;height:70px}
  main{padding:14px 12px 60px}
  .missing-view .picture{font-size:5rem}
  .missing-view .question{font-size:2.5rem;letter-spacing:5px}
}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="backBtn" onclick="goBack()">⬅️</button>
  <div>
    <h1 id="hTitle">Kids Learning Hub</h1>
    <div class="sub" id="hSub">CBSE Pattern • Class Wise</div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="muteBtn" onclick="toggleSound()">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
</header>

<main id="screen"></main>

<script>
/* =========================================================
   SECTION 1: SPEECH ENGINE (Voice)
   ========================================================= */
let voices = [];
let soundOn = true;
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const base = lang.split('-')[0];
  return voices.find(v => v.lang.replace('_','-') === lang)
      || voices.find(v => v.lang.replace('_','-').startsWith(base))
      || null;
}
function speak(text, lang='en-IN', rate=0.85){
  if(!soundOn || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = lang; u.rate = rate; u.pitch = 1.05; u.volume = 1;
  const v = pickVoice(lang); if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakSequence(lines, lang='en-IN', onLine){
  if(!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i = 0;
  const go = () => {
    if(i >= lines.length){ if(onLine) onLine(-1); return; }
    if(onLine) onLine(i);
    const u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = lang; u.rate = 0.8; u.pitch = 1.1;
    const v = pickVoice(lang); if(v) u.voice = v;
    u.onend = () => { i++; setTimeout(go, 320); };
    speechSynthesis.speak(u);
  };
  go();
}
function toggleSound(){
  soundOn = !soundOn;
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('muteBtn').textContent = soundOn ? '🔊' : '🔇';
}

/* =========================================================
   SECTION 2: STARS / REWARDS
   ========================================================= */
let stars = parseInt(localStorage.getItem('klh_stars') || '0', 10);
function addStar(){
  stars++;
  localStorage.setItem('klh_stars', stars);
  document.getElementById('starCount').textContent = stars;
}
document.getElementById('starCount').textContent = stars;

/* =========================================================
   SECTION 3: HELPER FUNCTIONS
   ========================================================= */
function numToWord(n){
  const ones = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
    'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n < 20) return ones[n];
  if(n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  return 'One Hundred';
}
function makeNumbers(max){
  const arr = [];
  for(let i=0; i<=max; i++) arr.push({n:i, word:numToWord(i)});
  return arr;
}
function makeTables(from, to){
  const arr = [];
  for(let t=from; t<=to; t++){
    const rows=[], spoken=[];
    for(let i=1; i<=10; i++){
      rows.push(`${t} × ${i} = ${t*i}`);
      spoken.push(`${t} times ${i} is ${t*i}`);
    }
    arr.push({n:t, rows, spoken});
  }
  return arr;
}
function shuffle(arr){
  for(let i = arr.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =========================================================
   SECTION 4: DATA — YAHAN NAYA CONTENT ADD KARO
   ========================================================= */

/* ---------- 4.1 ALPHABET (A-Z) ----------
   Naya letter add karna ho to is list mein add karo:
   ['Letter', 'Word', 'Emoji'],
------------------------------------------- */
const ALPHABET = [
 ['A','Apple','🍎'],['B','Ball','⚽'],['C','Cat','🐱'],['D','Dog','🐶'],
 ['E','Elephant','🐘'],['F','Fish','🐟'],['G','Grapes','🍇'],['H','Hat','👒'],
 ['I','Ice Cream','🍦'],['J','Jug','🥛'],['K','Kite','🪁'],['L','Lion','🦁'],
 ['M','Monkey','🐵'],['N','Nest','🪺'],['O','Orange','🍊'],['P','Parrot','🦜'],
 ['Q','Queen','👑'],['R','Rabbit','🐰'],['S','Sun','☀️'],['T','Tiger','🐯'],
 ['U','Umbrella','☂️'],['V','Van','🚐'],['W','Watch','⌚'],['X','Xylophone','🎹'],
 ['Y','Yak','🐃'],['Z','Zebra','🦓']
];

/* ---------- 4.2 TWO LETTER WORDS ----------
   ['Word', 'Emoji'],
------------------------------------------- */
const TWO_LETTER = [
 ['At','🎯'],['An','1️⃣'],['In','📥'],['On','🔛'],['Up','⬆️'],['Go','🟢'],
 ['No','❌'],['So','✨'],['My','🙋'],['By','👉'],['Do','✅'],['To','➡️'],
 ['Am','🌅'],['As','🅰️'],['Be','🐝'],['He','👦'],['If','❓'],['Is','🟰'],
 ['It','🎁'],['Me','🙋'],['Of','🔗'],['Or','🔀'],['Us','👫'],['We','👨‍👩‍👧']
];

/* ---------- 4.3 THREE LETTER WORDS ---------- */
const THREE_LETTER = [
 ['Cat','🐱'],['Dog','🐶'],['Sun','☀️'],['Bat','🦇'],['Pen','🖊️'],
 ['Cup','🥤'],['Box','📦'],['Hat','👒'],['Bus','🚌'],['Jam','🍯'],
 ['Net','🕸️'],['Bag','🎒'],['Mat','🧘'],['Pot','🍲'],['Fan','🌀'],
 ['Hen','🐔'],['Rat','🐀'],['Bee','🐝'],['Owl','🦉'],['Fly','🪰'],
 ['Ant','🐜'],['Cow','🐮'],['Pig','🐷'],['Fox','🦊'],['Jar','🫙']
];

/* ---------- 4.4 COLORS ---------- */
const COLORS = [
 ['Red','#FF3B30'],['Blue','#0A84FF'],['Green','#34C759'],['Yellow','#FFD60A'],
 ['Orange','#FF9500'],['Purple','#AF52DE'],['Pink','#FF2D95'],['Brown','#8B5A2B'],
 ['Black','#1C1C1E'],['White','#FFFFFF'],['Grey','#9E9E9E'],['Golden','#FFC300'],
 ['Sky Blue','#87CEEB'],['Lime','#A8E63A'],['Maroon','#800000'],['Navy','#000080']
];

/* =========================================================
   SECTION 8: ROUTER & RENDERING (YAHAN KUCH CHANGE NAHI KARNA)
   ========================================================= */
const screen   = document.getElementById('screen');
const hTitle   = document.getElementById('hTitle');
const hSub     = document.getElementById('hSub');
const backBtn  = document.getElementById('backBtn');

let state = { level:null, cat:null, view:'home' };
let currentItems = [];
let currentPoem  = null;
let currentLesson= null;
let currentTable = null;
let quizState = null;
let matchState = null;
let missingState = null;

function setHeader(title, sub){
  hTitle.textContent = title;
  hSub.textContent   = sub;
  backBtn.style.visibility = state.view === 'home' ? 'hidden' : 'visible';
}
function goHome(){ state = {level:null,cat:null,view:'home'}; renderHome(); }
function goLevel(k){ state = {level:k,cat:null,view:'level'}; renderLevel(); }
function goCat(c){ state.cat = c; state.view = 'cat'; renderCategory(); }
function goBack(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(state.view === 'home') return;
  if(state.view === 'level'){ state = {level:null,cat:null,view:'home'}; renderHome(); return; }
  state.view = 'level'; state.cat = null; renderLevel();
}

function renderHome(){
  setHeader('Kids Learning Hub','CBSE Pattern • Class Wise');
  screen.innerHTML = `
    <div class="hero">
      <h1>🎈 Welcome to Learning Land!</h1>
      <p>Apni class chuno aur seekhna shuru karo ✨</p>
    </div>
    <div class="grid levels">
      ${Object.entries(LEVELS).map(([k,l]) => `
        <button class="card" style="--c:${l.color}" onclick="goLevel('${k}')">
          <span class="emo">${l.emoji}</span>
          <span class="ttl">${l.name}</span>
          <span class="sub">${l.sub}</span>
        </button>`).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function renderLevel(){
  const lvl = LEVELS[state.level];
  setHeader(lvl.name, lvl.sub);
  screen.innerHTML = `
    <div class="hero" style="padding:10px 10px 22px">
      <h1 style="font-size:1.7rem">${lvl.emoji} ${lvl.name}</h1>
      <p>Neeche tap karo aur seekho 👇</p>
    </div>
    <div class="grid">
      ${lvl.cats.map(id => {
        const c = CATS[id];
        return `<button class="card" style="--c:${c.c}" onclick="goCat('${id}')">
          <span class="emo">${c.e}</span>
          <span class="ttl">${c.n}</span>
        </button>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function renderCategory(){
  const cid = state.cat;
  const cat = CATS[cid];
  const data = CONTENT[cid];
  currentItems = data.items || [];
  setHeader(cat.n, LEVELS[state.level].name);

  if(data.type === 'cards'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => cardHTML(it,i)).join('') + `</div>`;
  } else if(data.type === 'opposites'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="opp-card" onclick="tapOpposite(${i})">
          <div class="opp-side">
            <div class="opp-pic" style="font-size:${it.leftSize}">${it.leftEmoji}</div>
            <div class="opp-label">${it.left}</div>
          </div>
          <div class="opp-arrow">↔️</div>
          <div class="opp-side">
            <div class="opp-pic" style="font-size:${it.rightSize}">${it.rightEmoji}</div>
            <div class="opp-label">${it.right}</div>
          </div>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'info'){
    screen.innerHTML = `<div class="grid info-grid">` +
      currentItems.map((it,i) => `
        <button class="card info" style="--c:${cat.c}" onclick="tapInfo(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.main}</span>
          <span class="txt">${it.text}</span>
          <span class="play">🔊 Suno</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'poemlist'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openPoem(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">Tap to listen 🎧</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'lesson'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((it,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openLesson(${i})">
          <span class="emo">${it.emoji}</span>
          <span class="ttl">${it.title}</span>
          <span class="sub">${it.chapter}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'tablelist'){
    screen.innerHTML = `<div class="grid">` +
      currentItems.map((t,i) => `
        <button class="card" style="--c:${cat.c}" onclick="openTable(${i})">
          <span class="emo">✖️</span>
          <span class="ttl">Table of ${t.n}</span>
        </button>`).join('') + `</div>`;
  } else if(data.type === 'quiz'){
    screen.innerHTML = `<div id="quizBox"></div>`;
    quizState = { idx:0, score:0, questions: shuffle([...data.questions]).slice(0,10) };
    drawQuiz();
  } else if(data.type === 'missing-letter'){
    missingState = { idx:0, score:0, list: shuffle([...currentItems]).slice(0,10) };
    drawMissingLetter(); return;
  } else if(data.type === 'missing-number'){
    missingState = { idx:0, score:0, list: shuffle([...currentItems]).slice(0,10) };
    drawMissingNumber(); return;
  } else if(data.type === 'matching'){
    matchState = { selLeft:null, done:0, items: data.items };
    drawMatching(); return;
  }
  window.scrollTo(0,0);
}

function cardHTML(it, i){
  const visual = it.color
    ? `<span class="swatch" style="background:${it.color}"></span>`
    : it.emoji
      ? `<span class="visual">${it.emoji}</span>`
      : `<span class="bignum">${it.main}</span>`;
  return `<button class="item" onclick="tap(${i})">
    ${it.badge ? `<span class="badge">${it.badge}</span>` : ''}
    ${visual}
    <span class="label">${it.sub || it.main}</span>
  </button>`;
}

function tap(i){
  const it = currentItems[i];
  if(!it) return;
  speak(it.say || it.main || it.sub);
  addStar();
}
function tapOpposite(i){
  const it = currentItems[i];
  if(!it) return;
  speak(`${it.left} and ${it.right}`);
  addStar();
}
function tapInfo(i){
  const it = currentItems[i];
  if(!it) return;
  speak(it.main + '. ' + it.text);
  addStar();
}

function drawMissingLetter(){
  if(missingState.idx >= missingState.list.length){
    screen.innerHTML = `<div class="result">
      <div style="font-size:4rem">🏆</div>
      <h2>Score: ${missingState.score} / ${missingState.list.length}</h2>
      <button class="btn primary" onclick="renderCategory()">🔄 Wapas</button>
    </div>`;
    speak('Well done!');
    return;
  }
  const item = missingState.list[missingState.idx];
  const word = item.word;
  const pos = Math.floor(Math.random() * word.length);
  const correct = word[pos];
  const display = word.split('').map((ch,i) => i===pos
    ? '<span class="blank">_</span>' : ch).join('');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const options = [correct];
  while(options.length < 3){
    const r = letters[Math.floor(Math.random()*26)];
    if(!options.includes(r)) options.push(r);
  }
  shuffle(options);
  screen.innerHTML = `
    <div class="missing-view">
      <div class="qmeta">Question ${missingState.idx+1} / ${missingState.list.length} • ⭐ ${missingState.score}</div>
      <div class="picture">${item.emoji}</div>
      <div class="label">Missing letter dhoondo 👇</div>
      <div class="question">${display}</div>
      <div class="missing-options">
        ${options.map(o => `<button class="mopt" onclick="answerMissingLetter('${o}','${correct}')">${o}</button>`).join('')}
      </div>
    </div>`;
  speak('Which letter is missing in ' + word.split('').join(' '));
}

function answerMissingLetter(opt, correct){
  const btns = document.querySelectorAll('.mopt');
  btns.forEach(b => b.disabled = true);
  if(opt === correct){
    missingState.score++;
    btns.forEach(b => { if(b.textContent.trim() === opt) b.classList.add('right'); });
    speak('Correct!'); addStar();
  } else {
    btns.forEach(b => {
      if(b.textContent.trim() === opt) b.classList.add('wrong');
      if(b.textContent.trim() === correct) b.classList.add('right');
    });
    speak('Oops! Correct answer is ' + correct);
  }
  setTimeout(() => { missingState.idx++; drawMissingLetter(); }, 1600);
}

function drawMissingNumber(){
  if(missingState.idx >= missingState.list.length){
    screen.innerHTML = `<div class="result">
      <div style="font-size:4rem">🏆</div>
      <h2>Score: ${missingState.score} / ${missingState.list.length}</h2>
      <button class="btn primary" onclick="renderCategory()">🔄 Wapas</button>
    </div>`;
    speak('Well done!');
    return;
  }
  const item = missingState.list[missingState.idx];
  const n = item.n;
  const mode = Math.floor(Math.random()*3);
  let display, correct;
  if(mode === 0){ display = `_ , ${n+1} , ${n+2}`; correct = n; }
  else if(mode === 1){ display = `${n-1} , _ , ${n+1}`; correct = n; }
  else { display = `${n-1} , ${n} , _`; correct = n+1; }
  const options = [correct];
  while(options.length < 3){
    const r = correct + Math.floor(Math.random()*7) - 3;
    if(r >= 0 && !options.includes(r)) options.push(r);
  }
  shuffle(options);
  screen.innerHTML = `
    <div class="missing-view">
      <div class="qmeta">Question ${missingState.idx+1} / ${missingState.list.length} • ⭐ ${missingState.score}</div>
      <div class="picture">🔢</div>
      <div class="label">Missing number dhoondo 👇</div>
      <div class="question" style="font-size:2.5rem">${display}</div>
      <div class="missing-options">
        ${options.map(o => `<button class="mopt" onclick="answerMissingNumber(${o},${correct})">${o}</button>`).join('')}
      </div>
    </div>`;
  speak('Which number is missing?');
}

function answerMissingNumber(opt, correct){
  const btns = document.querySelectorAll('.mopt');
  btns.forEach(b => b.disabled = true);
  if(opt === correct){
    missingState.score++;
    btns.forEach(b => { if(parseInt(b.textContent) === opt) b.classList.add('right'); });
    speak('Correct!'); addStar();
  } else {
    btns.forEach(b => {
      if(parseInt(b.textContent) === opt) b.classList.add('wrong');
      if(parseInt(b.textContent) === correct) b.classList.add('right');
    });
    speak('Oops! Correct answer is ' + correct);
  }
  setTimeout(() => { missingState.idx++; drawMissingNumber(); }, 1600);
}

function drawMatching(){
  const items = matchState.items;
  const lefts = items.map(it => it.left);
  const rights = shuffle([...items.map(it => it.right)]);
  screen.innerHTML = `
    <div class="match-view">
      <h2>🎯 Match the Following</h2>
      <div class="match-cols">
        <div class="match-col">
          <h3>Left</h3>
          ${lefts.map(l => `<button class="match-btn" data-side="L" data-val="${l}" onclick="clickMatch(this)">${l}</button>`).join('')}
        </div>
        <div class="match-col">
          <h3>Right</h3>
          ${rights.map(r => `<button class="match-btn" data-side="R" data-val="${r}" onclick="clickMatch(this)">${r}</button>`).join('')}
        </div>
      </div>
      <div class="poem-actions">
        <button class="btn primary" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function clickMatch(btn){
  if(btn.classList.contains('done')) return;
  const side = btn.dataset.side;
  const val = btn.dataset.val;
  if(side === 'L'){
    document.querySelectorAll('[data-side="L"]').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    matchState.selLeft = btn;
    speak(val);
  } else {
    if(!matchState.selLeft){ speak('Pehle left side se choose karo'); return; }
    const leftVal = matchState.selLeft.dataset.val;
    const correct = matchState.items.find(it => it.left === leftVal);
    if(correct && correct.right === val){
      matchState.selLeft.classList.remove('sel');
      matchState.selLeft.classList.add('done');
      btn.classList.add('done');
      matchState.selLeft = null;
      matchState.done++;
      speak('Correct!');
      addStar();
      if(matchState.done === matchState.items.length){
        setTimeout(() => { speak('Excellent!'); alert('🎉 Shabaash!'); }, 400);
      }
    } else {
      btn.classList.add('err');
      matchState.selLeft.classList.remove('sel');
      matchState.selLeft = null;
      speak('Try again');
      setTimeout(() => btn.classList.remove('err'), 700);
    }
  }
}

function openTable(i){
  currentTable = currentItems[i];
  state.view = 'table';
  setHeader(`Table of ${currentTable.n}`, 'Tap a line to hear');
  screen.innerHTML = `
    <div class="table-view">
      <h2>✖️ Table of ${currentTable.n}</h2>
      ${currentTable.rows.map((r,j) =>
        `<button class="trow" onclick="speakRow(${j})">${r}</button>`).join('')}
      <div class="poem-actions">
        <button class="btn primary" onclick="playTable()">▶️ Poora Table</button>
        <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function speakRow(j){
  speak(currentTable.spoken[j]);
  document.querySelectorAll('.trow').forEach((e,k) =>
    e.classList.toggle('active', k === j));
  addStar();
}
function playTable(){
  speakSequence(currentTable.spoken, 'en-IN', idx => {
    document.querySelectorAll('.trow').forEach((e,k) =>
      e.classList.toggle('active', k === idx));
  });
  addStar();
}

function openLesson(i){
  currentLesson = currentItems[i];
  state.view = 'lesson';
  setHeader(currentLesson.title, currentLesson.chapter);
  screen.innerHTML = `
    <div class="lesson">
      <h2>${currentLesson.emoji} ${currentLesson.title}</h2>
      <div class="chapter">${currentLesson.chapter}</div>
      <div class="sec-title">📖 Padhai</div>
      ${currentLesson.points.map((p,j) =>
        `<button class="point" onclick="speakPoint(${j})">
          <span class="dot">🔹</span><span>${p}</span>
        </button>`).join('')}
      <div class="sec-title">❓ Prashn Uttar</div>
      ${currentLesson.qa.map((q,j) => `
        <div class="qa-item">
          <div class="qa-q" onclick="speakQ(${j})">Q${j+1}. ${q.q} 🔊</div>
          <button class="ans-btn" onclick="revealAns(${j})">👉 Uttar Dekho</button>
          <div class="qa-a" id="ans-${j}">${q.a}</div>
        </div>`).join('')}
      <div class="poem-actions">
        <button class="btn primary" onclick="playLesson()">▶️ Poora Lesson</button>
        <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function speakPoint(j){
  speak(currentLesson.points[j]);
  document.querySelectorAll('.point').forEach((e,k) =>
    e.classList.toggle('active', k === j));
  addStar();
}
function speakQ(j){ speak(currentLesson.qa[j].q); addStar(); }
function revealAns(j){
  const el = document.getElementById('ans-'+j);
  if(!el) return;
  el.classList.toggle('show');
  if(el.classList.contains('show')) speak(currentLesson.qa[j].a);
  addStar();
}
function playLesson(){
  const seq = [];
  currentLesson.points.forEach(p => seq.push(p));
  currentLesson.qa.forEach((qa,k) => {
    seq.push('Question '+(k+1)+'. '+qa.q);
    seq.push('Answer. '+qa.a);
  });
  speakSequence(seq, 'en-IN', idx => {
    document.querySelectorAll('.point').forEach((e,k) =>
      e.classList.toggle('active', k === idx));
  });
  addStar();
}

function openPoem(i){
  currentPoem = currentItems[i];
  state.view = 'poem';
  setHeader(currentPoem.title, 'Rhyme Time 🎵');
  const bg = currentPoem.bg || 'linear-gradient(135deg,#a8e6ff,#ffd6ec,#e0d4ff)';
  const heroPic = currentPoem.heroPic || currentPoem.emoji;
  screen.innerHTML = `
    <div class="poem">
      <div class="poem-hero" style="background:${bg}">
        <div class="hero-pic">${heroPic}</div>
        <h2>${currentPoem.emoji} ${currentPoem.title}</h2>
        <div class="author">— ${currentPoem.author}</div>
      </div>
      <div class="poem-body">
        <div class="lines">
          ${currentPoem.lines.map((l,j) =>
            `<button class="line" onclick="speakLine(${j})">
              <span class="pic">${l[1]}</span>
              <span>${l[0]}</span>
            </button>`).join('')}
        </div>
        <div class="poem-actions">
          <button class="btn primary" onclick="playPoem()">▶️ Poori Poem</button>
          <button class="btn" onclick="renderCategory()">↩️ Wapas</button>
        </div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function speakLine(j){
  speak(currentPoem.lines[j][0], currentPoem.lang || 'en-IN');
  document.querySelectorAll('.line').forEach((e,k) => {
    e.classList.toggle('active', k === j);
    if(k === j) e.scrollIntoView({behavior:'smooth', block:'center'});
  });
  addStar();
}
function playPoem(){
  const texts = currentPoem.lines.map(l => l[0]);
  speakSequence(texts, currentPoem.lang || 'en-IN', idx => {
    document.querySelectorAll('.line').forEach((e,k) => {
      e.classList.toggle('active', k === idx);
      if(k === idx) e.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  addStar();
}

function drawQuiz(){
  const box = document.getElementById('quizBox');
  if(!box) return;
  if(quizState.idx >= quizState.questions.length){
    const perfect = quizState.score === quizState.questions.length;
    box.innerHTML = `<div class="result">
      <div style="font-size:4rem">${perfect?'🏆':'🌟'}</div>
      <h2>Score: ${quizState.score} / ${quizState.questions.length}</h2>
      <button class="btn primary" onclick="renderCategory()">🔄 Phir Se</button>
    </div>`;
    speak(perfect ? 'Perfect score!' : `You scored ${quizState.score} out of ${quizState.questions.length}.`);
    return;
  }
  const q = quizState.questions[quizState.idx];
  box.innerHTML = `
    <div class="quiz">
      <div class="qmeta">Question ${quizState.idx+1} / ${quizState.questions.length} • ⭐ ${quizState.score}</div>
      <h2 class="qtext">${q.q}</h2>
      <div class="options">
        ${q.options.map(o => `<button class="opt" onclick="answer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
    </div>`;
  speak(q.q);
}
function answer(opt){
  const q = quizState.questions[quizState.idx];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.disabled = true);
  if(opt === q.answer){
    quizState.score++;
    opts.forEach(o => { if(o.textContent.trim() === opt) o.classList.add('right'); });
    speak('Correct!'); addStar();
  } else {
    opts.forEach(o => {
      if(o.textContent.trim() === opt) o.classList.add('wrong');
      if(o.textContent.trim() === q.answer) o.classList.add('right');
    });
    speak('Correct answer is ' + q.answer);
  }
  setTimeout(() => { quizState.idx++; drawQuiz(); }, 1500);
}
