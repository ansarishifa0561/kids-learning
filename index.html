<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — Nursery Picture Math</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#f39c12;--primary-dark:#e67e22;--bg:#fffdf9;--text:#3e2723;--muted:#8d6e63;--border:#ffe0b2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;}
h1{color:var(--primary-dark);font-size:2rem;margin-bottom:10px;text-align:center;}
h2{color:var(--primary);font-size:1.5rem;margin:30px 0 15px;text-align:center;}
p{color:var(--muted);text-align:center;margin-bottom:20px;font-size:1.1rem;}
.stars{text-align:center;font-size:1.3rem;font-weight:800;color:#e65100;margin-bottom:20px;}
.math-pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px;max-width:1200px;margin-left:auto;margin-right:auto;}
.mp-card{background:#fff;border:3px solid var(--border);border-radius:18px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.04);}
.mp-visual{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.8rem;margin-bottom:15px;flex-wrap:wrap;line-height:1.4;}
.mp-visual .group{letter-spacing:4px;}
.mp-eq{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.7rem;font-weight:800;}
.mp-eq input{width:60px;height:60px;font-size:1.8rem;font-weight:800;text-align:center;border:3px solid var(--primary);border-radius:12px;outline:none;font-family:inherit;}
.mp-eq input.correct{border-color:#34C759;background:#d8fff0;color:#08764d;}
</style>
</head>
<body>

<h1>🎓 Shifa's Hub — Test File</h1>
<p>Nursery Maths — Picture Addition & Subtraction</p>
<div class="stars">⭐ Stars: <span id="starCount">0</span></div>

<h2>➕ Addition with Pictures (50 Questions)</h2>
<div class="math-pic-grid" id="addGrid"></div>

<h2>➖ Subtraction with Pictures (50 Questions)</h2>
<div class="math-pic-grid" id="subGrid"></div>

<script>
/* ===== STARS ===== */
let stars = parseInt(localStorage.getItem('shifaStars') || '0', 10);
document.getElementById('starCount').textContent = stars;
function addStar() {
  stars++;
  localStorage.setItem('shifaStars', stars);
  document.getElementById('starCount').textContent = stars;
}

/* ===== SPEAK ===== */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

/* ===== PICTURE POOL ===== */
const picPool = ['🍎','🍌','🍇','🍊','🍓','⭐','🌸','🌻','🌹','🦋','🐶','🐱','🐰','🐟','🎈','⚽','🚗','🧸','🍩','🍭','🪁','🐦','🌼','💐','🟢','🔵','🔺','🟡','❤️','🍒','🌟','🌈','🍪','🚀','🎁','🧁','🐢','🐸','🌸','🍀'];

function rndPic() {
  return picPool[Math.floor(Math.random() * picPool.length)];
}

/* ===== GENERATE 50 ADDITION ===== */
function generateAddPics50() {
  const arr = [];
  const used = new Set();
  while (arr.length < 50) {
    const a = Math.floor(Math.random() * 5) + 1;
    const b = Math.floor(Math.random() * 5) + 1;
    const k = `${a}+${b}`;
    if (used.has(k)) continue;
    used.add(k);
    arr.push({ a, b, sum: a + b, e1: rndPic(), e2: rndPic() });
  }
  return arr;
}

/* ===== GENERATE 50 SUBTRACTION ===== */
function generateSubPics50() {
  const arr = [];
  const used = new Set();
  while (arr.length < 50) {
    const a = Math.floor(Math.random() * 6) + 3;
    const b = Math.floor(Math.random() * (a - 1)) + 1;
    const k = `${a}-${b}`;
    if (used.has(k)) continue;
    used.add(k);
    arr.push({ a, b, sum: a - b, e1: rndPic(), e2: rndPic() });
  }
  return arr;
}

/* ===== RENDER ADDITION ===== */
const addData = generateAddPics50();
document.getElementById('addGrid').innerHTML = addData.map((i, idx) => `
  <div class="mp-card">
    <div class="mp-visual">
      <span class="group">${i.e1.repeat(i.a)}</span>
      <span style="font-weight:800;">+</span>
      <span class="group">${i.e2.repeat(i.b)}</span>
    </div>
    <div class="mp-eq">
      <span>${i.a} + ${i.b} =</span>
      <input type="number" id="addpic-${idx}" oninput="checkMathPic(${idx}, ${i.sum}, 'addpic')">
    </div>
  </div>
`).join('');

/* ===== RENDER SUBTRACTION ===== */
const subData = generateSubPics50();
document.getElementById('subGrid').innerHTML = subData.map((i, idx) => `
  <div class="mp-card">
    <div class="mp-visual">
      <span class="group">${i.e1.repeat(i.a)}</span>
      <span style="font-weight:800; color:#d32f2f;">− ${i.b}</span>
      <span class="group" style="opacity:0.3;">${i.e2.repeat(i.b)}</span>
    </div>
    <div class="mp-eq">
      <span>${i.a} − ${i.b} =</span>
      <input type="number" id="subpic-${idx}" oninput="checkMathPic(${idx}, ${i.sum}, 'subpic')">
    </div>
  </div>
`).join('');

/* ===== CHECKER ===== */
function checkMathPic(idx, correctAns, prefix) {
  const input = document.getElementById(`${prefix}-${idx}`);
  if (!input) return;
  if (parseInt(input.value) === correctAns) {
    input.classList.add('correct');
    input.disabled = true;
    addStar();
    speak('Correct!');
  } else {
    input.classList.remove('correct');
  }
}
</script>
</body>
</html>
