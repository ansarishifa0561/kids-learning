<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shifa's Learning Hub 🎓✨</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#2b2b3a;padding:14px;
background:radial-gradient(circle at 20% 20%,#fff5e6,#f0d9b5 60%,#d9b88a 100%);
background-attachment:fixed;min-height:100vh}
.frame{max-width:1250px;margin:20px auto;background:linear-gradient(135deg,#fffefb,#fff8ee);
border-radius:14px;box-shadow:0 0 0 3px #fff,0 0 0 10px #8B5A2B,0 0 0 13px #d4a373,0 0 0 16px #8B5A2B,0 25px 60px rgba(80,50,20,.35);overflow:hidden}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;
background:linear-gradient(135deg,#fffefb,#fff5e6);border-bottom:3px double #8B5A2B;box-shadow:0 4px 20px rgba(139,90,43,.15)}
header h1{font-size:1.05rem;font-weight:800;color:#5a3a1a;line-height:1.1}
header .sub{font-size:.7rem;opacity:.75;font-weight:600;color:#8B5A2B}
.ibtn{width:44px;height:44px;border-radius:14px;border:2px solid #d4a373;cursor:pointer;background:#fff;font-size:1.2rem;display:grid;place-items:center;flex:0 0 auto}
.sp{flex:1}
.stars{background:linear-gradient(135deg,#FFF5CC,#FFE066);border:2px solid #d4a373;border-radius:14px;padding:7px 14px;font-weight:800;font-size:.9rem;color:#7a4a10}
main{padding:20px 16px 60px}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:800;background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.75;font-weight:600;color:#5a3a1a}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}
.grid.info-grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card,.item{border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fffefb,#fff5e6);display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 20px rgba(139,90,43,.18);transition:transform .2s;position:relative;overflow:hidden;text-align:center;border-radius:20px}
.card{padding:22px 12px;gap:6px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-6px) scale(1.03)}
.card .emo{font-size:2.8rem;line-height:1}
.card .ttl{font-weight:800;font-size:1rem;color:#5a3a1a}
.card .sub{font-size:.78rem;opacity:.7;font-weight:600;color:#8B5A2B}
.item{padding:18px 10px;gap:8px;border-radius:22px}
.item .visual{font-size:5rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.item .bignum{font-size:3rem;font-weight:800;line-height:1;color:#7c5cff;text-shadow:2px 2px 0 #fff}
.item .label{font-weight:800;font-size:.95rem;color:#5a3a1a}
.item .badge{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;border-radius:10px;padding:2px 10px;font-size:.8rem;font-weight:800}
.swatch{width:85px;height:85px;border-radius:50%;box-shadow:inset 0 -8px 15px rgba(0,0,0,.15),inset 0 8px 15px rgba(255,255,255,.4),0 8px 20px rgba(0,0,0,.2)}
.num-tile{display:inline-flex;align-items:center;justify-content:center;min-width:65px;min-height:65px;border-radius:16px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;color:#fff;box-shadow:0 8px 16px rgba(0,0,0,.25);padding:6px 12px;white-space:nowrap}
.item.word-item{grid-column:span 2;padding:20px 14px;min-height:160px;justify-content:center}
.item .wordtext{font-weight:800;line-height:1.15;word-break:break-word;color:#5C6BC0;font-size:1.4rem}
.item.word-item[data-len="s"] .wordtext{font-size:1.9rem}
.item.word-item[data-len="m"] .wordtext{font-size:1.3rem}
.item.word-item[data-len="l"] .wordtext{font-size:1.05rem}
.sq-card{border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fff,#f0f4ff);display:flex;flex-direction:column;align-items:center;padding:16px 10px;gap:4px;border-radius:22px;box-shadow:0 8px 20px rgba(80,80,180,.18);position:relative}
.sq-card::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#7c5cff,#ff5f9e)}
.sq-card .expr{font-size:1.5rem;font-weight:800;color:#5C6BC0}
.sq-card .eq{font-size:.9rem;color:#8B5A2B;font-weight:700}
.sq-card .res{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#7c5cff,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.info{align-items:flex-start;text-align:left;padding:18px}
.card.info .emo{font-size:2.2rem}
.card.info .txt{font-size:.85rem;opacity:.8;font-weight:600;color:#5a3a1a}
.lesson{background:#fffefb;border-radius:22px;padding:22px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:820px;margin:0 auto;border:2px solid #e8d5b7}
.lesson h2{text-align:center;font-size:1.4rem;color:#7c5cff;margin-bottom:6px}
.lesson .chapter{text-align:center;font-size:.82rem;opacity:.75;font-weight:700;margin-bottom:16px;color:#8B5A2B}
.sec-title{font-size:1.1rem;font-weight:800;margin:20px 0 10px;color:#5a3a1a;border-bottom:2px dashed #e8d5b7;padding-bottom:6px}
.point{width:100%;border:none;font-family:inherit;cursor:pointer;background:#f6f4ff;border-radius:14px;padding:12px 16px;font-size:.98rem;font-weight:700;text-align:left;color:#2b2b3a;margin-bottom:8px;line-height:1.5;display:flex;gap:8px}
.point:hover{background:#e9e5ff}
.point.active{background:#7c5cff;color:#fff}
.point .dot{flex:0 0 auto}
.qa-item{background:linear-gradient(135deg,#f9f9ff,#f0f0ff);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:5px solid #7c5cff}
.qa-q{font-weight:800;font-size:.95rem;margin-bottom:8px;cursor:pointer}
.qa-a{background:#e8fff0;border-radius:10px;padding:10px 12px;font-size:.9rem;font-weight:700;color:#1b7a45;display:none}
.qa-a.show{display:block}
.ans-btn{border:none;font-family:inherit;cursor:pointer;background:#eef0ff;color:#5c4dff;font-weight:800;border-radius:10px;padding:6px 14px;font-size:.8rem}
.table-view{background:#fffefb;border-radius:22px;padding:22px 18px;max-width:520px;margin:0 auto;box-shadow:0 12px 30px rgba(139,90,43,.18);border:2px solid #e8d5b7}
.table-view h2{text-align:center;font-size:1.4rem;color:#7c5cff;margin-bottom:14px}
.trow{width:100%;border:none;font-family:inherit;cursor:pointer;background:linear-gradient(145deg,#f6f4ff,#ece9ff);border-radius:14px;padding:12px 16px;font-size:1.1rem;font-weight:800;text-align:center;color:#2b2b3a;margin-bottom:8px}
.trow.active{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff}
.poem{background:#fff;border-radius:22px;padding:0;overflow:hidden;box-shadow:0 15px 40px rgba(139,90,43,.25);max-width:750px;margin:0 auto;border:2px solid #e8d5b7}
.poem-hero{padding:26px 18px;text-align:center}
.poem-hero .hero-pic{font-size:4.5rem;line-height:1}
.poem-hero h2{font-size:1.4rem;margin:10px 0 4px;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.4)}
.poem-hero .author{font-size:.82rem;color:#fff;font-weight:700;text-shadow:1px 1px 3px rgba(0,0,0,.4)}
.poem-body{padding:20px 16px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:none;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#f6f4ff,#eef0ff);border-radius:16px;padding:14px 18px;font-size:1.05rem;font-weight:700;text-align:left;color:#2b2b3a;line-height:1.5;display:flex;gap:12px;align-items:center;border-left:5px solid transparent}
.line .pic{font-size:1.9rem;flex:0 0 auto}
.line:hover{background:#e9e5ff}
.line.active{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;box-shadow:0 8px 20px rgba(124,92,255,.5);border-left:5px solid #fff}
.poem-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:14px;padding:12px 22px;font-weight:800;font-size:.95rem;background:#eef0ff;color:#5c4dff}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff}
.quiz{background:#fffefb;border-radius:22px;padding:24px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:660px;margin:0 auto;text-align:center;border:2px solid #e8d5b7}
.qmeta{font-weight:800;color:#9aa;font-size:.85rem;margin-bottom:10px}
.qtext{font-size:1.4rem;margin:10px 0 20px;color:#2b2b3a;line-height:1.4}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{border:none;font-family:inherit;cursor:pointer;border-radius:16px;padding:18px 12px;font-size:1.15rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c}
.opt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.opt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.result{background:#fffefb;border-radius:22px;padding:36px 18px;text-align:center;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:520px;margin:0 auto;border:2px solid #e8d5b7}
.result h2{margin:14px 0 20px;color:#7c5cff}
.missing-view{background:#fffefb;border-radius:22px;padding:24px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:660px;margin:0 auto;text-align:center;border:2px solid #e8d5b7}
.missing-view .picture{font-size:6rem;line-height:1;margin:10px 0 16px}
.missing-view .question{font-size:3rem;font-weight:800;color:#2b2b3a;letter-spacing:6px;margin:16px 0}
.missing-view .question .blank{color:#7c5cff;background:#f0edff;padding:0 12px;border-radius:10px;border-bottom:4px dashed #7c5cff}
.missing-view .label{font-size:1.1rem;font-weight:700;color:#9aa;margin-bottom:8px}
.missing-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.mopt{border:none;font-family:inherit;cursor:pointer;border-radius:16px;padding:18px 24px;font-size:1.6rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;min-width:75px}
.mopt.right{background:linear-gradient(145deg,#34C759,#28a745);color:#fff}
.mopt.wrong{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.match-view{background:#fffefb;border-radius:22px;padding:24px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:740px;margin:0 auto;border:2px solid #e8d5b7}
.match-view h2{text-align:center;color:#7c5cff;font-size:1.3rem;margin-bottom:18px}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.match-col h3{text-align:center;font-size:.85rem;color:#9aa;margin-bottom:10px;font-weight:800}
.match-btn{width:100%;border:none;font-family:inherit;cursor:pointer;border-radius:14px;padding:14px;font-size:1.2rem;font-weight:800;background:linear-gradient(145deg,#f4f6ff,#e8ecff);color:#3b3b5c;margin-bottom:8px}
.match-btn.sel{background:linear-gradient(135deg,#7c5cff,#5c4dff);color:#fff}
.match-btn.done{background:linear-gradient(145deg,#34C759,#28a745);color:#fff;opacity:.5}
.match-btn.err{background:linear-gradient(145deg,#FF3B30,#dc3545);color:#fff}
.opp-card{grid-column:span 2;border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fffefb,#fff5e6);display:flex;align-items:center;justify-content:space-around;gap:8px;padding:20px 12px;border-radius:22px;box-shadow:0 8px 20px rgba(139,90,43,.18);position:relative}
.opp-card::before{content:'';position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#ff5f9e,#7c5cff);border-radius:22px 22px 0 0}
.opp-side{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.opp-pic{line-height:1}
.opp-label{font-weight:800;font-size:.95rem;color:#5a3a1a}
.opp-arrow{font-size:1.8rem;color:#7c5cff}
@media(max-width:480px){
  body{padding:6px}
  .frame{margin-top:12px;margin-bottom:12px}
  main{padding:14px 10px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
  .item .visual{font-size:3.6rem}
  .item .bignum{font-size:2.4rem}
  .card .emo{font-size:2rem}
  .swatch{width:65px;height:65px}
  .missing-view .question{font-size:2.2rem;letter-spacing:4px}
}
/* ADVANCED LESSONS CSS */
.adv-hero{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff;text-align:center;padding:32px 20px;border-radius:24px;margin-bottom:24px;box-shadow:0 15px 35px rgba(124,92,255,.35);position:relative;overflow:hidden}
.adv-hero h1{font-size:1.9rem;font-weight:800;margin-bottom:8px;position:relative}
.adv-hero p{opacity:.95;font-weight:700;position:relative}
.adv-badge{display:inline-block;background:rgba(255,255,255,.25);padding:4px 14px;border-radius:14px;font-size:.78rem;font-weight:800;margin-bottom:12px;position:relative}
.adv-card-home{background:linear-gradient(135deg,#FFD60A,#FF9500);border-radius:26px;padding:26px 20px;margin:24px auto 0;max-width:600px;text-align:center;cursor:pointer;box-shadow:0 15px 40px rgba(255,149,0,.4);transition:.25s;border:none;font-family:inherit;width:100%;display:block}
.adv-card-home:hover{transform:translateY(-6px) scale(1.02)}
.adv-card-home .icon{font-size:3.5rem;display:block;margin-bottom:10px}
.adv-card-home .title{font-size:1.4rem;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.chapter-view{background:#fbfffb;border-radius:22px;padding:22px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:850px;margin:0 auto;border:2px solid #e8d5b7}
.chapter-view h2{text-align:center;font-size:1.5rem;color:#7c5cff;margin-bottom:4px}
.chapter-view .meta{text-align:center;font-size:.82rem;opacity:.75;font-weight:700;margin-bottom:18px;color:#8B5A2B}
.chapter-sec{margin-bottom:22px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#f9f9ff,#f0f0ff);border-left:5px solid #7c5cff}
.chapter-sec h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;color:#5a3a1a}
.chapter-sec .text{background:#fff;padding:12px 14px;border-radius:12px;font-size:1rem;font-weight:700;color:#3b3b5c;line-height:1.6;cursor:pointer}
.chapter-step{background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:.95rem;font-weight:700;color:#2b2b3a;display:flex;gap:10px;align-items:flex-start;line-height:1.5;cursor:pointer;border-left:4px solid #FFC300}
.chapter-step:hover{background:#fff8ee}
.chapter-step .n{background:#7c5cff;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;flex:0 0 auto}
.chapter-ex{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid #34C759}
.chapter-ex .q{font-size:1.02rem;font-weight:800;color:#5a3a1a;margin-bottom:6px;cursor:pointer}
.chapter-ex .s{background:#e8fff0;padding:10px 12px;border-radius:10px;font-size:.92rem;font-weight:700;color:#1b7a45;line-height:1.5;display:none}
.chapter-ex .s.show{display:block}
/* ===== FIXED PREMIUM GREEN CARD ===== */
.adv-card-home {
  background: linear-gradient(135deg, #10b981, #059669) !important;
  border-radius: 24px !important;
  padding: 25px 20px !important;
  margin: 35px auto 20px !important;
  max-width: 450px !important; /* Width (Chaudai) kam kar di */
  text-align: center !important;
  cursor: pointer !important;
  box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.5) !important;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  border: 2px solid rgba(255, 255, 255, 0.2) !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  position: relative !important;
  overflow: hidden !important;
}

.adv-card-home:hover {
  transform: translateY(-8px) scale(1.02) !important;
  box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.7) !important;
}

/* Emoji */
.adv-card-home .icon {
  font-size: 3.5rem !important;
  display: block !important;
  margin-bottom: 8px !important;
  filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)) !important;
  animation: floatIcon 3s ease-in-out infinite !important;
}

@keyframes floatIcon {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}

/* Title */
.adv-card-home .title {
  font-size: 2rem !important;
  font-weight: 800 !important;
  color: #ffffff !important;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3) !important;
  margin-bottom: 8px !important; /* Neeche ka gap kam kiya */
  display: block !important;
  line-height: 1.2 !important;
}

/* Subtitle (Text) */
.adv-card-home .sub {
  font-size: 0.95rem !important;
  color: #ecfdf5 !important;
  font-weight: 700 !important;
  letter-spacing: 0.5px !important;
  display: inline-block !important; /* Text ko compact kiya */
  background: rgba(255, 255, 255, 0.2) !important;
  padding: 6px 16px !important;
  border-radius: 30px !important;
  backdrop-filter: blur(5px) !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
}
.chapter-pr{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid #2196F3;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chapter-pr .q{font-size:.98rem;font-weight:800;color:#5a3a1a}
.chapter-pr .a{background:#eef0ff;color:#5c4dff;padding:6px 14px;border-radius:10px;font-weight:800;font-size:.92rem;cursor:pointer}
.chapter-pr .a.revealed{background:#e8fff0;color:#1b7a45}
.chapter-word{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid #FF6F00}
.chapter-word .q{font-size:.98rem;font-weight:800;color:#5a3a1a;margin-bottom:6px;cursor:pointer;line-height:1.5}
.chapter-word .a{background:#fff8ee;padding:10px 12px;border-radius:10px;font-size:.92rem;font-weight:700;color:#8B5A2B;display:none;line-height:1.5}
.chapter-word .a.show{display:block}
</style>
</head>

<div class="frame">
<header>
  <button class="ibtn" id="backBtn" onclick="goBack()">⬅️</button>
  <div><h1 id="hTitle">Shifa's Learning Hub </h1><div class="sub" id="hSub">CBSE Pattern</div></div>
  <div class="sp"></div>
  <button class="ibtn" id="muteBtn" onclick="toggleSound()">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="screen"></main>
</div>

'jaise':'जैसे','waise':'वैसे','sirf':'सिर्फ','bahut':'बहुत','thoda':'थोड़ा','thodi':'थोड़ी',
'accha':'अच्छा','achha':'अच्छा','bura':'बुरा','bada':'बड़ा','badi':'बड़ी','bade':'बड़े',

function fixRoman(t){
  if(!t) return t;
  let r = String(t);
  const keys = Object.keys(RH).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    r = r.replace(new RegExp('\\b'+k+'\\b','gi'), ()=>RH[k]);
  }
  return r;
}
function prepare(t){
  let x = String(t);
  x = x.replace(/\bBaa\b/gi,'बा').replace(/\bba\b/gi,'बा');
  return fixRoman(x);
}

/* ===== SPEECH ===== */
let voices=[], soundOn=true;
function loadV(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ loadV(); speechSynthesis.onvoiceschanged = loadV; }
function pickV(lang){
  const b = lang.split('-')[0];
  const hi = b==='hi';
  const names = hi
    ? ['Google हिन्दी','Microsoft Swara','Microsoft Kalpana','Lekha','Aditi','Google UK English Female','Microsoft Zira']
    : ['Google UK English Female','Microsoft Zira','Samantha','Microsoft Heera','Google US English'];
  for(const n of names){ const v=voices.find(x=>x.name&&x.name.includes(n)); if(v)return v; }
  return voices.find(v=>v.lang.replace('_','-').startsWith(b)) || null;
}
function speak(text, lang='hi-IN', rate=0.78){
  if(!soundOn||!('speechSynthesis' in window)||!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(prepare(text));
  u.lang=lang; u.rate=rate; u.pitch=1.2; u.volume=1;
  const v=pickV(lang); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function speakSeq(lines, lang='hi-IN', cb){
  if(!soundOn||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i=0;
  const go=()=>{
    if(i>=lines.length){ if(cb)cb(-1); return; }
    if(cb)cb(i);
    const u=new SpeechSynthesisUtterance(prepare(lines[i]));
    u.lang=lang; u.rate=0.72; u.pitch=1.25;
    const v=pickV(lang); if(v)u.voice=v;
    u.onend=()=>{ i++; setTimeout(go,300); };
    speechSynthesis.speak(u);
  };
  go();
}
function toggleSound(){
  soundOn=!soundOn;
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('muteBtn').textContent = soundOn?'🔊':'🔇';
}

function numToWord(n){
  const o=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n<20)return o[n];
  if(n<100)return t[Math.floor(n/10)]+(n%10?' '+o[n%10]:'');
  return 'One Hundred';
}
function makeNums(max){ const a=[]; for(let i=0;i<=max;i++) a.push({n:i,word:numToWord(i)}); return a; }
function makeTables(f,t){ const a=[]; for(let x=f;x<=t;x++){ const r=[],s=[]; for(let i=1;i<=10;i++){ r.push(x+' × '+i+' = '+x*i); s.push(x+' times '+i+' is '+x*i); } a.push({n:x,rows:r,spoken:s}); } return a; }
function shuff(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let curItems=[],curPoem=null,curLesson=null,curTable=null,curStory=null,curWriting=null,curQuiz=null,curMatch=null,curMiss=null;

function setH(t,s){ hTitle.textContent=t; hSub.textContent=s; backBtn.style.visibility = state.view==='home'?'hidden':'visible'; }
function goHome(){ state={level:null,cat:null,view:'home'}; renderHome(); }
function goLevel(k){ state={level:k,cat:null,view:'level'}; renderLevel(); }
function goCat(c){ state.cat=c; state.view='cat'; renderCategory(); }
function goBack(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(state.view==='home') return;
  if(state.view==='level'){state={level:null,cat:null,view:'home'};renderHome();return;}
  if(state.view==='advanced'){state={level:null,cat:null,view:'home',advSubj:null,advChap:null};renderHome();return;}
  if(state.view==='adv-subj'){state.view='advanced';renderAdvancedLessons();return;}
  if(state.view==='adv-chap'){state.view='adv-subj';renderAdvSubject();return;}
  state.view='level'; state.cat=null; renderLevel();
}

function renderCategory(){
  const cid=state.cat; const cat=CATS[cid]; const d=CONTENT[cid];

  if(d.t==='cards'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>cardHTML(it,i)).join('')+'</div>';
  } else if(d.t==='opposites'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="opp-card" onclick="tapOpp(${i})">
        <div class="opp-side"><div class="opp-pic" style="font-size:${it.ls}">${it.le}</div><div class="opp-label">${it.l}</div></div>
        <div class="opp-arrow">↔️</div>
        <div class="opp-side"><div class="opp-pic" style="font-size:${it.rs}">${it.re}</div><div class="opp-label">${it.r}</div></div>
      </button>`).join('')+'</div>';
  } else if(d.t==='info'){
    screen.innerHTML='<div class="grid info-grid">'+curItems.map((it,i)=>`
      <button class="card info" style="--c:${cat.c}" onclick="tapInfo(${i})">
        <span class="emo">${it.emoji}</span><span class="ttl">${it.main}</span><span class="txt">${it.text}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='poemlist'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="card" style="--c:${cat.c}" onclick="openPoem(${i})">
        <span class="emo">${it.emoji}</span><span class="ttl">${it.title}</span><span class="sub">Tap to listen 🎧</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='story'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="card" style="--c:${cat.c}" onclick="openStory(${i})">
        <span class="emo">${it.emoji}</span><span class="ttl">${it.title}</span><span class="sub">Tap to read 📖</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='writing'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="card" style="--c:${cat.c}" onclick="openWriting(${i})">
        <span class="emo">${it.emoji}</span><span class="ttl">${it.title}</span><span class="sub">${it.items.length} items</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='lesson'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="card" style="--c:${cat.c}" onclick="openLesson(${i})">
        <span class="emo">${it.emoji}</span><span class="ttl">${it.title}</span><span class="sub">${it.chapter}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='tablelist'){
    screen.innerHTML='<div class="grid">'+curItems.map((t,i)=>`
      <button class="card" style="--c:${cat.c}" onclick="openTable(${i})">
        <span class="emo">✖️</span><span class="ttl">Table of ${t.n}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='square'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="sq-card" onclick="tapSq(${i},'sq')">
        <span class="expr">${it.n}²</span><span class="eq">${it.n} × ${it.n}</span><span class="res">= ${it.val}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='cube'){
    screen.innerHTML='<div class="grid">'+curItems.map((it,i)=>`
      <button class="sq-card" onclick="tapSq(${i},'cube')">
        <span class="expr">${it.n}³</span><span class="eq">${it.n} × ${it.n} × ${it.n}</span><span class="res">= ${it.val}</span>
      </button>`).join('')+'</div>';
  } else if(d.t==='quiz'){
    screen.innerHTML='<div id="quizBox"></div>';
    curQuiz={idx:0,score:0,q:shuff([...d.q]).slice(0,10)};
    drawQuiz();
  } else if(d.t==='missing-letter'){
    curMiss={idx:0,score:0,list:shuff([...curItems]).slice(0,10),mode:'L'};
    drawMissLetter(); return;
  } else if(d.t==='missing-number'){
    curMiss={idx:0,score:0,list:shuff([...curItems]).slice(0,10),mode:'N'};
    drawMissNumber(); return;
  } else if(d.t==='matching'){
    curMatch={sel:null,done:0,items:d.items};
    drawMatch(); return;
  }
  window.scrollTo(0,0);
}

function cardHTML(it,i){
  let v='', ex='', dl='';
  if(it.numTile){ v=`<span class="num-tile" style="background:${it.numTile}">${it.main}</span>`; }
  else if(it.isWord){
    ex='word-item';
    const L=it.main.length;
    dl = L<=6?'s':L<=9?'m':'l';
    v=`<span class="wordtext">${it.main}</span>`;
  }
  else if(it.color && !it.badge && !it.emoji){ v=`<span class="swatch" style="background:${it.color}"></span>`; }
  else if(it.emoji){ v=`<span class="visual">${it.emoji}</span>`; }
  else { v=`<span class="bignum">${it.main}</span>`; }
  return `<button class="item ${ex}" data-len="${dl}" onclick="tap(${i})">
    ${it.badge?`<span class="badge">${it.badge}</span>`:''}${v}
    <span class="label">${it.sub||it.main}</span>
  </button>`;
}

function tap(i){ const it=curItems[i]; if(!it)return; speak(it.say||it.main||it.sub); addStar(); }
function tapOpp(i){ const it=curItems[i]; if(!it)return; speak(it.l+' aur '+it.r); addStar(); }
function tapInfo(i){ const it=curItems[i]; if(!it)return; speak(it.main+'. '+it.text); addStar(); }
function tapSq(i,m){ const it=curItems[i]; if(!it)return; speak(m==='sq'?it.n+' ka square equals '+it.val:it.n+' ka cube equals '+it.val); addStar(); }

/* MISSING LETTER */
function drawMissLetter(){
  if(curMiss.idx>=curMiss.list.length){
    screen.innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Score: ${curMiss.score} / ${curMiss.list.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Wapas</button></div>`;
    speak('Well done!'); return;
  }
  const it=curMiss.list[curMiss.idx];
  const w=it.word;
  const pos=Math.floor(Math.random()*w.length);
  const cor=w[pos];
  const disp=w.split('').map((ch,i)=>i===pos?'<span class="blank">_</span>':ch).join('');
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const opts=[cor];
  while(opts.length<3){ const r=letters[Math.floor(Math.random()*26)]; if(!opts.includes(r))opts.push(r); }
  shuff(opts);
  screen.innerHTML=`<div class="missing-view">
    <div class="qmeta">Question ${curMiss.idx+1} / ${curMiss.list.length} • ⭐ ${curMiss.score}</div>
    <div class="picture">${it.emoji}</div>
    <div class="label">Missing letter dhoondo 👇</div>
    <div class="question">${disp}</div>
    <div class="missing-options">${opts.map(o=>`<button class="mopt" onclick="ansMissL('${o}','${cor}')">${o}</button>`).join('')}</div>
  </div>`;
  speak('Which letter is missing in '+w.split('').join(' '));
}
function ansMissL(o,c){
  const b=document.querySelectorAll('.mopt'); b.forEach(x=>x.disabled=true);
  if(o===c){ curMiss.score++; b.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { b.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('wrong'); if(x.textContent.trim()===c)x.classList.add('right');}); speak('Oops! Answer is '+c); }
  setTimeout(()=>{ curMiss.idx++; drawMissLetter(); },1500);
}
/* MISSING NUMBER */
function drawMissNumber(){
  if(curMiss.idx>=curMiss.list.length){
    screen.innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Score: ${curMiss.score} / ${curMiss.list.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Wapas</button></div>`;
    speak('Well done!'); return;
  }
  const it=curMiss.list[curMiss.idx];
  const n=it.n;
  const mode=Math.floor(Math.random()*3);
  let disp,cor;
  if(mode===0){ disp=`_ , ${n+1} , ${n+2}`; cor=n; }
  else if(mode===1){ disp=`${n-1} , _ , ${n+1}`; cor=n; }
  else { disp=`${n-1} , ${n} , _`; cor=n+1; }
  const opts=[cor];
  while(opts.length<3){ const r=cor+Math.floor(Math.random()*7)-3; if(r>=0 && !opts.includes(r)) opts.push(r); }
  shuff(opts);
  screen.innerHTML=`<div class="missing-view">
    <div class="qmeta">Question ${curMiss.idx+1} / ${curMiss.list.length} • ⭐ ${curMiss.score}</div>
    <div class="picture">🔢</div>
    <div class="label">Missing number dhoondo 👇</div>
    <div class="question" style="font-size:2.4rem">${disp}</div>
    <div class="missing-options">${opts.map(o=>`<button class="mopt" onclick="ansMissN(${o},${cor})">${o}</button>`).join('')}</div>
  </div>`;
  speak('Which number is missing?');
}
function ansMissN(o,c){
  const b=document.querySelectorAll('.mopt'); b.forEach(x=>x.disabled=true);
  if(o===c){ curMiss.score++; b.forEach(x=>{if(parseInt(x.textContent)===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { b.forEach(x=>{if(parseInt(x.textContent)===o)x.classList.add('wrong'); if(parseInt(x.textContent)===c)x.classList.add('right');}); speak('Oops! Answer is '+c); }
  setTimeout(()=>{ curMiss.idx++; drawMissNumber(); },1500);
}
/* MATCHING */
function drawMatch(){
  const it=curMatch.items;
  const L=it.map(x=>x.left);
  const R=shuff([...it.map(x=>x.right)]);
  screen.innerHTML=`<div class="match-view"><h2>🎯 Match the Following</h2>
    <div class="match-cols">
      <div class="match-col"><h3>Left</h3>${L.map(l=>`<button class="match-btn" data-side="L" data-val="${l}" onclick="clickM(this)">${l}</button>`).join('')}</div>
      <div class="match-col"><h3>Right</h3>${R.map(r=>`<button class="match-btn" data-side="R" data-val="${r}" onclick="clickM(this)">${r}</button>`).join('')}</div>
    </div>
    <div class="poem-actions"><button class="btn primary" onclick="renderCategory()">↩️ Wapas</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function clickM(b){
  if(b.classList.contains('done'))return;
  const s=b.dataset.side, v=b.dataset.val;
  if(s==='L'){
    document.querySelectorAll('[data-side="L"]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); curMatch.sel=b; speak(v);
  } else {
    if(!curMatch.sel){ speak('Pehle left se choose karo'); return; }
    const lv=curMatch.sel.dataset.val;
    const cor=curMatch.items.find(x=>x.left===lv);
    if(cor && cor.right===v){
      curMatch.sel.classList.remove('sel'); curMatch.sel.classList.add('done'); b.classList.add('done');
      curMatch.sel=null; curMatch.done++; speak('Correct!'); addStar();
      if(curMatch.done===curMatch.items.length) setTimeout(()=>alert('🎉 Shabaash!'),400);
    } else {
      b.classList.add('err'); curMatch.sel.classList.remove('sel'); curMatch.sel=null;
      speak('Try again'); setTimeout(()=>b.classList.remove('err'),700);
    }
  }
}

/* QUIZ */
function drawQuiz(){
  const box=document.getElementById('quizBox'); if(!box)return;
  if(curQuiz.idx>=curQuiz.q.length){
    const p=curQuiz.score===curQuiz.q.length;
    box.innerHTML=`<div class="result"><div style="font-size:4rem">${p?'🏆':'🌟'}</div><h2>Score: ${curQuiz.score} / ${curQuiz.q.length}</h2><button class="btn primary" onclick="renderCategory()">🔄 Phir Se</button></div>`;
    speak(p?'Perfect score!':'You scored '+curQuiz.score+' out of '+curQuiz.q.length);
    return;
  }
  const q=curQuiz.q[curQuiz.idx];
  box.innerHTML=`<div class="quiz"><div class="qmeta">Question ${curQuiz.idx+1} / ${curQuiz.q.length} • ⭐ ${curQuiz.score}</div>
    <h2 class="qtext">${q.q}</h2>
    <div class="options">${q.o.map(o=>`<button class="opt" onclick="ansQuiz('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
  </div>`;
  speak(q.q);
}
function ansQuiz(o){
  const q=curQuiz.q[curQuiz.idx];
  const opts=document.querySelectorAll('.opt'); opts.forEach(x=>x.disabled=true);
  if(o===q.a){ curQuiz.score++; opts.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('right');}); speak('Correct!'); addStar(); }
  else { opts.forEach(x=>{if(x.textContent.trim()===o)x.classList.add('wrong'); if(x.textContent.trim()===q.a)x.classList.add('right');}); speak('Correct answer is '+q.a); }
  setTimeout(()=>{ curQuiz.idx++; drawQuiz(); },1500);
}

  const el=document.getElementById('adv-ex-'+i);

  el.textContent=ans;

  speak(ans);
  addStar();
}

  addStar();
}

if (typeof ADVANCED_LESSONS !== 'undefined' && ADVANCED_LESSONS.maths) {

<script>

    // HELPER: Parse Equation (ax + by = c)

    function parseEq(equation) {
        equation = equation.replace(/\s+/g, '').toLowerCase();
        let parts = equation.split('=');
        if(parts.length !== 2) throw new Error("Equation mein ek '=' hona chahiye");
        let left = parts[0];
        let right = parts[1];
        
        if(!left) left = "0";
        if(!right) right = "0";
        
        if(left[0] !== '+' && left[0] !== '-') left = '+' + left;
        if(right[0] !== '+' && right[0] !== '-') right = '+' + right;
        
        let parseSide = (str) => {
            let A = 0, B = 0, C = 0;
            let xTerms = str.match(/[+-]\d*\.?\d*x/g) || [];
            let yTerms = str.match(/[+-]\d*\.?\d*y/g) || [];
            
            xTerms.forEach(t => {
                let num = t.replace('x','');
                if(num === '+') A += 1;
                else if(num === '-') A -= 1;
                else A += parseFloat(num);
            });
            yTerms.forEach(t => {
                let num = t.replace('y','');
                if(num === '+') B += 1;
                else if(num === '-') B -= 1;
                else B += parseFloat(num);
            });
            
            let noXY = str.replace(/[+-]\d*\.?\d*x/g, '').replace(/[+-]\d*\.?\d*y/g, '');
            if(noXY && noXY[0] !== '+' && noXY[0] !== '-') noXY = '+' + noXY;
            let constTerms = noXY.match(/[+-]\d*\.?\d+/g) || [];
            constTerms.forEach(t => C += parseFloat(t));
            
            return {A, B, C};
        };
        
        let L = parseSide(left);
        let R = parseSide(right);
        
        return {
            A: L.A - R.A,
            B: L.B - R.B,
            C: R.C - L.C
        };
    }

    // ==========================================
    // HELPER: Solve 2 Variables (Elimination Method)
    // ==========================================
    function solveTwoVars(eq1Str, eq2Str) {
        let eq1 = parseEq(eq1Str);
        let eq2 = parseEq(eq2Str);
        
        let A1 = eq1.A, B1 = eq1.B, C1 = eq1.C;
        let A2 = eq2.A, B2 = eq2.B, C2 = eq2.C;
        
        let det = A1 * B2 - A2 * B1;
        
        if (det === 0) {
            if (C1*B2 - C2*B1 === 0 && A1*C2 - A2*C1 === 0) return { msg: "Infinite Solutions (Anant Hal - Har point solution hai)" };
            return { msg: "No Solution (Koi Hal Nahi - Lines parallel hain)" };
        }
        
        let steps = [];
        let fmtEq = (A, B, C) => {
            let s = "";
            if(A !== 0) s += `${A}x`;
            if(B !== 0) {
                if(B > 0) s += (s ? " + " : "") + `${B}y`;
                else s += (s ? " - " : "-") + `${Math.abs(B)}y`;
            }
            if(!s) s = "0";
            s += ` = ${C}`;
            return s;
        };
        
        steps.push(`<b>Equation 1:</b> ${fmtEq(A1, B1, C1)}`);
        steps.push(`<b>Equation 2:</b> ${fmtEq(A2, B2, C2)}`);
        
        let eliminateX = (A1 !== 0 && A2 !== 0);
        let elimVar = eliminateX ? 'x' : 'y';
        
        steps.push(`<b>Step 1: Elimination Method</b><br>Hum "${elimVar}" ko eliminate karenge taaki sirf ek variable bache.`);
        
        let coeff1 = eliminateX ? A1 : B1;
        let coeff2 = eliminateX ? A2 : B2;
        
        function gcd(x, y) { return y === 0 ? x : gcd(y, x % y); }
        let a = Math.abs(coeff1), b = Math.abs(coeff2);
        let l = (a * b) / (gcd(a, b) || 1);
        
        let mult1 = l / a;
        let mult2 = l / b;
        
        let newA1 = A1 * mult1;
        let newB1 = B1 * mult1;
        let newC1 = C1 * mult1;
        
        let newA2 = A2 * mult2;
        let newB2 = B2 * mult2;
        let newC2 = C2 * mult2;
        
        steps.push(`<b>Step 2: Make coefficients same</b><br>Eq 1 ko ${mult1} se multiply karo: <b>${fmtEq(newA1, newB1, newC1)}</b><br>Eq 2 ko ${mult2} se multiply karo: <b>${fmtEq(newA2, newB2, newC2)}</b>`);
        
        let sign1 = eliminateX ? Math.sign(newA1) : Math.sign(newB1);
        let sign2 = eliminateX ? Math.sign(newA2) : Math.sign(newB2);
        
        let op = (sign1 === sign2) ? 'minus' : 'plus';
        let opText = (sign1 === sign2) ? 'subtract' : 'add';
        let opSymbol = (sign1 === sign2) ? '-' : '+';
        
        let finalA = (sign1 === sign2) ? (newA1 - newA2) : (newA1 + newA2);
        let finalB = (sign1 === sign2) ? (newB1 - newB2) : (newB1 + newB2);
        let finalC = (sign1 === sign2) ? (newC1 - newC2) : (newC1 + newC2);
        
        finalA = Math.round(finalA * 10000) / 10000;
        finalB = Math.round(finalB * 10000) / 10000;
        finalC = Math.round(finalC * 10000) / 10000;
        
        steps.push(`<b>Step 3: ${opText} the equations</b><br>Dono equations ko ${opText} karo.<br>${elimVar} cancel ho gaya. Bacha: <b>${fmtEq(finalA, finalB, finalC)}</b>`);
        
        let remVar = eliminateX ? 'y' : 'x';
        let remCoeff = eliminateX ? finalB : finalA;
        let remAns = finalC / remCoeff;
        remAns = Math.round(remAns * 10000) / 10000;
        
        steps.push(`<b>Step 4: Solve for ${remVar}</b><br>${remCoeff}${remVar} = ${finalC}<br>${remVar} = ${finalC} / ${remCoeff}<br><b>${remVar} = ${remAns}</b>`);
        
        let x_ans, y_ans;
        if(eliminateX) {
            y_ans = remAns;
            let x_num = C1 - B1 * y_ans;
            x_ans = x_num / A1;
        } else {
            x_ans = remAns;
            let y_num = C1 - A1 * x_ans;
            y_ans = y_num / B1;
        }
        x_ans = Math.round(x_ans * 10000) / 10000;
        y_ans = Math.round(y_ans * 10000) / 10000;
        
        let subEq = eliminateX ? `${A1}x + ${B1}(${remAns}) = ${C1}` : `${A1}(${remAns}) + ${B1}y = ${C1}`;
        steps.push(`<b>Step 5: Find ${elimVar}</b><br>Ab ${remVar} = ${remAns} ko Eq 1 mein rakho.<br>${subEq}<br><b>${elimVar} = ${eliminateX ? x_ans : y_ans}</b>`);
        
        steps.push(`<b>✅ Final Answer:</b><br><b>x = ${x_ans}</b><br><b>y = ${y_ans}</b>`);
        
        return { x: x_ans, y: y_ans, html: steps.join('<br><br>') };
    }

    // ==========================================
    // MAIN SOLVER FUNCTION
    // ==========================================
      window.solveCustomEquation = function() {
        var input1 = document.getElementById('customEqInput').value.trim();
        var input2Elem = document.getElementById('customEqInput2');
        var input2 = input2Elem ? input2Elem.value.trim() : "";
        
        var resultDiv = document.getElementById('customEqResult');
        if(!input1) { alert('Kripya equation likhein (jaise 4x + 3 = 15)'); return; }

        // Check for missing signs like 3x2y
        if (/[0-9][a-zA-Z][0-9]/.test(input1) || (input2 && /[0-9][a-zA-Z][0-9]/.test(input2))) {
            resultDiv.innerHTML = '<div style="color:#cc0000; font-weight:bold; padding:15px;">⚠️ Error: Aapne kisi number aur variable ke beech + ya - ka sign miss kar diya hai.<br>Example: Agar aapko 3x + 2y likhna hai, to <b>3x+2y</b> likhein, <b>3x2y</b> nahi.</div>';
            resultDiv.style.display = 'block'; return;
        }

        // Helper: Decimal to Fraction
        function toFraction(x) {
            if (Number.isInteger(x)) return { num: x, den: 1 };
            let sign = x < 0 ? -1 : 1;
            x = Math.abs(x);
            let bestNum = x, bestDen = 1, minError = Math.abs(x);
            for (let den = 1; den <= 100; den++) {
                let num = Math.round(x * den);
                let error = Math.abs(x - num / den);
                if (error < minError) { minError = error; bestNum = num; bestDen = den; }
                if (error < 1e-6) break;
            }
            return { num: sign * bestNum, den: bestDen };
        }

        function formatFrac(val) {
            let frac = toFraction(val);
            if (frac.den === 1) return `${frac.num}`;
            return `<span style="display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 4px; font-weight:bold; font-size:1.1rem;">
                <span style="border-bottom:2px solid #FFD700; padding:0 4px;">${frac.num}</span>
                <span style="padding:0 4px;">${frac.den}</span>
            </span>`;
        }

        function getVars(str) {
            var matches = str.match(/[a-zA-Z]/g) || [];
            return [...new Set(matches.map(v => v.toLowerCase()))];
        }

        function parseSide(expr, v) {
            expr = expr.replace(/\s+/g, '');
            if(expr === '') expr = '0';
            var vRegex = new RegExp('([+-]?\\d*\\.?\\d*)' + v, 'g');
            var vMatches = expr.match(vRegex) || [];
            var coeff = 0;
            vMatches.forEach(m => {
                var numStr = m.replace(v, '');
                if(numStr === '' || numStr === '+') coeff += 1;
                else if(numStr === '-') coeff -= 1;
                else coeff += parseFloat(numStr);
            });
            var noVar = expr.replace(/[+-]?\d*\.?\d*[a-z]/g, '');
            var constMatches = noVar.match(/[+-]?\d*\.?\d+/g) || [];
            var constVal = 0;
            constMatches.forEach(m => constVal += parseFloat(m));
            return { coeff: coeff, const: constVal };
        }

        // GCD & LCM for Teacher-like explanation
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }

        try {
            var vars1 = getVars(input1);
            var vars2 = input2 ? getVars(input2) : [];
            var allVars = [...new Set([...vars1, ...vars2])];

            if (allVars.length === 0) {
                resultDiv.innerHTML = '<div style="color:#cc0000; padding:15px; font-weight:bold;">⚠️ Error: Kripya variable (jaise x, y, a, b) use karein.</div>';
                resultDiv.style.display = 'block'; return;
            }

            // --- 2 VARIABLE SOLVER ---
            if (allVars.length === 2 && input2) {
                // Validation: Dono equations mein same variables hone chahiye
                if (vars1.length !== 2 || vars2.length !== 2) {
                    resultDiv.innerHTML = '<div style="color:#cc0000; padding:15px; font-weight:bold;">⚠️ Error: Dono equations mein same 2 variables (jaise x aur y) hone chahiye.<br>Eq 1: ' + (vars1.join(',') || 'None') + '<br>Eq 2: ' + (vars2.join(',') || 'None') + '</div>';
                    resultDiv.style.display = 'block'; return;
                }

                var v1 = allVars[0]; var v2 = allVars[1];
                var eq1L = input1.split('=')[0] || '0';
                var eq1R = input1.split('=')[1] || '0';
                var eq2L = input2.split('=')[0] || '0';
                var eq2R = input2.split('=')[1] || '0';

                var A1 = parseSide(eq1L, v1).coeff - parseSide(eq1R, v1).coeff;
                var B1 = parseSide(eq1L, v2).coeff - parseSide(eq1R, v2).coeff;
                var C1 = parseSide(eq1R, v1).const - parseSide(eq1L, v1).const;

                var A2 = parseSide(eq2L, v1).coeff - parseSide(eq2R, v1).coeff;
                var B2 = parseSide(eq2L, v2).coeff - parseSide(eq2R, v2).coeff;
                var C2 = parseSide(eq2R, v1).const - parseSide(eq2L, v1).const;

                var steps = `<b>Equation 1:</b> ${input1}<br><b>Equation 2:</b> ${input2}<br><br>`;

                // Step 1: LCM Explanation
                var l = lcm(Math.abs(A1), Math.abs(A2));
                var mult1 = l / Math.abs(A1);
                var mult2 = l / Math.abs(A2);

                steps += `<b>Step 1: ${v1} ko eliminate karne ki taiyari</b><br>`;
                steps += `Humein <b>${v1}</b> ko hatana hai. Iske liye dono equations mein <b>${v1}</b> ka coefficient (number) same hona chahiye.<br>`;
                steps += `Eq 1 mein ${v1} ka coefficient ${A1} hai aur Eq 2 mein ${A2}. In dono ka LCM ${l} hota hai.<br>`;
                steps += `Isliye, Eq 1 ko <b>${mult1}</b> se aur Eq 2 ko <b>${mult2}</b> se multiply karenge.<br><br>`;
                
                steps += `Eq 1 × ${mult1} → <b>${A1*mult1}${v1} + ${B1*mult1}${v2} = ${C1*mult1}</b><br>`;
                steps += `Eq 2 × ${mult2} → <b>${A2*mult2}${v1} + ${B2*mult2}${v2} = ${C2*mult2}</b><br><br>`;

                // Step 2: Subtract or Add
                var sub = (A1*mult1 * A2*mult2 > 0); // If signs are same, subtract
                var finalB = sub ? (B1*mult1 - B2*mult2) : (B1*mult1 + B2*mult2);
                var finalC = sub ? (C1*mult1 - C2*mult2) : (C1*mult1 + C2*mult2);

                steps += `<b>Step 2: ${v1} ko eliminate karo</b><br>`;
                steps += `Kyunki dono mein ${v1} ka sign ${sub ? 'same (+)' : 'alag (+/-)'} hai, hum dono equations ko <b>${sub ? 'subtract' : 'add'}</b> karenge.<br>`;
                steps += `(${A1*mult1}${v1} ${sub?'-':'+'} ${A2*mult2}${v1}) ${sub?'-':'+'} (${B1*mult1}${v2} ${sub?'-':'+'} ${B2*mult2}${v2}) = ${C1*mult1} ${sub?'-':'+'} ${C2*mult2}<br>`;
                steps += `0 + ${finalB}${v2} = ${finalC}<br><br>`;

                var ansV2 = finalC / finalB;
                steps += `<b>Step 3: ${v2} ki value nikalo</b><br>`;
                steps += `Ab sirf ${v2} bacha hai. Isko akela karne ke liye dono taraf ${finalB} se divide karo.<br>`;
                steps += `${v2} = ${finalC} ÷ ${finalB} = <b>${formatFrac(ansV2)}</b><br><br>`;

                var ansV1 = (C1 - B1 * ansV2) / A1;
                steps += `<b>Step 4: ${v1} ki value nikalo (Substitution Method)</b><br>`;
                steps += `Ab humne ${v2} = ${formatFrac(ansV2)} nikaal liya hai. Isko Eq 1 mein rakho:<br>`;
                steps += `${A1}${v1} + ${B1}(${formatFrac(ansV2)}) = ${C1}<br>`;
                steps += `${A1}${v1} ${B1*ansV2 >= 0 ? '+' : '-'} ${Math.abs(B1*ansV2)} = ${C1}<br>`;
                steps += `${A1}${v1} = ${C1 - B1*ansV2}<br>`;
                steps += `${v1} = ${formatFrac(ansV1)}<br><br>`;

                steps += `<b>✅ Final Answer:</b><br><b>${v1} = ${formatFrac(ansV1)}</b><br><b>${v2} = ${formatFrac(ansV2)}</b>`;
                
                resultDiv.innerHTML = steps;
                resultDiv.style.display = 'block';
                speak(`Final answer is ${v1} equals ${ansV1} and ${v2} equals ${ansV2}`, window.currentLang === 'hi' ? 'hi-IN' : 'en-IN');
                return;
            }

            // --- 1 VARIABLE SOLVER ---
            var v = allVars[0];
            var eqL = input1.split('=')[0] || '0';
            var eqR = input1.split('=')[1] || '0';
            
            var L = parseSide(eqL, v);
            var R = parseSide(eqR, v);

            var varCoeff = L.coeff - R.coeff;
            var constVal = R.const - L.const;

            if(varCoeff === 0) throw new Error("Variable cancel ho gaya. Kripya sahi equation likhein.");

            var stepsHTML = `<b>Equation:</b> ${input1}<br><br>`;

            // Step 1: Constants move
            if (L.const !== 0) {
                stepsHTML += `<b>Step 1: Constants ko doosri taraf le jao</b><br>`;
                stepsHTML += `LHS mein ${L.const > 0 ? '+' : ''}${L.const} hai. Isko 0 karne ke liye dono taraf se ${L.const} ${L.const > 0 ? 'subtract' : 'add'} karo.<br>`;
                stepsHTML += `${L.coeff}${v} ${L.const > 0 ? '+' : '-'} ${Math.abs(L.const)} ${L.const > 0 ? '-' : '+'} ${Math.abs(L.const)} = ${R.const} ${L.const > 0 ? '-' : '+'} ${Math.abs(L.const)}<br>`;
                stepsHTML += `<b>${L.coeff}${v} = ${constVal}</b><br><br>`;
            }

            // Step 2: Divide
            stepsHTML += `<b>Step ${L.const !== 0 ? '2' : '1'}: Variable ko akela karo</b><br>`;
            stepsHTML += `Ab ${varCoeff}${v} ko ${v} banana hai. Isliye dono taraf ${varCoeff} se divide karo.<br>`;
            stepsHTML += `${varCoeff}${v} ÷ ${varCoeff} = ${constVal} ÷ ${varCoeff}<br>`;
            
            var ans = constVal / varCoeff;
            stepsHTML += `<b>${v} = ${formatFrac(ans)}</b><br><br>`;

            // Check Step
            stepsHTML += `<b>Check:</b><br>`;
            let checkStr = input1.replace(new RegExp(v, 'g'), `(${formatFrac(ans)})`);
            stepsHTML += `Original equation mein ${v} = ${formatFrac(ans)} rakho:<br>`;
            stepsHTML += `${checkStr}<br>`;
            stepsHTML += `LHS = ${R.const}, RHS = ${R.const} ✓<br><br>`;
            
            stepsHTML += `<b>✅ Final Answer:</b> ${v} = ${formatFrac(ans)}`;

            resultDiv.innerHTML = stepsHTML;
            resultDiv.style.display = 'block';

            var speakText = input1 + " . " + stepsHTML.replace(/<[^>]*>?/gm, ' ');
            speak(speakText, window.currentLang === 'hi' ? 'hi-IN' : 'en-IN');

        } catch (e) {
            resultDiv.innerHTML = '<div style="color:#cc0000; font-weight:bold; padding:15px;">⚠️ Error: ' + e.message + '</div>';
            resultDiv.style.display = 'block';
        }
    };      
</script>
