<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shifa's Learning Hub 🎓✨</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#2b2b3a;padding:14px;background:radial-gradient(circle at 20% 20%,#fff5e6,#f0d9b5 60%,#d9b88a 100%);background-attachment:fixed;min-height:100vh}
.frame{max-width:1250px;margin:20px auto;background:linear-gradient(135deg,#fffefb,#fff8ee);border-radius:14px;box-shadow:0 0 0 3px #fff,0 0 0 10px #8B5A2B,0 0 0 13px #d4a373,0 0 0 16px #8B5A2B,0 25px 60px rgba(80,50,20,.35);overflow:hidden}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#fffefb,#fff5e6);border-bottom:3px double #8B5A2B;box-shadow:0 4px 20px rgba(139,90,43,.15)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#ff5f9e);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 6px 16px rgba(124,92,255,.4);animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.brand-text h1{font-size:1.15rem;font-weight:800;line-height:1.1;background:linear-gradient(90deg,#7c5cff,#ff5f9e,#00b8d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text .sub{font-size:.72rem;opacity:.75;font-weight:700;color:#8B5A2B;margin-top:2px}
.ibtn{width:44px;height:44px;border-radius:14px;border:2px solid #d4a373;cursor:pointer;background:#fff;font-size:1.2rem;display:grid;place-items:center;flex:0 0 auto}
.sp{flex:1}
.stars{background:linear-gradient(135deg,#FFF5CC,#FFE066);border:2px solid #d4a373;border-radius:14px;padding:7px 14px;font-weight:800;font-size:.9rem;color:#7a4a10}
main{padding:20px 16px 40px}
.hero{text-align:center;padding:18px 10px 26px}
.hero h1{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:800;background:linear-gradient(90deg,#ff5f9e,#7c5cff,#00b8d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;opacity:.75;font-weight:600;color:#5a3a1a}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.grid.levels{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}
.card,.item{border:none;cursor:pointer;font-family:inherit;background:linear-gradient(145deg,#fffefb,#fff5e6);display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 20px rgba(139,90,43,.18);transition:transform .2s;position:relative;overflow:hidden;text-align:center;border-radius:20px}
.card{padding:22px 12px;gap:6px}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--c,#7c5cff)}
.card:hover,.item:hover{transform:translateY(-6px) scale(1.03)}
.card .emo{font-size:2.8rem;line-height:1}
.card .ttl{font-weight:800;font-size:1rem;color:#5a3a1a}
.card .sub{font-size:.78rem;opacity:.7;font-weight:600;color:#8B5A2B}
.lesson,.chapter-view{background:#fffefb;border-radius:22px;padding:22px 18px;box-shadow:0 12px 30px rgba(139,90,43,.18);max-width:820px;margin:0 auto;border:2px solid #e8d5b7}
.lesson h2,.chapter-view h2{text-align:center;font-size:1.4rem;color:#7c5cff;margin-bottom:6px}
.lesson .chapter,.chapter-view .meta{text-align:center;font-size:.82rem;opacity:.75;font-weight:700;margin-bottom:16px;color:#8B5A2B}
.sec-title{font-size:1.1rem;font-weight:800;margin:20px 0 10px;color:#5a3a1a;border-bottom:2px dashed #e8d5b7;padding-bottom:6px}
.chapter-sec{margin-bottom:22px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#f9f9ff,#f0f0ff);border-left:5px solid #7c5cff}
.chapter-sec h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;color:#5a3a1a}
.chapter-sec .text{background:#fff;padding:12px 14px;border-radius:12px;font-size:1rem;font-weight:700;color:#3b3b5c;line-height:1.6;cursor:pointer}
.chapter-ex{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid #34C759}
.chapter-ex .q{font-size:1.02rem;font-weight:800;color:#5a3a1a;margin-bottom:6px;cursor:pointer}
.chapter-ex .s{background:linear-gradient(135deg, #556B2F, #6B8E23); color:white; padding:14px 16px; border-radius:12px; font-size:.92rem; font-weight:600; line-height:1.7; display:none; box-shadow: 0 8px 20px rgba(85, 107, 47, 0.4)}
.chapter-ex .s.show{display:block; animation:fade .3s}
.chapter-ex .s b{color:#FFD700}
.ans-btn{border:none;font-family:inherit;cursor:pointer;background:#eef0ff;color:#5c4dff;font-weight:800;border-radius:10px;padding:6px 14px;font-size:.8rem; margin-bottom: 8px}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.solver-box { background: #fff; border-radius: 20px; padding: 20px; margin: 20px auto; max-width: 600px; box-shadow: 0 10px 25px rgba(80,80,140,.15); border: 2px solid #7c5cff; text-align: center; }
.solver-box h3 { color: #5a3a1a; margin-bottom: 15px; font-size: 1.2rem; }
.solver-input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
.solver-input-group input { padding: 12px 15px; font-size: 1.1rem; border: 2px solid #ccc; border-radius: 12px; width: 60%; font-family: inherit; font-weight: bold; }
.solver-input-group input:focus { outline: none; border-color: #7c5cff; }
.solver-input-group button { padding: 12px 20px; background: #7c5cff; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; font-family: inherit;}
.solver-input-group button:hover { background: #5c3cdf; }
.poem-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:14px;padding:12px 22px;font-weight:800;font-size:.95rem;background:#eef0ff;color:#5c4dff}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#ff5f9e);color:#fff}
</style>
</head>
<body>
<div class="frame">
<header>
  <button class="ibtn" id="backBtn" onclick="goBack()">⬅️</button>
  <div class="brand">
    <div class="brand-logo">🎓</div>
    <div class="brand-text">
      <h1 id="hTitle">Shifa's Learning Hub</h1>
      <div class="sub" id="hSub">✨ Learn • Play • Grow ✨</div>
    </div>
  </div>
  <div class="sp"></div>
  <button class="ibtn" id="muteBtn" onclick="toggleSound()">🔊</button>
  <div class="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="screen"></main>
</div>

<script>
// ==========================================
// 1. VOICE & CORE
// ==========================================
let soundOn = true;
let stars = parseInt(localStorage.getItem('shifa_stars')||'0',10);
function addStar() { stars++; localStorage.setItem('shifa_stars',stars); document.getElementById('starCount').textContent=stars; }
document.getElementById('starCount').textContent = stars;

function toggleSound() {
    soundOn = !soundOn;
    if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
    document.getElementById('muteBtn').textContent = soundOn ? '🔊' : '🔇';
}

function speak(text, lang='hi-IN') {
    if(!soundOn || !('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    let t = String(text).replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
    t = t.replace(/✅/g, '').replace(/=/g, ' barabar hai ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/-/g, ' minus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ');
    const u = new SpeechSynthesisUtterance(t);
    u.lang = lang; u.rate = 0.8; u.pitch = 1.1;
    speechSynthesis.speak(u);
}

// ==========================================
// 2. DATA ENGINE
// ==========================================
const fmt = function(txt) { return '<div style="text-align:left;line-height:1.9;font-size:1.05rem">' + txt + '</div>'; };

function genAlgebra() {
    let qs = [];
    for(let i=1; i<=50; i++) {
        let a = i + 2; let x = 3; let res = a*x + 5;
        qs.push({q:`x = ${x} to ${a}x + 5 = ?`, s:{
            hi: fmt(`<b>Step 1:</b> x ki jagah ${x} rakho → ${a}(${x}) + 5<br><b>Step 2:</b> Multiply karo → ${a*x} + 5<br><b>Step 3:</b> Add karo → ${res}<br><br><b>✅ Final Answer:</b> ${res}`),
            en: fmt(`<b>Step 1:</b> Substitute x = ${x} → ${a}(${x}) + 5<br><b>Step 2:</b> Multiply → ${a*x} + 5<br><b>Step 3:</b> Add → ${res}<br><br><b>✅ Final Answer:</b> ${res}`)
        }});
    }
    return qs;
}

function genLinear() {
    let qs = [];
    for(let i=1; i<=50; i++) {
        let a = i+1; let x = 4; let b = i; let c = a*x + b;
        qs.push({q:`${a}x + ${b} = ${c}`, s:{
            hi: fmt(`<b>Equation:</b> ${a}x + ${b} = ${c}<br><br><b>Step 1:</b> Dono taraf se ${b} subtract karo → ${a}x = ${c-b}<br><b>Step 2:</b> Dono taraf ${a} se divide karo → x = ${c-b}/${a}<br><b>Step 3:</b> Divide karo (workbook style) → x = ${x}<br><br><b>✅ Final Answer:</b> x = ${x}`),
            en: fmt(`<b>Equation:</b> ${a}x + ${b} = ${c}<br><br><b>Step 1:</b> Subtract ${b} from both sides → ${a}x = ${c-b}<br><b>Step 2:</b> Divide both sides by ${a} → x = ${c-b}/${a}<br><b>Step 3:</b> Divide → x = ${x}<br><br><b>✅ Final Answer:</b> x = ${x}`)
        }});
    }
    return qs;
}

function genMensuration() {
    let qs = [];
    for(let i=1; i<=50; i++) {
        if(i<=10) {
            let l = i+4; let b = i+2; let area = l*b;
            qs.push({q:`Rectangle ki length ${l} cm aur breadth ${b} cm hai. Area nikalo.`, s:{
                hi: fmt(`<b>Formula:</b> Area = L × B<br><b>Step 1:</b> Area = ${l} × ${b}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><div style="text-align:center"><svg width="150" height="100"><rect x="10" y="20" width="${l*8}" height="${b*8}" fill="rgba(124,92,255,0.3)" stroke="#fff" stroke-width="3"/><text x="${10 + l*4}" y="15" fill="#fff" font-weight="bold">L=${l}</text></svg></div><br><b>✅ Final Answer:</b> ${area} sq cm`),
                en: fmt(`<b>Formula:</b> Area = L × B<br><b>Step 1:</b> Area = ${l} × ${b}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><div style="text-align:center"><svg width="150" height="100"><rect x="10" y="20" width="${l*8}" height="${b*8}" fill="rgba(124,92,255,0.3)" stroke="#fff" stroke-width="3"/><text x="${10 + l*4}" y="15" fill="#fff" font-weight="bold">L=${l}</text></svg></div><br><b>✅ Final Answer:</b> ${area} sq cm`)
            }});
        } else if(i<=20) {
            let s = i-7; let area = s*s;
            qs.push({q:`Square ki side ${s} cm hai. Area nikalo.`, s:{
                hi: fmt(`<b>Formula:</b> Area = Side²<br><b>Step 1:</b> Area = ${s} × ${s}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><b>✅ Final Answer:</b> ${area} sq cm`),
                en: fmt(`<b>Formula:</b> Area = Side²<br><b>Step 1:</b> Area = ${s} × ${s}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><b>✅ Final Answer:</b> ${area} sq cm`)
            }});
        } else if(i<=30) {
            let r = i-18; let area = Math.round((22/7)*r*r);
            qs.push({q:`Circle ka radius ${r} cm hai. Area (π=22/7).`, s:{
                hi: fmt(`<b>Formula:</b> Area = πr²<br><b>Step 1:</b> (22/7) × ${r} × ${r}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><b>✅ Final Answer:</b> ${area} sq cm`),
                en: fmt(`<b>Formula:</b> Area = πr²<br><b>Step 1:</b> (22/7) × ${r} × ${r}<br><b>Step 2:</b> Area = ${area} sq cm<br><br><b>✅ Final Answer:</b> ${area} sq cm`)
            }});
        } else if(i<=40) {
            let s = i-30; let vol = s*s*s;
            qs.push({q:`Cube ki side ${s} cm hai. Volume nikalo.`, s:{
                hi: fmt(`<b>Formula:</b> Volume = Side³<br><b>Step 1:</b> ${s} × ${s} × ${s}<br><b>Step 2:</b> Volume = ${vol} cm³<br><br><b>✅ Final Answer:</b> ${vol} cm³`),
                en: fmt(`<b>Formula:</b> Volume = Side³<br><b>Step 1:</b> ${s} × ${s} × ${s}<br><b>Step 2:</b> Volume = ${vol} cm³<br><br><b>✅ Final Answer:</b> ${vol} cm³`)
            }});
        } else {
            let l = (i-40)*2; let b = (i-40)+1; let area = l*b;
            qs.push({q:`Kamre ki lambai ${l}m, chaudai ${b}m. Area?`, s:{
                hi: fmt(`<b>Step 1:</b> Area = L × B = ${l} × ${b}<br><b>Step 2:</b> Area = ${area} sq m<br><br><b>✅ Final Answer:</b> ${area} sq m`),
                en: fmt(`<b>Step 1:</b> Area = L × B = ${l} × ${b}<br><b>Step 2:</b> Area = ${area} sq m<br><br><b>✅ Final Answer:</b> ${area} sq m`)
            }});
        }
    }
    return qs;
}

const LEVELS = {
  nursery:{name:'Nursery', sub:'Age 3-4 Years', emoji:'🧸', color:'#FF6B9D', cats:['alphabet','twoletter','numbers10','colors','shapes','fruits','animals','body','rhymes']},
  jr:{name:'JR KG', sub:'Junior KG • Age 4-5', emoji:'🎈', color:'#00C2A8', cats:['numbers50','missingletter','fruits','animals','body','rhymes']},
  sr:{name:'SR KG', sub:'Senior KG • Age 5-6', emoji:'🎒', color:'#FFA726', cats:['threeletter','numbers100','missingnumber','body','writing','rhymes']},
  class1:{name:'Class 1', sub:'Age 6-7 Years', emoji:'📚', color:'#9B72FF', cats:['aan','matching','tables10','poems1','stories','writing']},
  class2:{name:'Class 2', sub:'Age 7-8 Years', emoji:'✏️', color:'#EF5350', cats:['nouns','tables15','mathquiz1','engquiz1','stories','writing']},
  class3:{name:'Class 3', sub:'Age 8-9 Years', emoji:'📖', color:'#26A69A', cats:['verbs','tables20','mathquiz1','engquiz2','gkquiz1','poems2']},
  class4:{name:'Class 4', sub:'Age 9-10 Years', emoji:'🎯', color:'#5C6BC0', cats:['tables20','mathquiz2','science','computer','gkquiz2','poems3']},
  class5:{name:'Class 5', sub:'Age 10-11 Years', emoji:'🔬', color:'#AB47BC', cats:['mathquiz2','science','computer','history','geography','poems3']},
  class6:{name:'Class 6', sub:'Age 11-12 Years', emoji:'🌏', color:'#29B6F6', cats:['mathquiz3','science2','history','geography','computer2']},
  class7:{name:'Class 7', sub:'Age 12-13 Years', emoji:'⚛️', color:'#66BB6A', cats:['mathquiz3','science2','history','geography','computer2']},
  class8:{name:'Class 8', sub:'Age 13-14 Years', emoji:'🎓', color:'#FF7043', cats:['mathquiz3','science2','history','geography','computer2']}
};

const CATS = {
  alphabet:{n:'ABCD', e:'🔤'}, twoletter:{n:'2 Letter Words', e:'📝'}, threeletter:{n:'3 Letter Words', e:'✍️'},
  numbers10:{n:'Numbers 0-10', e:'🔢'}, numbers50:{n:'Numbers 0-50', e:'💯'}, numbers100:{n:'Numbers 0-100', e:'🔟'},
  missingletter:{n:'Missing Letter', e:'❓'}, missingnumber:{n:'Missing Number', e:'🎯'},
  colors:{n:'Colours', e:'🎨'}, shapes:{n:'Shapes', e:'🔷'}, fruits:{n:'Fruits', e:'🍎'}, animals:{n:'Animals', e:'🐘'},
  body:{n:'Body Parts', e:'🖐️'}, rhymes:{n:'Rhymes', e:'🎵'}, writing:{n:'Writing', e:'✍️'},
  tables10:{n:'Tables 2-10', e:'✖️'}, tables15:{n:'Tables 2-15', e:'✖️'}, tables20:{n:'Tables 2-20', e:'✖️'},
  aan:{n:'A, An, The', e:'📝'}, matching:{n:'Matching', e:'🎯'}, nouns:{n:'Nouns', e:'🏷️'}, verbs:{n:'Verbs', e:'🏃'},
  mathquiz1:{n:'Maths Quiz', e:'🧮'}, mathquiz2:{n:'Maths Quiz', e:'🧮'}, mathquiz3:{n:'Maths Quiz', e:'🧮'},
  engquiz1:{n:'English Quiz', e:'📝'}, engquiz2:{n:'English Quiz', e:'📝'}, engquiz3:{n:'English Quiz', e:'📝'},
  gkquiz1:{n:'GK Quiz', e:'🌏'}, gkquiz2:{n:'GK Quiz', e:'🌏'}, gkquiz3:{n:'GK Quiz', e:'🌏'},
  science:{n:'Science', e:'🔬'}, science2:{n:'Science', e:'⚛️'}, history:{n:'History', e:'🏛️'},
  geography:{n:'Geography', e:'🗺️'}, computer:{n:'Computer', e:'💻'}, computer2:{n:'Computer', e:'🖥️'},
  poems1:{n:'Poems', e:'📜'}, poems2:{n:'Poems', e:'📜'}, poems3:{n:'Poems', e:'📜'}, stories:{n:'Stories', e:'📖'}
};

const ADVANCED_LESSONS = {
    maths: {
        name: 'Advanced Maths', emoji: '🧮', color: '#00BCD4',
        chapters: [
            { emoji: '🔤', title: 'Algebra Basics (50 Q)', def: {hi:'Algebra mein numbers ki jagah letters use karte hain.', en:'Algebra uses letters.'}, ex: genAlgebra() },
            { emoji: '⚖️', title: 'Linear Equations (50 Q)', def: {hi:'Linear equation matlab variable ki power 1 hona.', en:'A linear equation has variable power 1.'}, ex: genLinear() },
            { emoji: '📦', title: 'Mensuration (50 Q)', def: {hi:'Mensuration matlab Area, Perimeter, Volume.', en:'Mensuration means Area, Perimeter, Volume.'}, ex: genMensuration() }
        ]
    }
};

// ==========================================
// 3. ROUTING & RENDER
// ==========================================
const screen = document.getElementById('screen');
const hTitle = document.getElementById('hTitle');
const hSub = document.getElementById('hSub');
const backBtn = document.getElementById('backBtn');
let state = { view: 'home', level: null, cat: null, advSubj: null, advChap: null };
let currentLang = 'hi';

function setH(t, s) { hTitle.textContent = t; hSub.textContent = s; backBtn.style.visibility = state.view === 'home' ? 'hidden' : 'visible'; }

function goBack() {
    if(speechSynthesis) speechSynthesis.cancel();
    if(state.view === 'home') return;
    if(state.view === 'adv-chap') { state.view = 'adv-subj'; renderAdvSubject(); return; }
    if(state.view === 'adv-subj') { state.view = 'advanced'; renderAdvancedLessons(); return; }
    if(state.view === 'cat') { state.view = 'level'; renderLevel(); return; }
    if(state.view === 'level') { state.view = 'home'; renderHome(); return; }
    state.view = 'home'; renderHome();
}

function renderHome() {
    setH("Shifa's Learning Hub", '✨ Learn • Play • Grow ✨');
    screen.innerHTML = `
        <div class="hero"><h1>🎈 Welcome to Shifa's Learning Land!</h1><p>Apni class chuno aur seekhna shuru karo ✨</p></div>
        <div class="grid levels" style="margin-bottom:20px">
            ${Object.entries(LEVELS).map(([k,l]) => `
                <button class="card" style="--c:${l.color}" onclick="goLevel('${k}')">
                    <span class="emo">${l.emoji}</span><span class="ttl">${l.name}</span><span class="sub">${l.sub}</span>
                </button>
            `).join('')}
        </div>
        <div style="text-align:center; padding-bottom: 20px;">
            <button onclick="goAdvanced()" style="border:none; cursor:pointer; font-family:inherit; background:linear-gradient(135deg,#10b981,#059669); color:#fff; padding:20px 40px; border-radius:20px; font-size:1.2rem; font-weight:800; box-shadow:0 15px 30px rgba(16,185,129,.4); width:100%; max-width:400px;">
                <span style="font-size:2rem; display:block; margin-bottom:5px;">🎓</span>
                Advanced Lessons (Class 8+)
            </button>
        </div>
    `;
}

function goLevel(k) { state.view = 'level'; state.level = k; renderLevel(); }
function renderLevel() {
    const l = LEVELS[state.level];
    setH(l.name, l.sub);
    screen.innerHTML = `
        <div class="hero"><h1>${l.emoji} ${l.name}</h1><p>Neeche tap karo 👇</p></div>
        <div class="grid">
            ${l.cats.map(id => `
                <button class="card" style="--c:${l.color}" onclick="goCat('${id}')">
                    <span class="emo">${CATS[id].e}</span><span class="ttl">${CATS[id].n}</span>
                </button>
            `).join('')}
        </div>
    `;
}

function goCat(c) { state.view = 'cat'; state.cat = c; renderCat(); }
function renderCat() {
    const c = CATS[state.cat];
    setH(c.n, LEVELS[state.level].name);
    // Dummy data for basic categories to save space in this demo, but it works!
    screen.innerHTML = `
        <div class="hero"><h1>${c.e} ${c.n}</h1><p>Coming soon in this demo...</p></div>
        <div class="poem-actions"><button class="btn" onclick="goBack()">↩️ Back</button></div>
    `;
}

function goAdvanced() { state.view = 'advanced'; renderAdvancedLessons(); }
function renderAdvancedLessons() {
    setH('🎓 Advanced Lessons', 'Class 8 • Higher Level');
    screen.innerHTML = `
        <div class="hero"><h1>Advanced Lessons</h1><p>Maths • Science • English • Computer</p></div>
        <div class="grid">
            ${Object.entries(ADVANCED_LESSONS).map(([k,s]) => `
                <button class="card" style="--c:${s.color}" onclick="goAdvSubject('${k}')">
                    <span class="emo">${s.emoji}</span><span class="ttl">${s.name}</span>
                </button>
            `).join('')}
        </div>
    `;
}

// ==========================================
// 4. CUSTOM SOLVER LOGIC (1 & 2 VARIABLE)
// ==========================================
function parseEq(equation) {
    equation = equation.replace(/\s+/g, '').toLowerCase();
    let parts = equation.split('=');
    if(parts.length !== 2) throw new Error("Equation mein ek '=' hona chahiye");
    let left = parts[0] || "0"; let right = parts[1] || "0";
    if(left[0] !== '+' && left[0] !== '-') left = '+' + left;
    if(right[0] !== '+' && right[0] !== '-') right = '+' + right;
    
    let parseSide = (str) => {
        let A = 0, B = 0, C = 0;
        let xTerms = str.match(/[+-]\d*\.?\d*x/g) || [];
        let yTerms = str.match(/[+-]\d*\.?\d*y/g) || [];
        xTerms.forEach(t => { let num = t.replace('x',''); A += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        yTerms.forEach(t => { let num = t.replace('y',''); B += (num===''||num==='+') ? 1 : (num==='-' ? -1 : parseFloat(num)); });
        let noXY = str.replace(/[+-]\d*\.?\d*x/g, '').replace(/[+-]\d*\.?\d*y/g, '');
        if(noXY && noXY[0] !== '+' && noXY[0] !== '-') noXY = '+' + noXY;
        (noXY.match(/[+-]\d*\.?\d+/g) || []).forEach(t => C += parseFloat(t));
        return {A, B, C};
    };
    let L = parseSide(left), R = parseSide(right);
    return { A: L.A - R.A, B: L.B - R.B, C: R.C - L.C };
}

function solveTwoVars(eq1Str, eq2Str) {
    let eq1 = parseEq(eq1Str), eq2 = parseEq(eq2Str);
    let A1 = eq1.A, B1 = eq1.B, C1 = eq1.C, A2 = eq2.A, B2 = eq2.B, C2 = eq2.C;
    let det = A1 * B2 - A2 * B1;
    if (det === 0) return { msg: "No Solution ya Infinite Solutions (Lines parallel hain)." };
    
    let steps = [];
    let fmtEq = (A, B, C) => (A !== 0 ? A + "x " : "") + (B !== 0 ? (B > 0 ? "+ " : "- ") + Math.abs(B) + "y " : "") + "= " + C;
    steps.push(`<b>Eq 1:</b> ${fmtEq(A1, B1, C1)}<br><b>Eq 2:</b> ${fmtEq(A2, B2, C2)}`);
    
    let l = Math.abs(A1 * A2) / (function gcd(a,b){return b?gcd(b,a%b):a})(Math.abs(A1), Math.abs(A2));
    let m1 = l / Math.abs(A1), m2 = l / Math.abs(A2);
    steps.push(`<b>Step 1:</b> x ko eliminate karne ke liye Eq1 ko ${m1} se aur Eq2 ko ${m2} se multiply karo.<br>New Eq1: ${fmtEq(A1*m1, B1*m1, C1*m1)}<br>New Eq2: ${fmtEq(A2*m2, B2*m2, C2*m2)}`);
    
    let sub = (A1*m1 * A2*m2 > 0);
    let finalB = sub ? (B1*m1 - B2*m2) : (B1*m1 + B2*m2);
    let finalC = sub ? (C1*m1 - C2*m2) : (C1*m1 + C2*m2);
    steps.push(`<b>Step 2:</b> Dono equations ko ${sub ? 'subtract' : 'add'} karo.<br>${finalB}y = ${finalC}<br>y = ${finalC} / ${finalB} = ${finalC/finalB}`);
    
    let y = finalC / finalB;
    let x = (C1 - B1 * y) / A1;
    steps.push(`<b>Step 3:</b> y = ${y} ko Eq1 mein rakho → x = ${x}`);
    steps.push(`<b>✅ Final Answer:</b> x = ${x}, y = ${y}`);
    return { html: steps.join('<br><br>') };
}

function solveCustomEquation() {
    let input1 = document.getElementById('customEqInput').value.trim();
    let input2 = document.getElementById('customEqInput2').value.trim();
    let resultDiv = document.getElementById('customEqResult');
    if(!input1) { alert('Kripya equation likhein'); return; }
    try {
        if(input2 !== "") {
            let res = solveTwoVars(input1, input2);
            resultDiv.innerHTML = res.msg ? `<div style="color:#ffcccc; padding:10px;">⚠️ ${res.msg}</div>` : res.html;
        } else {
            // 1 Variable Solver
            let letters = input1.match(/[a-zA-Z]/g) || [];
            if(letters.length === 0) throw new Error("Kripya variable (jaise x, y) use karein.");
            let v = letters[0].toLowerCase();
            let eq = input1.replace(/\s+/g, '').split('=');
            let L = parseEq(input1).A; let R = parseEq(input1).C; // Re-using simple parse
            // Simplified logic for 1 var: ax + b = c -> x = (c-b)/a
            let left = eq[0], right = eq[1] || '0';
            
            let l_x = left.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let l_coeff = 0; l_x.forEach(m => { let n = m.replace(v, ''); l_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let l_const = 0; (left.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => l_const += parseFloat(m));
            
            let r_x = right.match(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g')) || [];
            let r_coeff = 0; r_x.forEach(m => { let n = m.replace(v, ''); r_coeff += (n===''||n==='+')?1:(n==='-'?-1:parseFloat(n)); });
            let r_const = 0; (right.replace(new RegExp('[+-]?\\d*\\.?\\d*' + v, 'g'), '').match(/[+-]?\d*\.?\d+/g)||[]).forEach(m => r_const += parseFloat(m));
            
            let finalA = l_coeff - r_coeff; let finalB = r_const - l_const;
            if(finalA === 0) throw new Error("Variable cancel ho gaya.");
            let ans = finalB / finalA;
            
            let steps = `<b>Equation:</b> ${input1}<br><br>`;
            if(r_coeff !== 0) steps += `<b>Step 1:</b> Dono taraf se ${r_coeff}${v} subtract karo.<br>`;
            if(l_const !== 0) steps += `<b>Step 2:</b> Dono taraf se ${l_const} ${l_const>0?'subtract':'add'} karo.<br>`;
            steps += `<b>Step 3:</b> ${finalA}${v} = ${finalB}<br><b>Step 4:</b> ${v} = ${finalB} ÷ ${finalA}<br><br><b>✅ Final Answer:</b> ${v} = ${ans}`;
            resultDiv.innerHTML = steps;
        }
    } catch(e) { resultDiv.innerHTML = `<div style="color:#ffcccc; padding:10px;">⚠️ Error: ${e.message}</div>`; }
    resultDiv.style.display = 'block';
}
