<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shifa's Learning Hub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apni CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fa-solid fa-graduation-cap text-blue"></i>
                <h2>Shifa's Learning Hub</h2>
                <p>Welcome back! Please login to continue.</p>
            </div>

            <form action="index.html" method="GET" class="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Student Name" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn btn-blue">Login <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="login-footer">Don't have an account? <a href="#">Sign Up</a></p>
        </div>
    </div>

</body>
</html>
